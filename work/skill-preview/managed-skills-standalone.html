:root[data-theme=&quot;light&quot;] {

* {

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );

    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

  line-height: var(--line-height-normal);
}

  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {

h2 {

  line-height: 1.25;
}

h3,
h4,
h5,
h6 {

}

b,
strong,
th {

}

  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {

}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {

}

.table.table-sm :is(th, td):not(:last-child) {

}

.table :is(.text-end, [align=&quot;right&quot;]) {

  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {

}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

.widget {
  min-width: 0;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

#widget &gt; :not(.card, .widget, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {

  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);

  white-space: normal;
  pointer-events: none;
  user-select: none;

}

  align-items: center;
  gap: 10px;
}

  border: 0;
  background: var(--border);
}

.nav {

  align-items: center;
  gap: 4px;
}

.progress {

  background: var(--muted);

.text-muted {

}

.tabular-nums {

}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;

.viz-controls {

  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,
.nav-link {

  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;

.btn-primary {

  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);

.nav-pills .nav-link.active {

  background-size: 16px 16px;

.viz-carousel:has(&gt; .viz-carousel-controls) {

ot;bodyTokens&quot;:1114,&quot;excerpt&quot;:&quot;# Karing 分流归因：某域名/应用到底走直连还是代理\n\n适用于本机（~/.local/share/com.nebula.karing，TUN=gvisor，fake-ip 池 198.20.0.0/24）。回答「小红书/任意服务为什么断联、是不是走了代理」类问题。\n\n## 关键事实（2026-09 实测）\n\n- 配置源：`karing_routing_group.json`（自定义分流组定义）→ 生成 `service_core.json`（sing-box 配置，`karing_setting.json` 有 tun/dns 全局设置）。`route.rules` 是终判顺序，`route.final` 是当前代理节点出站。\n- **陷阱**：DNS 规则链末尾是无条件 `query_type A/AAAA → dns_fakeip_out` 兜底。凡是不匹配任何直连 DNS 规则（geosite:cn 等）也不匹配显式 fake-ip 组的域名，**照样拿到 fake-ip（198.20.x.x）**，连接时按域名匹配 route.ru&quot;},{&quot;name&quot;:&quot;karing-per-domain-dns&quot;,&quot;description&quot;:&quot;Use when: Karing/sing-box per-domain DNS; campus DNS; docker 172.19 route conflict.&quot;,&quot;keywords&quot;:&quot;Karing/sing-box 按域名指定上游 DNS、规则自动补回、校园 DNS 与 docker 172.19 路由冲突&quot;,&quot;tokens&quot;:31,&quot;bodyTokens&quot;:1426,&quot;excerpt&quot;:&quot;## 适用\n\n让 Karing（sing-box 1.12 结构：`dns.servers[].tag` + `dns.rules[].server`）对**指定域名**走**指定上游 DNS**，并让规则在 Karing GUI 重新生成配置后自动补回。\n\n## 配置事实（本机）\n\n- 生成物 `~/.local/share/com.nebula.karing/service_core.json`：`dns.servers` 是 `{tag,type,server,server_port,...}` 数组；`dns.rules` 里每条规则**自带** `rewrite_ttl`（直连 43200 / fake-ip 1）、`disable_cache`、`client_subnet` → 单域名可独立设 TTL，无需动全局 `karing_setting.json → dns.ttl`。\n- 顺序：`dns.rules` 从上到下第一条命中即生效，末尾是 catch-all `\&quot;name\&quot;: \&quot;dns_fakeip_out[dns]\&quot;`（`q&quot;},{&quot;name&quot;:&quot;karing-route-change-without-gui&quot;,&quot;description&quot;:&quot;Use when Karing routing-rule change without GUI, domain_regex, A/B per-inbound ports.&quot;,&quot;keywords&quot;:&quot;Apply/verify a Karing routing-rule change (custom group, esp. domain_regex) without the GUI, then A/B verify via Karing&#x27;s per-inbound ports.&quot;,&quot;tokens&quot;:30,&quot;bodyTokens&quot;:1710,&quot;excerpt&quot;:&quot;适用于本机 Linux Karing（TUN=gvisor，fake-ip 池 198.20.0.0/24）。用于「给某域名/域名族加直连或代理规则」并当场验证。\n\n## 文件与端口（现场核实，勿写死）\n\n- 源真值：`~/.local/share/com.nebula.karing/karing_routing_group.json` — 自定义分流组；组内字段即 sing-box 匹配器：`domain` / `domain_suffix` / `domain_keyword` / `domain_regex` / `ip_cidr` / `process_name*` / `rule_set`(远程 source JSON) / `rule_set_build_in`。\n- 生成物：`service_core.json` — sing-box 配置。`route.rules` 终判顺序，`route.final` 兜底出站；`dns.rules` 与之成对（自定义组会同时生成 `dns_direct_out[\u003c组名&gt;][dns]` / `d&quot;},{&quot;name&quot;:&quot;karing-to-v2rayn-custom-migration&quot;,&quot;description&quot;:&quot;Use when converting Karing service_core.json to v2rayN Custom profile.&quot;,&quot;keywords&quot;:&quot;Migrate Karing service_core.json to upstream sing-box as a v2rayN Custom profile: batch-DNS collapse, download_detour, guiNDB dual-table registration + Xvfb silent GUI verify, EnableTun/sudo trap, netns sinkhole parity proof&quot;,&quot;tokens&quot;:28,&quot;bodyTokens&quot;:2138,&quot;excerpt&quot;:&quot;# Karing → v2rayN Custom 全量迁移（上游 sing-box）\n\n## 何时用\n把 Karing（sing-box 分叉）的 `~/.local/share/com.nebula.karing/service_core.json` 全量迁移成上游 sing-box 配置、注册为 v2rayN（/opt/v2rayn-bin）的 Custom 条目。要求**行为等价**，不是\&quot;能启动\&quot;。自定义分流组源真值在 `karing_routing_group.json`。\n\n## 铁律\n**`sing-box check` 通过 ≠ 能跑。** check 不校验 .srs 内容与 remote rule-set；batch DNS 塌缩的循环依赖、`detour`/`download_detour` 差异只在 `run` 期爆。必须 `sudo sing-box run` ≥10s 看 FATAL。\n\n## 转换\n转换器（已固化，复用勿重写）：`~/code/general-action/karing-migration/conve&quot;},{&quot;name&quot;:&quot;karing-tun-dns-ttl-disconnect-fix&quot;,&quot;description&quot;:&quot;CN apps disconnect Karing TUN: per-suffix DoT, not global TTL rewrite&quot;,&quot;keywords&quot;:&quot;Fix CN app disconnects under Karing TUN by neutralizing global TTL rewrite with per-suffix DoT routes&quot;,&quot;tokens&quot;:33,&quot;bodyTokens&quot;:2189,&quot;excerpt&quot;:&quot;## 症状与根因\n\n「某 CN 应用在 Karing TUN 下特别容易断联，但关掉 TUN 就好」——先别怀疑分流规则。\n\n根因模式（本机实测）：Karing 的 `rewrite_ttl`（`karing_setting.json` → `dns.ttl`，默认 **43200=12h**）会把它劫持代答的**所有** DNS 应答 TTL 改写成 12 小时；而小红书系域名上游真实 TTL 只有 **5~600 秒**，其边缘/CDN 节点按分钟级摘挂。TUN 开着时本机拿着已下线的 IP 不放最长 12h → 图片/视频/API 连到死节点 → 用户感知「网络断联」，时好时坏；TUN 关时 5~60s 自动翻篇。\n\n**实测结论：小红书流量没有走代理**，全 `direct_out`。所以\&quot;命中代理规则\&quot;是假线索，别顺着它查。\n\n## 用户约束（重要）\n\ncindy 拒绝改 Karing 的 `dns.ttl`：它是**全局旋钮**，改它会动所有域名的缓存。可行方案必须**按域名作用域**、零全局副作用。同理别建议\&quot;Karing 加直连规&quot;},{&quot;name&quot;:&quot;karing-upgrade-preserve-hires-scroll&quot;,&quot;description&quot;:&quot;karing-bin upgrade/reinstall: preserve GTK3 hi-res scrolling; PATH hijack, inode/binding; not fresh installs.&quot;,&quot;keywords&quot;:&quot;karing-bin 升级/重装后如何保住 Karing 的 GTK3 hi-res 平滑滚动：包会重写桌面项与自启动项；备份文件放 autostart 目录会被 systemd 当自启动执行（已知回归），靠 PATH 劫持 + inode/绑定校验确认&quot;,&quot;tokens&quot;:37,&quot;bodyTokens&quot;:1578,&quot;excerpt&quot;:&quot;# Karing 升级后保住 hi-res 平滑滚动\n\n配套 skill：`gtk3-wl-seat-v8-hires-scroll`（补丁本体、rebuild、pacman hook 在那篇）。本篇只管**升级 Karing 本身**（AUR `karing-bin`、本地 PKGBUILD、`pacman -S` 重装）会发生什么、怎么验证、怎么救。\n\n## 升级会动什么\n\n| 升级动作 | 影响 | 是否需要人工介入 |\n|---|---|---|\n| 替换 `/opt/karing/karing`、`/usr/bin/karing` | wrapper 仍 `exec /usr/bin/karing`，自动跟随新版本 | 否 |\n| 覆盖 `/usr/share/applications/karing.desktop`（包内 `Exec=karing %U`） | 系统中该项本来就被 `~/.local/share/applications/` 的同名项覆盖 | 否 |\n| **Karing 自己重写** `~/.local/share/&quot;},{&quot;name&quot;:&quot;karing-zen-ech-http3-sni-miss&quot;,&quot;description&quot;:&quot;Zen/Firefox proxying Karing direct site Chrome reaches; not when Chrome also fails.&quot;,&quot;keywords&quot;:&quot;Diagnose Zen/Firefox still hitting the proxy (old IP, empty TUN host) for a Karing direct site that Chrome already reaches&quot;,&quot;tokens&quot;:32,&quot;bodyTokens&quot;:876,&quot;excerpt&quot;:&quot;# Zen/Firefox 直连站点仍被拦：ECH + HTTP/3 藏 SNI\n\n适用于：Karing TUN 已给某站配直连（`domain` / `domain_keyword`），Chrome 正常，Zen 仍显示旧出口 IP /「访问已被拦截」，TUN 连接列表找不到该域名。\n\n不要先改分流组、不要加 CF anycast CIDR、不要动全局 `dns.ttl`。\n\n## 根因（本机 2026-09-19 对 hybgzs.com 实测）\n\nKaring 域名规则靠 sniff SNI / host。Zen（Firefox）默认 ECH + HTTP/3：\n\n- HTTPS RR 带 `alpn=h3` 和 ECH（真实 TTL ≈ 300s；Karing `rewrite_ttl=43200` 只放大缓存，不是主因）\n- QUIC UDP/443 进 TUN 后 **host 为空**、`destinationIP` 可能也空\n- 域名规则匹配失败 → `route.final`（当前代理节点）\n- CF 看到美国出口 IP → 4&quot;},{&quot;name&quot;:&quot;karousel-window-rules-kwinrc&quot;,&quot;description&quot;:&quot;Edit kwinrc windowRules/tiledDesktops/tiledOutput, reload KWin, diagnose Meta+Space no-op&quot;,&quot;keywords&quot;:&quot;karousel fork live ops: kwinrc Script-karousel windowRules/tiledDesktops/tiledOutput editing with KConfig escaping, in-session reload, KWin window-state probing, Meta+Space no-op diagnosis&quot;,&quot;tokens&quot;:36,&quot;bodyTokens&quot;:1571,&quot;excerpt&quot;:&quot;Live config for karousel lives in `~/.config/kwinrc` group `[Script-karousel]`; it overrides `defaultWindowRules` in `src/lib/config/definition.ts`.\n\n## Read / write the value\nKConfig stores values on ONE line, newline as `\\n`, backslash as `\\\\`. Raw multi-line text (hand edit, heredoc, python `re.sub` replacement — the replacement string eats `\\n`/`\\\\`) reads back as just its first line, so `JSON.parse` throws and karousel loses every rule (full-screen-geometry apps then flo&quot;},{&quot;name&quot;:&quot;kde-kwin-scripting-move-window&quot;,&quot;description&quot;:&quot;KDE Wayland KWin moving window secondary screen; frameGeometry clamp pitfalls&quot;,&quot;keywords&quot;:&quot;KDE Wayland KWin scripting 移窗口到副屏；frameGeometry clamp 坑&quot;,&quot;tokens&quot;:26,&quot;bodyTokens&quot;:817,&quot;excerpt&quot;:&quot;# KWin 6.x Wayland — 把窗口移到副屏（不抢主屏焦点）\n\n需求：KDE Plasma Wayland（kwin_wayland 6.x）上把某个窗口移到指定输出（如笔记本屏 eDP-1），不干扰主屏活动、不动其他窗口。\n\n## 可用机制：KWin scripting DBus\n\n```bash\n# 1. 写脚本（唯一文件名，journal 去重会吃相同内容的重复输出）\ncat &gt; /tmp/move-$RANDOM.js \u003c\u003c&#x27;EOF&#x27;\nfor (const win of workspace.windowList()) {\n  if (String(win.resourceClass) === \&quot;\u003capp-class&gt;\&quot;) {\n    let target = null;\n    for (const s of workspace.screens) { if (s.name === \&quot;eDP-1\&quot;) target = s; }\n    if (target) {\n      workspace.sendClientToScree&quot;},{&qu y-silent-headless-testing&quot;,&quot;description&quot;:&quot;Use for silent kitty tests: hidden text/cwd/env, Xvfb pixels, wrapper checks.&quot;,&quot;keywords&quot;:&quot;Run kitty tests silently on cindy&#x27;s machine (no popups, no focus steal): hidden-instance for text/cwd/env, isolated Xvfb for pixels, shell-wrapper/launcher verification without real launches&quot;,&quot;tokens&quot;:28,&quot;bodyTokens&quot;:2447,&quot;excerpt&quot;:&quot;# Silent kitty testing (no focus steal, no popups)\n\nTest TUI programs / terminal emulation / kitty graphics / kitty config\nWITHOUT popping windows on the user&#x27;s live KDE Wayland session (cindy, kitty\n0.49.2 as of 2026-10; facts first verified 2026-09-05 on 0.48.2 Xvfb/hidden\ninstances — re-verify tier assumptions if kitty major-bumps again).\n\n## Tier choice\n1. **Text-level (stream→screen-buffer semantics)** — `--start-as=hidden` kitty on\n   the REAL display: zero windows ever&quot;},{&quot;name&quot;:&quot;kitty-tabbar-styling-verify&quot;,&quot;description&quot;:&quot;Use: kitty tab bar dark-theme override, OMP spinner, progress_bar edge-bar, A/B testing.&quot;,&quot;keywords&quot;:&quot;Style/debug kitty (0.49 on this machine, facts from 0.48) tab bar: dark-theme.auto.conf override trap, animated OMP title spinner (pie-ring frames), progress_bar edge-bar trap, A/B instance testing&quot;,&quot;tokens&quot;:32,&quot;bodyTokens&quot;:1440,&quot;excerpt&quot;:&quot;## ⚠️ 陷阱一：dark-theme.auto.conf 覆盖一切（2026-08-25 实锤）\n- 配置目录存在 `dark-theme.auto.conf`（或 light 版）时，kitty 每次启动和每次重载（watcher 热重载、ctrl+shift+f5）都把它的颜色叠在 kitty.conf 之上。系统深色模式 → dark 版生效。\n- 症状：改 kitty.conf 颜色\&quot;完全没效果\&quot;；重载/新窗口全部无效；但无头 parse 显示值正确。\n- 正确修法：直接改主题文件里的颜色段（保留 16 色板等其余内容）。**把颜色行删空会让 kitty 主题重置成全默认**（连 powerline/tab 模板都丢，实测）。\n- cindy 最终态（2026-08-26）：dark-theme.auto.conf Tab 段 = active_fg `#a78bfa` / **active_bg `#251b30`（暗紫底，紫字才看得清；`#7e70e6` 亮紫底配紫字对比度不行，用户明确否决）** / inactive_fg `#&quot;},{&quot;name&quot;:&quot;knowledge-lake-ops&quot;,&quo    # JSONL: id,title,channel,duration,view_count,live_status,url\nyts --url \&quot;...\&quot;                    &quot;},{&quot;name&quot;:&quot;zen-firefox-disable-http3-userjs&quot;,&quot;description&quot;:&quot;Use for Zen/Firefox HTTP/3 QUIC user.js prefs, alt-svc; not general debugging.&quot;,&quot;keywords&quot;:&quot;Zen/Firefox 永久禁用/恢复 HTTP/3(QUIC) 或任意 pref：user.js 配方、回退步骤、profile 布局、Karing fake-IP/明文 DNS 陷阱、alt-svc 判定 h3&quot;,&quot;tokens&quot;:32,&quot;bodyTokens&quot;:1125,&quot;excerpt&quot;:&quot;# Disable HTTP/3 (or any pref) in Zen/Firefox\n\n## Pref name (HTTP/3)\n`network.http.http3.enable` — built-in default `true` since Firefox 88. Set `false` to disable QUIC.\nOld `network.http.http3.enabled` does NOT exist; do not write it.\nRelated toggles if ever needed: `network.http.http3.enable_0rtt`, `network.http.http3.enable_kyber`.\n\n## Durable method: user.js\nWrite `user_pref(\&quot;\u003cname&gt;\&quot;, \u003cvalue&gt;);` into the profile&#x27;s `user.js`. Re-applied on EVERY launch → survives `about:co&quot;},{&quot;name&quot;:&quot;zen-nvidia-frame-drop-ablation&quot;,&quot;description&quot;:&quot;Zen-only intermittent frame drops, KDE Wayland/NVIDIA; vblank holes, cadence, dmabuf/WebRender, Chrome/nvidia-powerd A/B.&quot;,&quot;keywords&quot;:&quot;Use for Zen-only intermittent frame drops on KDE Wayland/NVIDIA: prove real vblank holes, separate 30fps cadence vs dmabuf/WebRender, Chrome A/B, nvidia-powerd A/B.&quot;,&quot;tokens&quot;:41,&quot;bodyTokens&quot;:1584,&quot;excerpt&quot;:&quot;# Zen-only 掉帧：先证真实空洞，再分 dmabuf / 节拍 / 驱动\n\n适用：KDE Wayland + NVIDIA，Zen 间歇掉帧而 Chrome 正常；视频或 UI 都可能。Chrome 正常 = 系统/KWin 全局没坏，优先 Zen 的 WebRender/dmabuf 路径。\n\n## 0. 先钉环境与窗口\n\n```bash\npgrep -af &#x27;/opt/zen-browser-bin/zen-bin&#x27; | head\n# 活跃 profile：看哪个 profile 的 lock -&gt; 127.0.1.1:+\u003cmainpid&gt;\nls -l ~/.zen/*/lock\n```\n\n窗口→输出用一次性 KWin 脚本（`org.kde.kwin.Scripting`，小写 kwin；`/Scripting`）：`~/.local/share/kwin/scripts/\u003cname&gt;/contents/code/main.js` 里 `print(\&quot;MARKER \&quot;+JSON.stringify(...))`，`loadScrip&quot;},{&quot;name&quot;:&quot;zen-webdriver-pref-poisoning-sync-death&quot;,&quot;description&quot;:&quot;Firefox/Zen sync dead, NS_ERROR_UNKNOWN_HOST dummy/fxa host, WebDriver prefs in real profile.&quot;,&quot;keywords&quot;:&quot;Diagnose Firefox/Zen sync fully dead with NS_ERROR_UNKNOWN_HOST on a dummy/fxa host: WebDriver RecommendedPreferences left behind in a real profile, plus the cleanup procedure&quot;,&quot;tokens&quot;:34,&quot;bodyTokens&quot;:1374,&quot;excerpt&quot;:&quot;# Firefox/Zen sync dead: WebDriver pref poisoning\n\n## Symptom signature\n\nSync is dead across **all** engines — desktop-to-desktop *and* desktop-to-Firefox-Android.\nThe UI shows the account signed in. `about:sync-log` (`\u003cprofile&gt;/weave/logs/`) gains an\nerror file roughly every hour, all containing:\n\n```\nPOST https://{server}/dummy/fxa/oauth/token failed: NS_ERROR_UNKNOWN_HOST\nSync.SyncAuthManager ERROR  Non-authentication error in _fetchTokenForUser\nSync.Status  DEBUG  Status.&quot;}]&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;managed-preview&#x27;);
  const content = document.getElementById(&#x27;omp-preview-content&#x27;);
  const footer = document.getElementById(&#x27;omp-preview-footer&#x27;);
  const catalog = JSON.parse(document.getElementById(&#x27;omp-preview-catalog&#x27;).textContent);
  const byName = new Map(catalog.map(s =&gt; [s.name,s]));
  const defaults = {screen:&#x27;auto&#x27;,query:&#x27;KWin&#x27;,page:0,selected:null,read:false,mode:&#x27;lazy&#x27;,pinned:[&#x27;silent-testing-no-foreground-windows&#x27;],saved:false};
  let state = {...defaults};
  const escape = s =&gt; String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
  function restore(value) {
    if (!value || typeof value !== &#x27;object&#x27;) return;
    if ([&#x27;auto&#x27;,&#x27;search&#x27;,&#x27;settings&#x27;,&#x27;write&#x27;].includes(value.screen)) state.screen=value.screen;
    if (typeof value.query===&#x27;string&#x27;) state.query=value.query.slice(0,150);
    if ([&#x27;lazy&#x27;,&#x27;all&#x27;].includes(value.mode)) state.mode=value.mode;
    if (Array.isArray(value.pinned)) state.pinned=value.pinned.filter(n=&gt;byName.has(n));
    if (byName.has(value.selected)) state.selected=value.selected;
    state.read=value.read===true;
  }
  restore(window.openai?.widgetState?.privateContent);
  function save() {
    const api=window.openai;
    if (api?.setWidgetState) api.setWidgetState({modelContent:{preview:&#x27;managed-skills&#x27;,screen:state.screen,mode:state.mode,pinned:state.pinned,selected:state.selected},privateContent:state}).catch(()=&gt;{});
  }
  function pinnedTokens() {return state.pinned.reduce((n,id)=&gt;n+(byName.get(id)?.tokens??0),0);}
  function resultDescription(skill) {return skill.keywords || skill.description;}
  function detail(skill) {
    const pinned=state.pinned.includes(skill.name);
    return `&lt;div class=&quot;detail&quot;&gt;&lt;div class=&quot;detail-heading&quot;&gt;&lt;div&gt;&lt;div class=&quot;skill-name&quot;&gt;${escape(skill.name)}&lt;/div&gt;&lt;div class=&quot;muted small&quot;&gt;正文约 ${skill.bodyTokens.toLocaleString()} tok · 原文节选&lt;/div&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-pin=&quot;${escape(skill.name)}&quot;&gt;${pinned?&#x27;取消下次常驻&#x27;:&#x27;下次会话常驻&#x27;}&lt;/button&gt;&lt;/div&gt;&lt;pre&gt;${escape(skill.excerpt)}…&lt;/pre&gt;&lt;/div&gt;`;
  }
  function autoScreen() {
    const ids=[&#x27;kwin-pointer-warp-cross-screen&#x27;,&#x27;gtk3-wl-seat-v8-hires-scroll&#x27;,&#x27;omp-desktop-pet&#x27;];
    const items=ids.map(n=&gt;byName.get(n)).filter(Boolean);
    const selected=items[0];
    content.innerHTML=`&lt;div class=&quot;user&quot;&gt;&lt;span class=&quot;speaker&quot;&gt;你&lt;/span&gt;KWin 下想用快捷键把鼠标跳到另一块屏幕。&lt;/div&gt;
      &lt;p class=&quot;speech&quot;&gt;先找一下已有的 KWin 操作经验。&lt;/p&gt;
      &lt;div class=&quot;tool&quot;&gt;&lt;div class=&quot;tool-title&quot;&gt;&lt;span class=&quot;check&quot;&gt;✓&lt;/span&gt;&lt;span class=&quot;tool-name&quot;&gt;skill_search&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;拟新增&lt;/span&gt;&lt;span class=&quot;muted&quot;&gt;KWin pointer warp&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;small muted&quot;&gt;检索本地技能，返回名称、description 和读取地址。&lt;/div&gt;
      &lt;div class=&quot;small muted&quot;&gt;本地候选 · ${items.length} 条 · description 完整显示&lt;/div&gt;
      ${items.map((s,i)=&gt;`&lt;div class=&quot;candidate ${i===0?&#x27;chosen&#x27;:&#x27;&#x27;}&quot;&gt;&lt;div&gt;${i===0?&#x27;›&#x27;:&#x27;·&#x27;} ${escape(s.name)}&lt;/div&gt;&lt;div class=&quot;candidate-description&quot;&gt;${escape(resultDescription(s))}&lt;/div&gt;&lt;div class=&quot;candidate-description small path&quot;&gt;skill://${escape(s.name)}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;
      ${state.read?`&lt;div class=&quot;tool&quot;&gt;&lt;div class=&quot;tool-title&quot;&gt;&lt;span class=&quot;check&quot;&gt;✓&lt;/span&gt;&lt;span class=&quot;tool-name&quot;&gt;read&lt;/span&gt;&lt;span class=&quot;path&quot;&gt;skill://${escape(selected.name)}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;small muted&quot;&gt;已读取选中的正文 · 约 ${selected.bodyTokens.toLocaleString()} tok&lt;/div&gt;&lt;/div&gt;${detail(selected)}&lt;div class=&quot;entry&quot;&gt;› 继续处理你的任务&lt;span class=&quot;cursor&quot;&gt;&lt;/span&gt;&lt;/div&gt;`:`&lt;div class=&quot;actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;primary cursor-interaction&quot; data-action=&quot;next&quot;&gt;下一步：读取选中的技能&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-action=&quot;miss&quot;&gt;查看未命中场景&lt;/button&gt;&lt;/div&gt;`}`;
  }
  function matches() {
    const terms=state.query.toLowerCase().trim().split(/\s+/).filter(Boolean);
    return catalog.map(s=&gt;({s,score:terms.reduce((n,t)=&gt;n+(s.name.toLowerCase().includes(t)?5:0)+(s.description.toLowerCase().includes(t)?2:0)+(s.keywords.toLowerCase().includes(t)?1:0),0)})).filter(r=&gt;terms.length===0||terms.every(t=&gt;`${r.s.name} ${r.s.description} ${r.s.keywords}`.toLowerCase().includes(t))).sort((a,b)=&gt;b.score-a.score||a.s.name.localeCompare(b.s.name)).map(r=&gt;r.s);
  }
  function results() {
    const target=root.querySelector(&#x27;#omp-search-results&#x27;);
    const all=matches();
    const pages=Math.max(1,Math.ceil(all.length/5));state.page=Math.min(state.page,pages-1);
    const visible=all.slice(state.page*5,state.page*5+5);
    target.innerHTML=all.length?`&lt;div class=&quot;small muted&quot;&gt;${all.length} 条匹配 · description 完整显示&lt;/div&gt;&lt;div class=&quot;list&quot;&gt;${visible.map(s=&gt;`&lt;div class=&quot;skill-row&quot;&gt;&lt;div class=&quot;skill-main&quot;&gt;&lt;div class=&quot;skill-name&quot;&gt;${state.pinned.includes(s.name)?&#x27;★ &#x27;:&#x27;&#x27;}${escape(s.name)}&lt;/div&gt;&lt;div class=&quot;skill-description&quot;&gt;${escape(resultDescription(s))}&lt;/div&gt;&lt;div class=&quot;skill-description path&quot;&gt;skill://${escape(s.name)}&lt;/div&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-read=&quot;${escape(s.name)}&quot;&gt;读取&lt;/button&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;pages&quot;&gt;&lt;span class=&quot;small muted&quot;&gt;${state.page+1} / ${pages}&lt;/span&gt;&lt;div&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-action=&quot;prev&quot; ${state.page===0?&#x27;disabled&#x27;:&#x27;&#x27;}&gt;上一页&lt;/button&gt; &lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-action=&quot;more&quot; ${state.page===pages-1?&#x27;disabled&#x27;:&#x27;&#x27;}&gt;下一页&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`:`&lt;div class=&quot;empty&quot;&gt;&lt;div&gt;没有匹配的本地技能&lt;/div&gt;&lt;div class=&quot;small muted&quot;&gt;可以换一个关键词，或浏览全部目录。&lt;/div&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-action=&quot;all&quot;&gt;浏览全部 188 条&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`;
    if(state.selected&amp;&amp;byName.has(state.selected)) target.insertAdjacentHTML(&#x27;beforeend&#x27;,`&lt;div class=&quot;tool&quot;&gt;&lt;span class=&quot;check&quot;&gt;✓&lt;/span&gt; &lt;span class=&quot;tool-name&quot;&gt;read&lt;/span&gt; &lt;span class=&quot;path&quot;&gt;skill://${escape(state.selected)}&lt;/span&gt;&lt;/div&gt;${detail(byName.get(state.selected))}`);
  }
  function searchScreen() {
    content.innerHTML=`&lt;h2 class=&quot;view-title&quot;&gt;本地技能&lt;/h2&gt;&lt;div class=&quot;view-subtitle&quot;&gt;/skills local · 拟新增的本地搜索入口&lt;/div&gt;&lt;label for=&quot;omp-local-query&quot; class=&quot;small&quot;&gt;名称或关键词&lt;/label&gt;&lt;div class=&quot;search&quot;&gt;&lt;input id=&quot;omp-local-query&quot; type=&quot;search&quot; value=&quot;${escape(state.query)}&quot; placeholder=&quot;例如 KWin、模型、kitty&quot; autocomplete=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;/div&gt;&lt;div id=&quot;omp-search-results&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;`;
    results();
    root.querySelector(&#x27;#omp-local-query&#x27;).addEventListener(&#x27;input&#x27;,event=&gt;{state.query=event.target.value;state.page=0;state.selected=null;results();save();});
  }
  function settingsScreen() {
    const pinned=state.pinned.map(n=&gt;byName.get(n)).filter(Boolean);
    content.innerHTML=`&lt;h2 class=&quot;view-title&quot;&gt;技能目录&lt;/h2&gt;&lt;div class=&quot;view-subtitle&quot;&gt;/settings → Skills · 设置在下次新会话生效&lt;/div&gt;
      &lt;div class=&quot;setting&quot;&gt;&lt;div&gt;&lt;div&gt;目录模式&lt;/div&gt;&lt;div class=&quot;small muted&quot;&gt;固定技能常驻，其余按需检索&lt;/div&gt;&lt;/div&gt;&lt;select aria-label=&quot;目录模式&quot; id=&quot;omp-catalog-mode&quot;&gt;&lt;option value=&quot;lazy&quot; ${state.mode===&#x27;lazy&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;按需发现&lt;/option&gt;&lt;option value=&quot;all&quot; ${state.mode===&#x27;all&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;全量目录&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
      &lt;div class=&quot;token-pair&quot;&gt;&lt;div&gt;&lt;div class=&quot;small muted&quot;&gt;当前全量目录 · 实测&lt;/div&gt;&lt;div class=&quot;token-number&quot;&gt;5,650 &lt;span class=&quot;small&quot;&gt;tok&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;meter&quot;&gt;&lt;span style=&quot;width:100%&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;small muted&quot;&gt;${state.mode===&#x27;lazy&#x27;?&#x27;拟议常驻预算 · 目标&#x27;:&#x27;下次会话 · 全量&#x27;}&lt;/div&gt;&lt;div class=&quot;token-number&quot;&gt;${state.mode===&#x27;lazy&#x27;?&#x27;≤ 500&#x27;:&#x27;5,650&#x27;} &lt;span class=&quot;small&quot;&gt;tok&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;meter&quot;&gt;&lt;span style=&quot;width:${state.mode===&#x27;lazy&#x27;?&#x27;8.85&#x27;:&#x27;100&#x27;}%&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
