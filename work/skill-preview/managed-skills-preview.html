 / 12 GiB 已过期），无 GPU，用户 `ubuntu`, shell **zsh**（`~/.zshrc`，**不是** .bashrc）。\n- 版本会漂移：2026-09-29 复刻时本地是 上游 v18.1.10 + 30 p"},{"name":"omp-camelia-config-sync","description":"Incrementally sync ~/.omp agent config to camelia; not full arm64 replica","keywords":"Incremental sync of local ~/.omp agent config onto camelia (source ff + arm64-natives fast-forward + provider merge); not a full arm64 replica or session copy.","tokens":25,"bodyTokens":2172,"excerpt":"Use when the user asks to sync cindy's laptop `~/.omp` config to camelia. Do not copy sessions or replace `agent.db` / `history.db` / `models.db` unless asked. Full replica is `skill://omp-camelia-arm64-replica`.\n\nCamelia runs omp **from source** (`~/code/oh-my-pi` + `bun`), so \"sync omp\" means: bring the source tree to local `master`, refresh the arm64 native addon to the same release, then sync config.\n\n## Facts (2026-11-04)\n\n- SSH: `ssh -o BatchMode=yes camelia-cc`. **Wrap"},{"name":"omp-cc-cloak-verify","description":"Use when validating omp Claude-Code cloak via relay validators, captured wire payload","keywords":"Verify omp Claude-Code cloak against relay validators by capturing wire payload","tokens":24,"bodyTokens":2022,"excerpt":"# Verify omp's CC cloak against a relay's real validator\n\nUse when a `claude_code_only` / CC-fingerprint-gated relay rejects omp (`503 No available accounts: this group only allows Claude clients`, `403 restricted to Claude Code clients`), or when auditing whether a cloak change actually satisfies the gate. Ground truth = the relay's own validator source, run against omp's own captured bytes. Never infer from docs.\n\n## 1. Get the validator source\n\nGitHub raw works when the AP"},{"name":"omp-contaminated-tree-verify-rig","description":"Verify omp TUI changes only if shared tree broken by concurrent agents","keywords":"Verify omp TUI changes when the shared fork tree is broken by concurrent agents — isolated worktree tests plus a python-PTY + kitty-vt-wasm real-binary probe with a replying mock provider","tokens":25,"bodyTokens":1250,"excerpt":"# Verify omp TUI work when the shared tree is contaminated by concurrent agents\n\nThe ~/code/oh-my-pi worktree is shared by multiple live agents. Their uncommitted\nWIP frequently breaks transpile (`bun test` dies on e.g. a half-edited\n`model-registry.ts` with \"Private name #x must be declared\"), so your own\nverification needs an isolated rig. Two halves: unit tests in a clean worktree,\nand a real-binary PTY probe with a mock provider.\n\n## 1. Isolated test worktree (NOT node_mo"},{"name":"omp-cross-session-recall","description":"Use for omp transcript search across past sessions; not single-session corpus/lineage traps.","keywords":"Searching across omp sessions and transcripts, and the corpus/lineage traps involved","tokens":25,"bodyTokens":991,"excerpt":"# Cross-session recall in this omp fork\n\n## Which tool answers what\n\n| Question | Tool |\n|---|---|\n| \"What did I say/do earlier in THIS session?\" | `history_search` — active branch only (`ctx.sessionManager.getBranch()`), so it survives compaction and `/clear` |\n| \"Did I already solve this in some other session?\" | `session_search` — every transcript under `~/.omp/agent/sessions/` |\n| \"What did a subagent report?\" | `agent://\u003cid>` (bare `agent://` lists registered agents) |\n|"},{"name":"omp-desktop-pet","description":"Use for wire protocol, focus/bg frames, attention dismissal, drag constraints, settle rules.","keywords":"Operate/debug the omp desktop pet: wire protocol (focus/bg frames), attention dismissal semantics, drag algorithm constraints, settle discrimination rules","tokens":25,"bodyTokens":1214,"excerpt":"# omp desktop pet\n\nOperate/debug the omp desktop pet (desktop-pet/omp_pet.py + extensions/pet-bridge.ts pair over $XDG_RUNTIME_DIR/omp-pet.sock).\n\n## Wire protocol (as of 2026-08-29, fork commit a27a5aa)\n→ hello{session,proj,pid,bg?}  bg=true for background sessions (task subagent re-bind in parent process, print/RPC host; hasUI=false). Initial + reconnect identify frames both carry it.\n→ state{thinking|tool|waiting|retry|compact,tool?,detail?,fresh?}\n→ focus                 "},{"name":"omp-find-jev-cascade","description":"Debug or replay omp find waves, thresholds, or judge report","keywords":"Explain, replay, or debug what omp find sends the judge each of its three waves, its thresholds/gates, and the model-facing report","tokens":21,"bodyTokens":1700,"excerpt":"# omp find \u003c-> jev: three-wave anatomy\n\nUse when asked what `find` sends to jev, why a `find` returned (or failed to return) something, how to tune/verify its thresholds, or what the tool actually reports to the model. Routing/config/cache questions belong to `omp-jev-routing-verify`; this skill is the consumer side.\n\n## Architecture\n\n`packages/coding-agent/src/tools/jfind/` is a 4-stage cascade. Only waves 1-3 call the judge; **every** other operation (scan, IDF, ranking, th"},{"name":"omp-find-jev-cascade-audit","description":"Use when auditing or explaining omp find's jev three-round cascade","keywords":"审计/讲解 omp find 的 jev 三轮 cascade：每轮传给 judge 的 wire state、阈值链、失败语义、缓存库取证与 jegrep 基准复用","tokens":24,"bodyTokens":2200,"excerpt":"# omp find × jev 审计与讲解\n\n用户问「find 怎么用 jev / 每轮传了什么 / 最终给了什么 / 有没有 benchmark」时按此取证。\n\n## 1. 代码位置\n\n| 关注点 | 文件 |\n|---|---|\n| 三轮编排与常量 | `packages/coding-agent/src/tools/jfind/cascade.ts` |\n| 三种 request 形状 + criteria | `packages/coding-agent/src/tools/jfind/questions.ts` |\n| 题面模板 | `packages/coding-agent/src/prompts/judge/find.json` |\n| 窗口/骨架/区间合并 | `jfind/passages.ts` |\n| 文件清单与树渲染 | `jfind/tree.ts` |\n| lexical 先验（native grep + IDF） | `jfind/lexical.ts` |\n| 工具契约与最终报告 | `jfind/index."},{"name":"omp-find-session-by-topic","description":"Use when asked which past omp session covered topic/project; 找之前 workbuddy 会话","keywords":"Use when asked which past omp session covered a topic/project (e.g. \"找一下之前那个 workbuddy 的会话\"); returns session id + resume command","tokens":25,"bodyTokens":445,"excerpt":"Locate the omp session that covered a given topic, then hand back an id + resume command.\n\n## 1. Search transcripts\n\n`session_search` with `query` = the literal keywords (topic, repo name, Chinese term), `regex: false`, `scope: all`. Run 2 queries (project name + Chinese/alias form) in parallel — one query silently misses sessions that used the other spelling.\n\nRank hits by match count, not recency; the densest session is almost always the one being asked about.\n\n## 2. Get th"},{"name":"omp-find-vs-grep-benchmark","description":"Benchmark find vs grep arms, scoring recipe, gold suites, baselines, repo audit","keywords":"Benchmark omp's semantic find (judge/jev arm) against grep-only agent arms using jegrep's gold-labeled Postgres/CPython/linux/k8s suites in isolated omp configs; includes scoring recipe, known result baselines, and find-bench repo audit findings.","tokens":28,"bodyTokens":2253,"excerpt":"Measure whether omp's `find` tool (cascade + native jev judge) beats an agent running plain `grep`/`glob`/`bash`, or whether `find` alone already matches jegrep's published numbers.\n\n## Why jegrep, not omp\n\nomp ships no retrieval-quality benchmark: only `packages/coding-agent/test/tools/jfind.test.ts` (unit tests of cascade phases) and unrelated `bench/*.bench.ts`. `docs/tools/find.md:18` states the cascade follows [jegrep](https://github.com/can1357/jegrep) — same author. je"},{"name":"omp-fork-compat-axis-patch","description":"Adding models.yml/KDL compat axis to omp fork; skip if no catalog/schema/test/binary changes.","keywords":"Adding a new models.yml/KDL compat axis to the omp fork (catalog→ai→config schema→tests→binary), with the materialization and retry-chain traps","tokens":31,"bodyTokens":1038,"excerpt":"# omp fork: add a new `compat` axis end-to-end\n\nRepeatable for the patch series (relay-compat flags like #19/#22/#36/#37/#38 all follow this). Every missed step fails silently, so use the checklist.\n\n## File checklist (all five, in order)\n\n1. `packages/catalog/src/types.ts`\n   - `OpenAICompat`: add the optional field with a doc comment explaining the relay shape it defends against.\n   - `ResolvedOpenAICompat` mirror: sparse override slot (`/** See {@link OpenAICompat.X}. */ X"},{"name":"omp-fork-dangling-work-recovery","description":"Before reset/checkout in ~/code/oh-my-pi: uncommitted/dangling commits, dirty files, clobbered features.","keywords":"Recover or safely revert uncommitted/dangling work in cindy's omp fork (~/code/oh-my-pi): anchor unreachable commits before any reset/checkout, map dirty files to their commit or stash, and re-land a clobbered feature commit onto HEAD","tokens":40,"bodyTokens":1723,"excerpt":"# omp fork: 悬空提交与未提交工作的定位/抢救/重落地\n\n`~/code/oh-my-pi` 是 patch fork。工作区常有并行 agent 留下的未提交改动，且功能本体经常在**被 reset 掉的悬空提交**里。\n\n## 铁律：动工作区之前先锚定\n\n任何 `git checkout -- \u003cfile>` / `rm \u003cuntracked>` / `git reset` / `git stash` 之前：\n\n```bash\ncd ~/code/oh-my-pi\ngit reflog -30                                   # 找 \"reset: moving to ...\" 上方那条 commit\ngit fsck --unreachable --no-progress | awk '/commit/{print $3}' | while read c; do\n  git log -1 --format='%h %ad %s' --date=format:'%m-%d %H:%M' $c; d"},{"name":"omp-fork-history-survey","description":"Broad omp fork commit survey: timeline, patch inventory, pending delta, worktree state","keywords":"Survey omp fork commit history broadly (what shipped when, upstream追版 timeline, patch inventory, pending delta, worktree state) in ~/code/oh-my-pi","tokens":26,"bodyTokens":845,"excerpt":"# omp fork history survey\n\nUse when asked \"看看 omp 最近做了什么 / 范围尽量大\" or to reconstruct fork history and pending upgrade scope. cwd: `~/code/oh-my-pi` (patch fork of can1357/oh-my-pi; backup `origin` = CamelliaV/oh-my-pi).\n\n## Steps\n\n1. Shape + branches + worktree state (one call):\n   ```bash\n   git log --oneline -30; git branch -a -vv | head -40; git status -sb\n   ```\n2. Scale: `git rev-list --count HEAD`; earliest commit `git log --reverse --format='%h %ad %s' --date=short mast"},{"name":"omp-fork-isolate-my-commit","description":"Use when parallel agents interleave uncommitted edits; commit only your changes.","keywords":"Safely commit only your work when parallel agents have interleaved uncommitted edits","tokens":26,"bodyTokens":1071,"excerpt":"# Isolate my commit in ~/code/oh-my-pi when parallel agents have uncommitted edits\n\nSame-file interleaved edits are the norm on this fork (multiple live sessions). Three\nhazards, each with a cheap guard — run the guards, not just the happy path.\n\n## 1. Stage only my paths, and prove the staged hunks are mine\n\n1. `git status --short` — snapshot what exists before touching anything.\n2. `git add` ONLY the exact paths I edited (never `git add -A` / `git commit -a`).\n3. Before com"},{"name":"omp-fork-maintenance","description":"Merging upstream oh-my-pi into cindy fork; stash, stamp x64 firmware, bun, mnemopi.","keywords":"Procedure for fork-maintenance merges of upstream oh-my-pi into cindy's patch fork: baseline safety nets (stash before merging synthetic commits), native firmware stamping (per-worktree, both x64 variants), bun install hygiene (symlinked node_modules lie), merge-verification markers (zero conflict reports ≠ clean), and a debugging pattern for mnemopi test-suite pollution","tokens":32,"bodyTokens":541,"excerpt":"# Workflow: OMP fork patches (cindy builds)\n\nTips that saved real time in the v18.10.0 round:\n\n1. **Never trust a dirty tree against a synthetic upstream.** Run `git status --porcelain` first, then `LC_ALL=C sort -u \u003cfiles>` against the trees-API delta and `git diff --name-only upstream/v\u003cOLD> master`. If anything overlaps with your in-flight patch, `git stash push -u` before touching the merge.\n\n2. **`gen:compat` + `gen:models` need the native .node to be present *and* stamp"},{"name":"omp-fork-merge-upstream","description":"For upstream omp release merges into fork master; not routine branch merges.","keywords":"Merge upstream omp releases into the fork master via synthetic-commit topology with per-conflict adjudication","tokens":23,"bodyTokens":2570,"excerpt":"# OMP fork 上游合入（合成提交拓扑）\n\n用户 2026-08-27 定案：升级方向 = 上游合入 fork master，不是把 fork 补丁重放到上游基线。同功能冲突逐项裁决，禁止粗暴以上游为主。\n\n## 流程\n\n1. 下载官方 tarball：`aria2c -x8 https://github.com/can1357/oh-my-pi/archive/refs/tags/v\u003cX>.tar.gz`（GitHub API/git 协议在本网络不可用，curl/aria2c 走 HTTPS 可以）。最新 tag 查 `releases.atom`。\n2. 造合成上游提交（独立 worktree，主仓不动）：新合成提交的父 = 上一个合成提交（v18.0.9 是 3f51b5d，父 e98684a=v18.0.7），merge-base 因此增量演进——每次升级只有新增量与 fork 补丁相碰（v17→v18 是 34 文件 76 hunk，v18.0.7→v18.0.9 只 4 文件 5 hunk）。\n3. 发起 merge：`git"},{"name":"omp-fork-recon-pitfalls","description":"Use before omp-fork-upstream-recon trial merge to avoid observed pitfalls.","keywords":"Empirically observed pitfalls when running omp-fork-upstream-recon trial merge","tokens":26,"bodyTokens":2265,"excerpt":"# Pitfalls hit during real recon/trial merges (supplement to omp-fork-upstream-recon)\n\nProcess pitfalls validated in practice — check these every upgrade recon:\n\n1. **GitHub compare API caps `files[]` at exactly 300.** For big deltas it silently truncates: `jq '.files|length'` == 300 means \"unknown, larger\". Derive the real upstream file list from the tarball overlay instead: after committing the synthetic commit, `git diff --name-only \u003cold-baseline> \u003cSYN>`.\n\n2. **Capture the"},{"name":"omp-fork-release-binary-rebuild","description":"Rebuild/install omp fork binary on master, not trial worktree; verify compiled artifact.","keywords":"Rebuild and install the omp fork binary on the master checkout (not a trial worktree) and prove the change is inside the compiled artifact","tokens":28,"bodyTokens":1151,"excerpt":"# Rebuild the omp fork binary from the master checkout\n\nUse when the user asks to rebuild/reinstall `omp` after editing this fork's\nsource. The live binary is `~/.local/bin/omp-patched`; `~/.local/bin/omp` and\n`~/.fzf/bin/omp` are symlinks to it and must stay that way. Never run\n`omp update` (it overwrites the patch with a stock release).\n\n## Wrong entry point — do not use\n\n```bash\nbun --cwd=packages/coding-agent run build   # ✗ writes packages/coding-agent/dist/omp (~275 MB)"},{"name":"omp-fork-trial-install","description":"Trial omp fork binary worktree install; not permanent; sentinel, TUI shim, smoke.","keywords":"Install a trial omp fork binary from a worktree without moving master: natives sentinel, TUI subpath shim, smoke check","tokens":27,"bodyTokens":714,"excerpt":"# Install a trial omp fork binary without moving master\n\nUse when a trial merge branch (e.g. `trial/vX`) should become `~/.local/bin/omp-patched` while `master` stays put.\n\n## Natives are version-gated\n\n`packages/natives/scripts/embed-native.ts` refuses a `.node` that lacks `__piNativesV\u003cversion>`. The addon in the repo and in `~/.omp/natives/` is usually an older release.\n\n1. Download the official binary, not the source tarball:\n   `https://github.com/can1357/oh-my-pi/releas"},{"name":"omp-fork-upstream-recon","description":"Use when new upstream release vs fork: conflicts, ABI, artifacts, regressions.","keywords":"Recon a new upstream omp release against the fork: chained synthetic commits, conflict measurement, natives ABI probe, generated-artifact reconciliation, regression triage","tokens":26,"bodyTokens":2027,"excerpt":"# Recon a new upstream omp release against the fork\n\nGoal: answer \"what changed upstream and what will it cost us\" with **measurements**, not diff-reading guesses, without touching `master`.\n\nAssumed fork facts: `~/code/oh-my-pi`, patch fork, baseline commits named `v\u003cVER> upstream source` on branches `upstream/v\u003cVER>`, `master` holds the patch series. Never run `omp update`.\n\n## 0. Cheap pre-checks (do these before the merge)\n```bash\ncat packages/coding-agent/package.json | "},{"name":"omp-fork-upstream-vs-fork-blame","description":"Use when ~/code/oh-my-pi behavior traces to upstream vs cindy fork patches.","keywords":"Determine whether a behavior in ~/code/oh-my-pi came from upstream or from cindy's fork patches, by diffing against the synthetic upstream baseline commits.","tokens":32,"bodyTokens":901,"excerpt":"# Blaming upstream vs the cindy fork in ~/code/oh-my-pi\n\n## Why this needs a procedure\n\n`~/code/oh-my-pi` has **no normal upstream git history**. The baseline is a synthetic\ncommit per released tag (parent = previous baseline commit, tree = that tag's\ntarball). So `git log`, `git blame`, and `git log -S` point at fork commits or at\nsynthetic commits titled `\"vX.Y.Z upstream source\"` — they never show the real\nupstream commit that introduced a behavior. Asking \"did upstream ch"},{"name":"omp-interview-session-to-notion-toggles","description":"Convert omp interview Q&A session into private Notion toggle doc","keywords":"Convert an omp interview-Q&A session (by id prefix) into a private Notion toggle doc: toggle title = original one-line summary, body = question quote + explanation; pipe-table→XML, bold-nesting fixes, fetch-verify loop","tokens":25,"bodyTokens":1043,"excerpt":"# omp 面试问答会话 → Notion toggle 文档\n\n用户固定归档格式（2026-10-12 起已跑通多次）。触发语：omp 会话 id 前缀 +「记在 notion」「toggle」。\n\n## 格式约定（已确认）\n- 每轮一个 `\u003cdetails>`：**标题 = 原文的一句话总结**（blockquote / `**一句话总结**：` / 「一句话记住整件事」原文照抄，可含行内代码），**内容 = 解释原文**（含小标题/代码块/表格）。\n- 每节顶部 `> 原始提问：\u003c问题单行>`。\n- 页首 callout：来源会话标题/id/日期/cwd + 结构说明 + 「由 kimi-k3 整理」。\n- 用户给「总结代码」时：toggle 标题放不下代码块 → 代码块放 toggle 内容第一块，标 `**总结代码（默写版，用户补充）**`；正文已含等价代码的不重复放。\n- 未指定目的地 → `creation_mode:\"draft\"`（私密工作区页，只设 title 属性），不进博客库。\n\n## 流程\n1. 定位会话：`find ~"},{"name":"omp-jev-routing-verify","description":"Use for omp judge/jev routing, wire protocol, SQLite cache, eval, gateway traps","keywords":"Verify omp judge/jev routing, wire protocol, local SQLite cache, and eval usage; includes System One gateway config traps and how find consumes judges","tokens":27,"bodyTokens":2634,"excerpt":"# omp judge/jev 排障与原语参考\n\n用户问\"jev 没生效 / judge 不工作 / 换 judge 端点 / 原理与示例\"类问题时按此排查与查阅。\n\n## 1. 核心原语与 Wire 协议\n\nTypeSafe Jev（System One）是直接计算概率分布的判别模型（非自回归生成文本），走 `POST {baseUrl}/v1/systemone`，支持 4 类原语：\n- `noul` / `bool`: 二分类标定概率 → `{\"type\":\"noul\",\"noul\":0.85}`\n- `choice`: 多分类离散分布 → `{\"type\":\"choice\",\"choice\":..,\"probabilities\":..,\"confidence\":..}`\n- `score`: 有序梯度期望 → `{\"type\":\"score\",\"score\":1.85,\"probabilities\":..,\"confidence\":..,\"legend\":..}`\n- `box`: 图像目标归一化边界框（native only）\n\nomp"},{"name":"omp-lazy-mcp-verify","description":"Debug lazy MCP gateways: driver, getTools polling, discovery, Notion, half-connected sessions","keywords":"Verify/debug omp lazy MCP gateways: driver recipe, getTools polling trap, multi-source discovery, Notion publish, half-connected session issue","tokens":29,"bodyTokens":1155,"excerpt":"# Verifying & debugging omp lazy MCP gateways\n\nScope: `~/code/oh-my-pi` fork feature (commit 148eabb). A `\"lazy\": true` MCP\nserver is held back at startup; one `mcp__\u003cserver>_gateway` device is mounted;\nwriting `{}` to it connects on demand.\n\n## Source-level live driver (mirrors production)\n\n```ts\nimport { MCPManager } from \"\u003crepo>/packages/coding-agent/src/mcp/manager\";\nimport { discoverAuthStorage } from \"\u003crepo>/packages/coding-agent/src/session/auth-broker-config\";\n\nconst "},{"name":"omp-mnemopi-embedding-provider-switch","description":"Use when switching omp mnemopi embedding model, migrating vectors; not fresh setup.","keywords":"Switch omp mnemopi embedding model and migrate existing vectors","tokens":27,"bodyTokens":1657,"excerpt":"# Switching omp mnemopi Embedding Model + Bank Migration\n\n## When\nChanging which embedding model omp's mnemopi memory uses (config, env, or fork patch), and migrating the bank's stored vectors; diagnosing embedding rebuild loops or wiped `memory_embeddings` corpora.\n\n## Facts (verified 2026-09-05/06, fork ≥ 9e7f3e2)\n\n- **Production config**: top-level `mnemopi:` block in `~/.omp/agent/config.yml` — `embeddingModel` / `embeddingApiUrl` / `embeddingApiKey`. Env override: `MNEMO"},{"name":"omp-model-config","description":"Add or configure models/providers in models.yml, no live testing","keywords":"Configure or add models/providers in ~/.omp/agent/models.yml; enforces zero-test by default (offline metadata & catalog verification only), requires explicit user opt-in to test, and strictly mandates substantive technical questions (never hi/ping/pong/1+1) to prevent upstream risk control flags.","tokens":18,"bodyTokens":1508,"excerpt":"# omp-model-config\n\n全局规范：在 `~/.omp/agent/models.yml` 配置、接入、修改模型或 Provider 的全流程与测试红线。\n\n## 核心红线（Zero-Test & Anti-Risk）\n\n1. **默认严禁网络 Completion 测试（Zero-Test by Default）**：\n   - 配置模型时，**默认一律不发任何生成请求**（无 completion、无 stream、无 vision-probe）。\n   - 无论用户有没有说“不要测试”，都默认严禁测试；**当且仅当用户明确指示测试**（如“测一下连通性”、“发个请求跑跑看”、“验证下能不能用”）时，才允许发起请求。\n2. **严禁测活式 Ping（动因：风控与防封号）**：\n   - 即使用户明确要求测试，**绝对禁止**发送 `hi` / `ping` / `pong` / `hello` / `你好` / `test` / `1+1` / `are you there` / `回复 ok` 这类无实质信息词汇。\n   - "},{"name":"omp-model-family-prune-verify","description":"Prune omp model family from models.yml/config.yml; verify with omp -p probes.","keywords":"Remove a model family from omp models.yml/config.yml (incl. modelRoles repoint) and verify with omp -p probes","tokens":27,"bodyTokens":756,"excerpt":"# Prune a model family from omp config and verify live\n\nRemove every entry for a model family (e.g. DeepSeek) across omp config, repoint\nmodelRoles that referenced it, and prove the result with real `omp` probes.\n\n## Files\n- `~/.omp/agent/models.yml` — providers with `models:` lists and `modelOverrides`\n- `~/.omp/agent/config.yml` — `modelRoles` (syntax `provider/model:effort`), `disabledExtensions`\n\nIgnore: `models.json`, `settings.json`, `mcp.json`, `retry-rules.json`, `~/."},{"name":"omp-model-override-offline-verify","description":"omp models.yml overrides: offline thinking-ladder/wire-shape verify; whole-block-replace, cline-pass supportsReasoningEffort pin.","keywords":"Configure an omp provider/model override in ~/.omp/agent/models.yml and verify the resolved thinking ladder + wire shape offline (no endpoint calls), including the whole-block-replace trap for thinking and the cline-pass free-bucket supportsReasoningEffort pin","tokens":40,"bodyTokens":1358,"excerpt":"Use when adding or editing a `\u003cprovider>.modelOverrides` entry in `~/.omp/agent/models.yml` (built-in catalog provider, built-in or discovered model) and the user does not want live model calls.\n\n## 1. Read the resolved state BEFORE editing\n\n```bash\nomp models find \u003cprovider>            # ladder column: \"yes\" = no ladder resolved, nothing on the wire\nsqlite3 ~/.omp/agent/models.db \"select models from model_cache where provider_id='\u003cprovider>';\" | python3 -m json.tool | less\n`"},{"name":"omp-model-role-switch","description":"Use when re-pointing omp model role (wiki/smol/web/vision/judge) or verifying offline resolution.","keywords":"Re-pointing an omp model role (wiki/smol/web/vision/judge) and verifying it resolves offline, no endpoint calls","tokens":29,"bodyTokens":775,"excerpt":"# Re-pointing an omp model role, verified offline\n\n## Where roles actually live\n\n`~/.omp/agent/settings.json` is nearly empty (`defaultModel`, `defaultProvider`,\n`defaultThinkingLevel`). The roles are in **`~/.omp/agent/config.yml`** under\n`modelRoles:` — `vision`, `default`, `smol`, `wiki`, `web`, `judge` — and\n`~/.omp/agent/settings.yml` can additionally carry a `modelRoles.default`\noverride. Custom providers/models live in `~/.omp/agent/models.yml`.\n\nGrepping the wrong fil"},{"name":"omp-pi-package-compat-check","description":"Before installing pi-* extension: vet omp compatibility, shim exports, npm path, provider-id.","keywords":"Vet a pi-ecosystem npm extension (pi-*) for omp fork compatibility before installing: shim exports, npm: install path, provider-id key mismatches","tokens":28,"bodyTokens":658,"excerpt":"# Vet a pi package for omp (oh-my-pi fork) compatibility\n\nUse when evaluating whether a pi.dev/npm `pi-*` extension works under omp. Proven on pi-ai-usage v0.1.0 (2026-10).\n\n## Checks, in order\n\n1. **Install path**: omp natively supports `omp plugin install npm:\u003cpkg>` (PluginManager in `packages/coding-agent/src/extensibility/plugins/`). No format blocker for pi.dev packages.\n\n2. **Import surface**: unpack first — `npm pack \u003cpkg> && tar xzf` — then list external imports: `gre"},{"name":"omp-provider-multi-apikey-pool","description":"Use for per-provider multi-API-key pools: models.yml apiKeys, stored login keys, credential rotation/debugging.","keywords":"Configure and debug omp per-provider multi-API-key credential pool (models.yml apiKeys and stored login keys)","tokens":34,"bodyTokens":1340,"excerpt":"# omp per-provider multi-API-key pool\n\n## Two ways to build a pool\n\n1. **models.yml `apiKeys: string[]`** (preferred; verified live 2026-10-07 on the fork binary).\n   Installed by `ModelRegistry.#installProviderApiKeys` → `authStorage.keys.setConfigPool`\n   → `CredentialPool.syncConfigPool`, which upserts `auth_credentials` rows with\n   `source:\"config\"` and soft-deletes rows that vanish from the list. So models.yml is\n   the source of truth for those rows; editing the db by "},{"name":"omp-recall-extension","description":"Use for omp runtime extensions registering recall.ts agent tools; not generic plugins.","keywords":"Author/verify omp runtime extensions that register agent-facing tools (recall.ts pattern)","tokens":21,"bodyTokens":725,"excerpt":"# Authoring an omp runtime extension tool (recall/history_search pattern)\n\n## Registration boilerplate\n\n```ts\nimport type { ExtensionAPI } from \"@oh-my-pi/pi-coding-agent\";\nimport { replaceTabs, truncateToWidth } from \"@oh-my-pi/pi-tui\";\n\nexport default function myExt(pi: ExtensionAPI): void {\n\tconst { Type } = pi.typebox; // ExtensionAPI declares typebox: typeof TypeBox (@oh-my-pi/omptype/typebox)\n\tpi.registerTool({\n\t\tname: \"tool_name\", label: \"...\", description: \"...\",\n\t\tlo"},{"name":"omp-retry-rules-config","description":"Use when omp retry-rules.json add/verify, precedence, hot reload, live probe, pattern rescue.","keywords":"Add/verify user retry rules in omp (~/.omp/agent/retry-rules.json): where the file lives, precedence, hot reload, the live probe, and why a listed pattern may still not rescue a turn.","tokens":30,"bodyTokens":896,"excerpt":"# omp user retry rules\n\n**Ask shape:** \"add error X to omp retry config\". Source of truth is the JSON file, NOT a rebuild.\n\n## Where\n\n- `~/.omp/agent/retry-rules.json` (override: `OMP_RETRY_RULES_FILE`).\n- Hot-reloaded on mtime+size change — no restart. Missing/malformed file silently means \"no user rules\" (warns to `~/.omp/logs/omp.*.log`).\n- Impl: `packages/ai/src/error/user-retry-rules.ts`; classifier: `packages/ai/src/error/retryable.ts` (`isProviderRetryableError`); code"},{"name":"omp-search-affinity-transport-reuse","description":"Use when adding/verifying omp web-search provider affinity reusing active model transport.","keywords":"Add or verify omp web-search provider affinity that reuses active model transport","tokens":26,"bodyTokens":1195,"excerpt":"# Search-affinity transport reuse (OMP fork)\n\nGoal: when the running model already speaks a provider's wire, hosted search should reuse **that model's** transport instead of the provider's standalone official-endpoint defaults. Reference implementations: `web/search/providers/codex-affinity.ts` (GPT) and `web/search/providers/anthropic-affinity.ts` (Claude).\n\n## Shape\n\nThree pieces, in this order:\n\n1. **Fork-local predicate + transport module** — `web/search/providers/\u003cname>-"},{"name":"omp-session-forensics","description":"Reconstruct omp sessions: locate bucket, parse JSONL parentId branches, exits, concurrency, subagents.","keywords":"Reconstruct what actually happened in omp sessions from disk: locate the right bucket, parse the JSONL parentId tree, find branch points, exit markers, concurrent-writer evidence, and subagent sidecar transcripts","tokens":28,"bodyTokens":842,"excerpt":"# omp session forensics (from disk)\n\nUse when the user asks \"where did my session/branch/conversation go\", claims resumes/forks vanished, or `/tree` shows nothing.\n\n## Locate\n\n- Sessions root: `~/.omp/agent/sessions/\u003cbucket>/` (+ `~/.omp/agent/archive/sessions/`, profiles: `~/.omp/profiles/*/agent/sessions/`). Bucket = cwd-derived, starts with `-` (e.g. `-code-vox2organ` = `~/code/vox2organ`).\n- **Trap**: bucket names start with `-` — a relative `find *vox2organ*/ …` breaks s"},{"name":"omp-session-usage-cache-forensics","description":"session_usage inΣ >> ctx: diagnose cache fallback via relay access logs","keywords":"解释/归因 omp TUI session_usage 行 inΣ 远比 ctx 大的问题：区分 flow 与 stock，三种缓存回退指纹，用 relay access log 逐跳对号，判断 client 改写 prompt / relay 号池无亲和","tokens":24,"bodyTokens":1337,"excerpt":"# session_usage 行的 in Σ vs ctx 归因\n\n## 语义（先记牢，不要当 bug 修）\n\n实现：`packages/tui/src/chat/work-usage.ts`（累加器 + `formatUsageAggregateRow`）、`packages/tui/src/status-line/segments.ts`（`sessionUsageSegment`）。\n\n- **FLOW，可累加**：`in Σ = Σ(input + cacheWrite)`、`out Σ = Σ(output)`、`reason ⊂ out`、`cost`。\n- **STOCK，只取最后/最大**：`ctx = last(input + cacheRead + cacheWrite)`、`contextCacheRead`、`cur%`、`peak`。\n- 比率：`cur = last.cacheRead / ctx`；`avg = ΣcacheRead / Σprompt`；coverage = `cacheReportedReque"},{"name":"omp-system-context-audit","description":"Measure system-context token composition, attribute per source, trim large prompts","keywords":"Measure omp system-context composition (fixed per-session prompt/tools/skills/rules/memory tokens) and attribute it per source; use when asked what fills system context, why the prompt is large, how to trim it, or what a lightweight session's System prompt/System context number refers to.","tokens":21,"bodyTokens":3873,"excerpt":"# omp system-context audit\n\nGoal: authoritative per-source token attribution of the fixed (pre-message) context, with evidence, no real provider turn needed.\n\n## 0a. Fastest path: one SDK script (no TUI, exact)\n\nPreferred over the tmux `/context` dance below. Script MUST live at the repo root (workspace`@oh-my-pi/pi-natives` resolution) and uses the real model, so the catalog tokenizer applies:\n\n```ts\nimport { createAgentSession, discoverAuthStorage, ModelRegistry } from \"./p"},{"name":"omp-timed-resume-isolated","description":"Schedule omp --resume isolated; avoid live TUI; systemd OnCalendar, lease skip.","keywords":"Schedule omp --resume of one session without touching live TUIs: fresh pty, private session-dir, systemd OnCalendar, lease skip.","tokens":28,"bodyTokens":707,"excerpt":"# Schedule an isolated omp resume\n\nUse when the user wants an existing omp session resumed at a clock time, or a timer test, without disturbing sessions that are already running.\n\n## Do not\n\n- Do not run `omp --resume` directly from a tool shell that inherits `KITTY_WINDOW_ID` (or any multiplexer id). `getTerminalId()` falls back to that env var when stdin is not a tty and overwrites `~/.omp/agent/terminal-sessions/kitty-\u003cid>`, which is a live window's `--continue` crumb.\n- D"},{"name":"omp-tool-wire-mock-relay-verify","description":"Use for offline provider-wire proof with isolated agentDir/mock relay; /inject runtime-whitelist seam.","keywords":"Prove an omp tool/model reaches the provider wire offline via isolated agentDir + mock relay; also the /inject runtime-whitelist seam in the cindy fork","tokens":31,"bodyTokens":768,"excerpt":"# Verify an omp tool reaches the provider wire (offline)\n\nUse when a claim is \"the model can call X\" / \"the tool is advertised\" / \"`--lightweight`\nomits tools\" and you must not spend a real request. Works for `~/code/oh-my-pi`\n(source) — the recipe needs `createAgentSession`.\n\n## Harness\n\n1. Temp script MUST live **inside** `packages/coding-agent/` (e.g.\n   `packages/coding-agent/tmp-wire-probe.ts`). Running `bun /tmp/foo.ts` resolves\n   `@oh-my-pi/pi-natives` from the **bun "},{"name":"omp-trial-binary-worktree","description":"Use for side-by-side trial omp binary from specific files with uncommitted WIP.","keywords":"Build side-by-side trial omp binary from specific files when main worktree has uncommitted WIP","tokens":27,"bodyTokens":942,"excerpt":"Build a throwaway `omp-trial` binary containing ONLY my changes, for the user to try\nbefore anything is committed. Use when the shared checkout has other sessions'\nWIP, or when the user says \"装一个你的版本我来试试\".\n\n## Why not build in the shared tree\n\nThe shared tree usually carries other agents' half-finished work (live examples:\n`ExecutorOptions.restrictToolNames` missing, `WikiPage` shape changes, `ToolUIColor`\nmismatch — 6+ typecheck errors at once). Building there bakes their un"},{"name":"omp-tui-component-standalone-probe","description":"Use for one pi-tui Markdown/code-cell/overlay component via throwaway script, not full TUI.","keywords":"Render/drive a single @oh-my-pi/pi-tui component (Markdown, code-cell, overlays) from a throwaway script instead of launching the full TUI","tokens":33,"bodyTokens":558,"excerpt":"Probe one TUI component directly rather than launching omp's full TUI.\n\n## Why\n\n`Markdown.render(width)` returns plain ANSI strings; a 10-line script proves real output faster than driving the app. Also the only way to see exact color codes.\n\n## Recipe\n\nWrite the probe **inside the repo** (e.g. `~/code/oh-my-pi/tmp-probe.ts`), then `cd ~/code/oh-my-pi && bun run tmp-probe.ts`. Delete it afterwards.\n\n```ts\nimport { Markdown } from \"@oh-my-pi/pi-tui/components/markdown\";\nimport"},{"name":"omp-tui-extension-authoring","description":"Use for omp TUI: pickers, fullscreen transcript viewers, overlays, mouse routing.","keywords":"Build omp runtime TUI extensions (pickers, fullscreen transcript viewers) with real ChatTranscriptBuilder rendering, overlay stacking, mouse routing","tokens":26,"bodyTokens":1399,"excerpt":"# Authoring omp TUI extensions with real transcript rendering\n\nUse when building a runtime extension for cindy's omp-patched fork that needs interactive TUI surfaces (pickers, fullscreen transcript viewers, transcript replay), not just event hooks. File goes in `~/.omp/agent/extensions/\u003cname>.ts` — survives fork rebuilds, loaded at every startup.\n\n## Module imports\n- Specifier shim resolves `@oh-my-pi/pi-coding-agent` **and subpaths** (`@oh-my-pi/pi-coding-agent/modes/compone"},{"name":"omp-tui-fullscreen-overlay","description":"Use for fullscreen overlays: mouse routing, pan, soft-wrap, PTY color verification.","keywords":"Author and verify omp TUI fullscreen overlays (mouse routing, pan, soft-wrap, PTY color verification)","tokens":26,"bodyTokens":762,"excerpt":"# OMP TUI Fullscreen Overlay — Authoring & PTY Verification\n\nApplies to the Workspace Inspector pattern (`packages/coding-agent/src/workspace-inspector/`) and any new fullscreen TUI extension.\n\n## Authoring pattern\n\n- Register via built-in extension: `pi.registerCommand` + `pi.registerShortcut`, open with `ctx.ui.custom(async (tui, theme, keybindings, done) => Component.create({...}), { overlay: true, overlayOptions: { width: \"100%\", maxHeight: \"100%\", margin: 0, fullscreen: "},{"name":"omp-tui-image-pty-wire-diagnosis","description":"omp transcript inline-image missing webp/jpg on resume; PTY byte-level; 18.1.x append-only finalization","keywords":"Diagnose omp transcript inline-image regressions (missing webp/jpg on resume) at the PTY byte level without popping test windows, and fix the 18.1.x append-only block finalization trap","tokens":39,"bodyTokens":1347,"excerpt":"# Diagnose omp TUI inline-image regressions at the PTY wire level (no windows)\n\nUse when resumed/live transcripts stop showing inline images after an omp fork\nmerge or patch, and you must find the break WITHOUT popping a test window on\nthe user's desktop (cindy's hard preference — never raise foreground windows\nduring testing).\n\n## 1. Reproduce at the wire level\n\n```bash\ncd /tmp && (sleep 10; printf '\\x03') | timeout 16 script -qec \\\n  \"cd ~/code/oh-my-pi && OMP_IMG_DEBUG=1 O"},{"name":"omp-tui-render-to-png","description":"When harness strips ANSI from omp TUI render output; show colored PNG.","keywords":"Show omp TUI render output as a real colored PNG when the harness strips ANSI from tool output","tokens":24,"bodyTokens":1391,"excerpt":"# Show omp TUI render output as a colored image\n\n**When:** the user asks to *see* a rendered component (markdown, tool cell, code\nbox) and plain tool output comes back colorless, because the harness strips ANSI\nfrom captured stdout. Text dumps cannot show color; a PNG can.\n\n**Why:** omp's TUI color is the substance of the answer (syntax highlighting,\ntheme tokens, box glyphs). Describing it in prose is weaker evidence than showing\nit, and `xd://show_image` displays the file i"},{"name":"omp-tui-tmux-smoke","description":"Verify TUI pickers via tmux send-keys capture-pane; not PTY byte parsing","keywords":"Verify omp TUI picker changes on the installed binary via tmux send-keys + capture-pane screen-state assertions; not byte-stream PTY parsing.","tokens":29,"bodyTokens":427,"excerpt":"# tmux screen-state smoke for omp TUI features\n\nUse when verifying picker/overlay behavior of the installed omp-patched binary end-to-end. Byte-stream PTY harnesses (`script -qec` + reader) fail on frame assertions: the omp TUI paints CUP-diff redraws, never `\\x1b[2J`, so \"last frame\" heuristics see stale rows. tmux capture-pane gives the real screen.\n\n## Recipe\n\n1. Seed a disposable session dir: `\u003cts>_\u003cuuid>.jsonl` files with `type:\"title\"` → `type:\"session\"` (version:3, id,"},{"name":"omp-tui-usage-stock-flow","description":"Use for omp TUI stock/flow tokens, ctx breakdown, status-line overflow.","keywords":"omp TUI token/cache accounting: stock vs flow, ctx decomposition, status-line overflow priority","tokens":26,"bodyTokens":1001,"excerpt":"# Fork TUI usage accounting (stock vs flow)\n\n## Metric classes\n- **Stock (level, per request)**: prompt/context = `input + cacheRead + cacheWrite`; `cacheRead` (cached prefix). Aggregate with **last** (current) and **peak** (max), never sum.\n- **Flow (additive)**: uncached `input`, `output`, `reasoning` (⊂ output), `cacheWrite`, `cost`, `totalTokens` → sum.\n- **Ratio**: weighted avg `cacheRate` (billing) and current `contextCacheRate` (`contextCacheRead/contextTokens`). 0 is "},{"name":"omp-tui-usage-stock-flow-verify","description":"omp TUI token/cache audit: separate flow sums from context stocks","keywords":"Use when auditing/fixing omp fork TUI WORK/SESSION token and cache rows: distinguish flow sums from context stocks, replay a real session, run tests, rebuild omp-patched.","tokens":25,"bodyTokens":937,"excerpt":"# omp TUI usage stock/flow audit\n\nUse when the user questions token/cache numbers in omp's TUI (WORK/SESSION rows, session_usage segment, context gauge). Stay on the TUI computation; `omp stats` is a separate surface unless explicitly asked.\n\n## Semantics (the bug class)\n- Flows (sum): uncached `input` (+ `cacheWrite`), `output`, `reasoning` (⊂output), cost, request count.\n- Stocks (last/max, never sum): prompt/context `input+cacheRead+cacheWrite` (current = last request; pea"},{"name":"omp-upstream-release-history-lookup","description":"Use oh-my-pi upstream release notes, per-version deltas, patch overlap, tokenizer, no clone.","keywords":"Look up oh-my-pi upstream release notes and exact per-version file deltas (no clone); includes natives ABI tokenizer caveat and fork patch-overlap check","tokens":31,"bodyTokens":1830,"excerpt":"# Upstream omp release-history lookup (no clone)\n\n## When\n- User asks what a past upstream omp version/series contained (e.g. \"上游16版本更新内容\").\n- User asks \"看一下/看看上游更新内容\" in a routine fork-maintenance session: enumerate tags newer than the fork baseline, read their CHANGELOGs, then flag fork impact (patch overlap + natives).\n- Local `~/code/oh-my-pi/packages/coding-agent/CHANGELOG.md` looks short — it is **not** the whole history.\n\n## Known facts (verify cheaply, they drift)\n- L"},{"name":"omp-usage-reporting","description":"Use for omp ccusage token/cost tables: daily weekly session folder blocks stats.db","keywords":"Produce ccusage-style token/cost tables for omp (daily/weekly/monthly/session/folder/blocks) from ~/.omp/stats.db, or run ccusage's renderer on stats.db numbers via the ompccusage shim (--keep-deleted keeps deleted sessions)","tokens":25,"bodyTokens":2592,"excerpt":"Use when asked for token/cost/usage tables or \"ccusage but for omp\".\n\n## Four routes — pick by what the user wants\n\n| Route | Header | Data | Scope |\n|---|---|---|---|\n| `ompusage` (local script, own cost accounting) | `Date│Models│Input│Output│Cache Create│Cache Read│Total Tokens│Cost (USD)` + `Total` row | `~/.omp/stats.db` | omp only; daily/weekly/monthly/session/folder/blocks |\n| `ompccusage` (shim: ccusage renderer + stats.db numbers) | identical to ccusage, `[omp]`/`[pi"},{"name":"omp-vision-image-strip-diagnosis","description":"Use when omp claims vision but silently strips images; not unsupported vision.","keywords":"Diagnose omp models declaring vision support but silently stripping images","tokens":24,"bodyTokens":1355,"excerpt":"# When a model declares `input: [text, image]` but receives \"[image omitted: model does not support vision]\"\n\nCase that produced this skill: `workbuddy/deepseek-v4.1-flash` (Tencent WorkBuddy relay on 127.0.0.1:7863) — gateway demonstrably serves images, omp stripped them client-side.\n\n## Mechanism — two independent gates that disagree\n\n1. **Wire gate** (`packages/ai/src/providers/vision-guard.ts`):\n   `isOpenAICompletionsVisionSupported(model) === model.input.includes(\"image"},{"name":"omp-websearch-provider-ab-benchmark","description":"Compare two omp websearch providers with paired same-prompt queries and per-axis scoring","keywords":"Benchmark and compare two omp websearch providers (e.g. grok relay vs gemini grounding) with paired same-prompt wire-level queries, live ground truth, and per-axis scoring","tokens":26,"bodyTokens":957,"excerpt":"# omp websearch provider A/B benchmark (quality, not just capability)\n\nGoal: compare two omp search providers (e.g. Grok relay vs Gemini grounding) on answer quality, freshness, operator fidelity, latency, and cost. `relay-hosted-websearch-probe` decides IF a relay searches; this recipe decides WHICH provider serves better. Reference run: `~/code/general-action/search-results/websearch-grok-vs-gemini-2026-09-05/` (harness.py, score.py, raw-results.json, ground-truth.json).\n\n#"},{"name":"omp-wiki-memory-inspect","description":"Inspect omp memory against ~/文档/omp-wiki; internal sqlite wiki only if wiki.root set.","keywords":"Inspect omp memory against the external vault at ~/文档/omp-wiki; use the internal sqlite wiki only when wiki.root is explicitly set","tokens":29,"bodyTokens":1017,"excerpt":"# Inspect omp memory from the external vault\n\nUse when the user asks whether memory works, when `recall` misses something, or when you need to verify what was stored without trusting the model.\n\n## Which store is live\n\nA normal session (`memory.backend: wiki`, `wiki.root` unset) reads and writes `~/文档/omp-wiki`. The internal sqlite tree `~/.omp/agent/memories/wiki/\u003cscope>/` is not that session's memory. Do not treat its pending sources, pages, or maintenance errors as the res"},{"name":"omp-wiki-memory-url-read-verify","description":"Verify memory:// wiki reads, context.memory, raw/processed priority, patch-41 sandbox; not generic memory.","keywords":"Diagnose/verify omp wiki-backend memory:// reads (backend wiki + external vault): failure signature, context.memory wiring gate, raw/processed scanning, compiled-vs-raw priority, patch-41 status, sandbox verification harness","tokens":33,"bodyTokens":1625,"excerpt":"# wiki-backend `memory://` reads: diagnose, fix, verify\n\nUse when `read memory://root` or `read memory://\u003cid>` fails (or mislabels / loses content) under `memory.backend: wiki`, or before touching `internal-urls/memory-protocol.ts`, `wiki/backend.ts`, `wiki/external-vault.ts`.\n\n## Status (check before re-diagnosing)\n\nFixed and installed 2026-10-14: fork patch 41, commit `29f63c32ab`, source files `internal-urls/context.ts`, `internal-urls/memory-protocol.ts`, `wiki/backend.ts"},{"name":"omp-wiki-mnemopi-raw-import","description":"Export omp mnemopi working_memory to ~/文档/omp-wiki raw inbox; never delete without confirmation.","keywords":"Export omp mnemopi working_memory into ~/文档/omp-wiki raw inbox; never delete banks before explicit confirmation","tokens":34,"bodyTokens":461,"excerpt":"# Export mnemopi into the external omp wiki\n\nUse when moving omp's mnemopi vector-bank text into `~/文档/omp-wiki/`. Do not use for the sqlite wiki pages, and do not delete the source banks in the same step.\n\n## Source of truth\n\n- Banks: `~/.omp/agent/memories/mnemopi/banks/\u003cname>/mnemopi.db`\n- Export table: `working_memory` (`id, content, source, timestamp, memory_type, veracity`). There is no `memories` table.\n- `memory_embeddings` is vectors only. Do not export it.\n- `facts`"},{"name":"omp-wiki-recall-precision","description":"omp wiki recall ranking changes: IDF gate, short terms, limit cap, metadata.","keywords":"Change/verify omp wiki-backend recall ranking (IDF gate, whole-word short terms, limit-as-cap) and capture metadata; fork patch + artifact ship loop","tokens":27,"bodyTokens":1233,"excerpt":"# Tune omp wiki-backend recall precision (and ship it)\n\nUse when wiki recall returns noise, pads to a fixed count, or when recall hits need capture metadata (time/scope/channel). Implemented in cindy's fork `~/code/oh-my-pi`.\n\n## Where the behavior lives\n\n- `packages/coding-agent/src/wiki/external-vault.ts` — `ExternalVault.searchRanked(query, notes, limit)` returns `{note, score, matched}[]`; `search()` keeps the `(query, notes, limit): VaultNote[]` signature and delegates. "},{"name":"omp-wiki-sync-rate-limited-reasoning","description":"Use when omp wiki/memory sync compiles 0 sources on x666 GLM endpoints","keywords":"Fix omp wiki /memory sync compiling 0 sources on x666 GLM endpoints","tokens":31,"bodyTokens":781,"excerpt":"# omp wiki sync on rate-limited reasoning endpoints\n\n## When to use\nomp wiki memory has hundreds of pending sources that never compile, erroring with \"Wiki model returned no text\", \"Request was aborted\", or 429 rate limits on a relay like x666 (GLM-5.3-200k).\n\n## Diagnosis order (each is independently fatal)\n1. **Effort level** — test streaming output per effort level directly against the endpoint. GLM-5.3-200k on x666: `:max` streams cut off (~9 chunks), `:low`/`:high` retur"},{"name":"omp-windows-partition-install","description":"Install onto Windows partition mounted from Linux; not for WSL","keywords":"Install/sync omp onto a Windows partition mounted from Linux: cross-build the fork with the npm win32 native addon, verify under wine, copy config.","tokens":21,"bodyTokens":1478,"excerpt":"Use when a Windows drive is mounted (e.g. `/run/media/\u003cuser>/Windows-SSD`, ntfs3, mount with `sudo mount -t ntfs3 -o rw /dev/nvmeXnYpZ …`) and the user wants omp installed/updated over there with our config.\n\n## Cross-build the fork — this works (2026-10-29, 18.12.3)\n\nDo NOT hand-roll a cross toolchain. The only missing piece for a win32 fork build is the `pi-natives` cdylib; fetch the **prebuilt** addon from npm and let `bun build --compile` embed it.\n\n```bash\nV=$(jq -r .ver"},{"name":"onehub-gateway-gemini-omp-provider","description":"Configure one-hub/Done Hub gemini gateway into omp with group tokens.","keywords":"配 one-hub/Done Hub 系网关（如 hyb=ai.hybgzs.com）的 gemini 模型到 omp：分组门控、/gemini/v1beta 原生面、Chrome+KWallet 解 session cookie、建 gemini 组令牌","tokens":28,"bodyTokens":1709,"excerpt":"# one-hub / Done Hub 网关 → omp provider（gemini 模型）\n\n判据：错误体 `one_hub_error`、`/api/status` 返回 `hybw_oauth`/`linuxDo_oauth` 等字段、页面 `\u003ctitle>Done Hub\u003c/title>`。\n**不是 New API**：没有 `/api/pricing`、`/api/ratio_config`（403），没有 `X-New-Api-Version`。别套 `newapi-gateway-key-and-omp-provider` 的 §2/§3。\n\n## 1. 先判分组，再谈 key\n\n`GET /api/user_group_map`（**无需登录**）返回全部组 + ratio：\n\n```bash\ncurl -s https://\u003chost>/api/user_group_map | python3 -c \"\nimport sys,json\nfor k,v in json.load(sys.stdin)['data'].ite"},{"name":"oracle-camelia-bill-check","description":"查 CamelliaV/camelia Oracle 账单、成本、免费额度、usage-api、余量、看门狗时用","keywords":"查 CamelliaV / camelia 的 Oracle 账单、成本、免费额度时用；含 usage-api 用法、免费余量状态与账单看护看门狗","tokens":39,"bodyTokens":1426,"excerpt":"# Oracle CamelliaV bill check\n\nUse when cindy asks for the Oracle / OCI bill, cost, or usage of tenancy CamelliaV (camelia). Not for proxy, NSG, or sing-box ops.\n\n## Access\n\n- CLI: `oci` (3.94+, `~/.local/bin/oci`). Config `~/.oci/config` profile `DEFAULT`, home region `us-phoenix-1`.\n- Tenancy OCID is the `tenancy=` line. Do not print the API key.\n- Usage API **only** works in the home region. `--region ap-tokyo-1` returns 403 `Please go to your home region`.\n- There is no `"},{"name":"oracle-camelia-proxy-ops","description":"Camelia Oracle ARM, sing-box VLESS Reality/Hy2 443, OCI NSG, Tailscale, Karing TUN","keywords":"Operate cindy's Oracle Always Free ARM instance camelia (Phoenix): SSH, sing-box VLESS Reality + Hy2 on 443, OCI NSG, kernel tune, Beszel monitor, A1 idle-reclaim keepmem, Tailscale, Karing TUN bypass, Hermes Agent","tokens":39,"bodyTokens":3110,"excerpt":"# Oracle camelia proxy (Phoenix Always Free ARM)\n\nUse when touching cindy's Oracle box `camelia` (public `161.153.82.173`, region `us-phoenix-1`, user `ubuntu`) or its Karing nodes.\n\n## Access\n\n- SSH public: `ssh oracle` (aliases `oci` / `camelia`). Key `~/.ssh/oracle-2026-09-15.key`. `IdentitiesOnly yes`.\n- SSH overlay: `ssh camelia-ts` → `100.114.186.0`. Laptop Tailscale `100.89.22.47`. Tailnet `cameliascript@`. Direct WireGuard via `161.153.82.173:41641` (stateful hole pun"},{"name":"proxy-client-experience-ab-diagnosis","description":"A/B proxy latency by TTFB not throughput; locate H3 slow-start ratchet","keywords":"同节点 A/B 对比两代理客户端体感差异；选对指标(TTFB非吞吐)，分h2/h3测；定位跨洋高延迟代理下H3慢启动阶梯与尾包丢包机理，指导直连H3/代理锁H2分流配置","tokens":29,"bodyTokens":979,"excerpt":"# 同节点 A/B 对比两个代理客户端的「体感差异」与 H2/H3 机制判定\n\n当用户反馈「客户端A 体验比客户端B 好/差」或「为什么换了某个内核/协议后图片加载剧烈抖动卡顿」时使用。\n\n## 核心教训\n\n1. **「体验」类抱怨禁止只用大文件吞吐下结论**。大文件吞吐可能完全相同（跑满带宽），但体验差异通常深藏在浏览器的协议选择（H2 vs H3）、首包延迟与正文尾部重试机制里。\n2. **封面图/缩略图（20KB~50KB）场景，看 Body 传输时间与尾部抖动，而非吞吐**。\n\n## 诊断流程\n\n1. **配置对齐（排除环境干扰）**：\n   - 逐项 diff 双方配置：TUN（stack/mtu/auto_route/strict_route）、route.final、fake-ip、dns。\n   - 对账底层库版本（`go version -m \u003ccore> | grep -E 'quic-go|gvisor'`）。\n2. **串行 A/B，防互踢**：\n   - 同一账号会话不可双开。测试 B 必须先彻底关闭 A 并验证 `su"},{"name":"proxy-exit-node-privacy-audit","description":"Use for hy2/vless-reality exit node client visibility: dual-side tcpdump, ClientHello SNI extraction","keywords":"Audit what a proxy exit node (hy2/vless-reality) can see about a client: dual-side tcpdump + ClientHello SNI extraction","tokens":34,"bodyTokens":923,"excerpt":"# Proxy exit-node privacy audit\n\n## When to use\nUser wants to know \"what can my VPS/proxy node see about me?\" — threat-modeling a rented or unfamiliar node (打野节点) before using it. Works for any inbound type: hy2, vless+reality, trojan, ss.\n\n## What the exit node can and cannot see (verified empirically)\nThe tunnel only encrypts client→VPS. The VPS is the exit: it re-originates connections to destinations. Therefore:\n\n- **Visible to VPS**: destination SNI (plaintext in TLS Cli"},{"name":"qoder2api-hub-install-ops","description":"Use when installing/upgrading qoder2api hub :8790, queue/code110 ops.","keywords":"部署/升级/运维 cindy 本机 qoder2api-hub(Qoder CN/intl→OpenAI/Anthropic relay,:8790):v1.6.0 升级套路、排队三层与 localpatch、计费耗尽 code 110 长冷却、账号池与面板、验证配方","tokens":30,"bodyTokens":2785,"excerpt":"# qoder2api-hub(Qoder CN/intl → OpenAI/Anthropic relay)部署与运维\n\n## 现状与形态(2026-10-20 夜)\n- 仓库 `~/code/qoder2api-hub`(main,origin=shuishuipingan/qoder2api-hub);运行 `docker compose`(容器 `qoder-proxy`,宿主仅 `127.0.0.1:8790`)。\n- 镜像 `ghcr.io/shuishuipingan/qoder2api-hub:latest`,现 **v1.6.0**;`qoder_proxy.py.localpatch` 以 `:ro` bind-mount 覆盖 `/app/qoder_proxy.py`(本机排队补丁)。\n- compose 本机定制(**上游每次更新会还原,升级后必须重新施加**):`ports: 127.0.0.1:8790:8790`、显式 `API_KEY=qd-e1f4667157f18e5869eafe20570a6f9417cb"},{"name":"quic-tun-failure-layer-diagnosis","description":"QUIC/H3 unreachable under TUN: isolate real block vs fake-blocked via netns","keywords":"QUIC/H3 under TUN 完整判定链：校园封禁三阶段实测（非封禁定案）、假blocked三坑（tcpdump 损坏/DNS 劫持/TUN 抢路由）、四层归因矩阵、netns 隔离 A/B 复刻（含分叉内核本体试跑）、判读纪律与清理对账","tokens":32,"bodyTokens":3562,"excerpt":"# TUN 下 QUIC/HTTP3 失效：校园判定 + 分层归因 + netns A/B\n\n用于诊断「某客户端 TUN 下 QUIC/H3 失效」，或怀疑「校园网封 UDP/443/QUIC」。核心纪律：**同刻到服务端只允许一条连接**（同账号双连接互踢，症状伪装成内核 bug）；**归因必须钉路由/netns 隔离**；**`check` 通过 ≠ 能跑**。\n\n## 已定案结论（2026-10-25/26 实测，cindy）\n1. **校园不封 UDP/443/QUIC。** 默认路径 QUIC 失败 = Karing TUN fake-ip 拦截（fake-ip 198.20.x、table 2022）。未钉路由绕开 TUN 前禁止下「被封」结论；复测优先于相信旧结论。\n2. **domain-UDP fake-ip bug 在 Karing 分叉内核，上游没有**：Karing karingService（sing-box v1.14.4-0.20261023+dirty）fake-ip 域名+UDP 10s 超时，显式 IP UDP"},{"name":"reader-camelia-ops","description":"Use for Reader app build, test, headless verify, demo data restore.","keywords":"Reader app (~/code/camelia/reader) 的构建、测试、无头验证、演示数据恢复的常备操作","tokens":24,"bodyTokens":980,"excerpt":"# Reader App Quick Reference\n\nFlutter 阅读器（~/code/camelia/reader，四包 monorepo），由旧 Electron rosereader（~/.config/RoseReader）重写而来。Flutter 固定 `~/fvm/versions/3.44.9/bin/flutter`（.fvmrc）。\n\n## 构建/测试/运行\n\n- 全套测试：各包目录 `timeout 240 ~/fvm/versions/3.44.9/bin/flutter test`（core 69 / engines 54 / data 25 / app 9，共 157）\n- 构建：`cd packages/app && ~/fvm/versions/3.44.9/bin/flutter build linux --release` → `build/linux/x64/release/bundle/reader`\n- 启动给用户：`GDK_BACKEND=wayland,x11 ./build/linux/x6"},{"name":"reader-flutter-headless-verify","description":"Verify Flutter reader headlessly: Xvfb UI shots, weston Wayland/WPE webview; never desktop.","keywords":"Verify Flutter reader app (~/code/camelia/reader) headlessly: Xvfb for plain UI shots, headless weston for Wayland/WPE webview; never launch on the user's desktop","tokens":33,"bodyTokens":666,"excerpt":"# Reader（~/code/camelia/reader）无头验证流程\n\n用户明确要求：**不要在桌面（wayland-0）弹窗验证**。一切运行时验证走无头环境。\n\n## 环境\n\n- Flutter 固定 fvm 3.44.9：`~/fvm/versions/3.44.9/bin/flutter`（仓库根 `fvm flutter`）。\n- 普通 UI / Dart 自绘轨截图：Xvfb。\n  ```bash\n  Xvfb :99 -screen 0 1400x900x24        # 用 name= 服务方式常驻；shell 内 (… &) 会随调用退出\n  GDK_BACKEND=x11 DISPLAY=:99 ./build/linux/x64/release/bundle/reader --db=… [--open=\u003cbookId>] [--reader-engine=…]\n  DISPLAY=:99 import -window root /tmp/shot.png   # OCR: tesseract -l chi_sim"},{"name":"relay-upstream-timeout-wire-selection","description":"Use for relay 504 timeouts; choose anthropic-messages vs chat/completions wire.","keywords":"Diagnose relay 504 timeout and pick right wire (anthropic-messages vs chat/completions)","tokens":29,"bodyTokens":1710,"excerpt":"# 中转站 504 固定超时 → 选 wire（completions vs anthropic）\n\n适用：给 omp 接新中转站时，某端点「裸文本秒回 / 一加 thinking 就 504」。配合 `omp-newapi-gateway-setup`、`omp-newapi-relay-key-setup` 使用（那两篇讲流程与配置形状，这篇讲两个会误判成「配置错」的陷阱）。\n\n## 陷阱①：反测活拦截会伪装成请求失败\n\n部分 one-hub/Done-Hub 系网关有 `content_anti_probe_blocking`：`hi`、`你好` 这类超短探针消息被直接 400 拒绝，报「短消息命中测活探针关键词」。\n\n- 症状：同一 key 换个模型也 400，容易误判成分组无权或 key 失效。\n- 对策：探针一律用真实问题（`What is the capital of France?`、`Name the largest planet in our solar system.`），绝不用 `hi`/`Reply with exact"},{"name":"run-relay-group-token-fix","description":"Fix omp run-* relay: 503 model_not_found, group token mismatch, run-gpt zero cache","keywords":"Use when an omp run-* provider (runanytime.hxi.me) returns 503 model_not_found / no channel under group, empty-but-billed replies, upstream_error/502 channel-down triage, zero prompt-cache on run-gpt models, isolated codex CLI probes of this relay, or when adding run-relay models: match each model to its group's token, read the panel headlessly.","tokens":31,"bodyTokens":2213,"excerpt":"# runanytime (omp run-* providers) group/token repair\n\n## Symptom mapping\n\n| Symptom | Meaning |\n|---|---|\n| `503 {\"error\":{\"code\":\"model_not_found\",\"message\":\"No available channel for model X under group Y\"}}` | The key's token group lacks model X — **key/group mismatch, not a wire bug** |\n| `/v1/models` returns a short list (1–7 ids) | That's the token's group roster, not the site roster |\n| `502` / stream `upstream_error` (\"the upstream service reported an error\") on one m"},{"name":"scene-pkg-nvidia-green-screen","description":"Use when Wallpaper Engine scene.pkg green with NVIDIA VAAPI split NV12 planes.","keywords":"Fix a green Wallpaper Engine scene.pkg when NVIDIA VAAPI exports split NV12 planes.","tokens":25,"bodyTokens":553,"excerpt":"# Green scene.pkg on NVIDIA VAAPI\n\nUse when a Wallpaper Engine `scene.pkg` renders solid green, especially an embedded MP4 texture. Do not use Spectacle; its capture flow requires user interaction.\n\n## Confirm the source\n\n1. Locate the active item in `~/.config/waywallen/config.toml` and `~/.local/share/waywallen/waywallen-v2.db`.\n2. Parse the package header, then the `.tex`. `TEXB0004` with `image_type=-1` and an `ftyp` body is an embedded video, not raw RGBA.\n3. Extract tha"},{"name":"search-pruning-adversarial-verify","description":"均匀随机漏结构反例时，穷举小输入、结构富集随机、零剪枝参照","keywords":"对拍验证手撕题搜索剪枝正确性：穷举小输入+结构富集随机+零剪枝精确参照，防均匀随机漏掉结构性反例","tokens":38,"bodyTokens":498,"excerpt":"# 对拍验证搜索剪枝（手撕题）\n\n验证带剪枝的 DFS/BFS 解法（尤其八股文档的手撕题）时使用。核心风险：**逐字符均匀随机短输入几乎不触发结构性边界**（桥接、合并、连锁），错误剪枝能骗过数千例随机对拍——实例：LC 488「只贴同色」剪枝通过 3000 例随机对拍，却在 RRWWRRBBRR/WB→2（需孤立桥牌拆对子）上漏解。\n\n## 配方（按序执行）\n\n1. **精确参照**：零剪枝穷举搜索（BFS 取最短路 / DFS 全枚举所有位置与手牌）。模拟/消除逻辑用**独立实现**（不同代码路径，如逐段扫描 vs 正则），避免同源错误互相印证。\n2. **穷举小输入**：枚举所有合法棋盘（按 run 长度 ≤2 递归生成，规避非法态）× 所有手牌多重集（`itertools.combinations_with_replacement`）。量级参考：3 色 board ≤7 × hand ≤2 ≈ 2325×9 组，秒级跑完。\n3. **结构富集随机**：按 run（长度 1~2）拼接生成输入，**不要**逐字符均匀随机；2/3/4 色都测"},{"name":"siftq-minimax-trial-image-video","description":"For local image→6/10/15s vertical/horizontal video/loop wallpaper via siftq.com minimax-trial; not other models.","keywords":"用 siftq.com 的 minimax-trial 端点把本地图片转成 6/10/15 秒竖版或横版视频（curl 提交→轮询→下载），并合成无缝循环壁纸版；含实测排队时长、状态机与接缝数值验证","tokens":40,"bodyTokens":1962,"excerpt":"# siftq minimax-trial 图生视频\n\n`siftq.com` 的 MiniMax 匿名试用端点：本地图片 → 6/10/15 秒短视频，**无需登录**。\n\n## 前置\n\n- 源图必须是本机真实文件，用 `-F \"image=@路径;type=image/jpeg\"`（或 png）以文件形式上传。\n- `client_id` 与 `X-MiniMax-Trial-Client` 头**必须完全一致**，否则任务不可轮询。\n- 第一个响应里就有 `task_id` / `access_token` / `limit` / `remaining`，**立刻存下来**，丢了无法找回。\n- 换 `X-Forwarded-For` 假 IP 绕过每 IP 2 条配额属于违反服务方条款，**不要自动化批量跑**；一次任务用一个新 `client_id` 即可。\n\n## 1. 提交\n\n```bash\nCID=\"mmtrial_$(cat /proc/sys/kernel/random/uuid)\"\ncurl -sS -X POST \"http"},{"name":"silent-testing-no-foreground-windows","description":"cindy machine debug/verify: zero-window evidence first; popups/key injection only if explicitly requested.","keywords":"cindy 机器上调试/验证默认必须零窗口：先取数据层证据（dbus/proc/缓存/journal/离线解析），再用 marker Exec 或隐藏实例/Xvfb 隔离层；弹窗、注入按键只在用户明确要求时允许","tokens":30,"bodyTokens":1957,"excerpt":"# cindy 机器上的静默测试（默认静默，弹窗=失败）\n\n铁律（2026-10-31 第三次违反后收紧）：**任何**调试/验证默认走零窗口路径。\n在真实会话上弹测试窗口、抢焦点、`ydotool`/`wtype` 注入按键，**只有用户明确要求**\n\"打开给我看看\"时才允许。\"不弹窗就验证不了\"几乎从来不是真的——总有可观测的替代层。\n\n违反记录（都要避免）：\n- 2026-10-03 Karousel/wine：连开三次 wine notepad。\n- 2026-10-31 kitty 默认目录：为验证 Ctrl+Alt+T，用 `ydotool` 注入按键 + 连开 6 个 kitty\n  只为读 `/proc/\u003cpid>/cwd`，被当场打断。**正确做法见下面\"系统集成类问题\"第 2/3 条。**\n\n## 判定顺序（自上而下，上面能定论就不要往下走）\n\n1. **结论来自数据，不来自窗口**\n   - 配置回读 + 离线复现语义（`kitty +runpy`、Python `json.loads` + `re.fullmatch` 等"},{"name":"snapper-clean-and-resnapshot","description":"Routine snapper cleanup: delete non-current, create clean-YYYYMMDD, refresh limine; never touch #0.","keywords":"Cindy's routine snapper cleanup on this machine (config root, btrfs /): delete every non-current snapshot, create a fresh clean-YYYYMMDD snapshot, never touch #0, then refresh limine boot entries.","tokens":33,"bodyTokens":874,"excerpt":"# snapper 清理 + 重新打快照（本机惯例）\n\n触发语：「惯例清理一下 snapper list」/「清理一下 snapper 那边的快照，然后重新打个，current 不动」。\n\n## 机器事实\n- config `root`，btrfs `/`，snapper 0.13.2；快照目录 `/.snapshots`（=`/@/.snapshots`）；**没有** `/var/lib/snapper`。\n- `snapper` 一律用 `sudo -n snapper ...`（无 tty 时非交互）。\n- `snapper delete \u003ca> \u003cb> ...` 支持多参数，但**不要**在后台/长命令里用：一旦被 shell 超时切断，拿不到任何部分输出，无法判断哪些已删。\n- 启动菜单由 `limine-snapper-sync` 管理（`limine-snapper-sync.service` + `limine-snapper-watcher`）；`/etc/limine-snapper-sync.conf` 里 `MAX_SN"},{"name":"snipaste-wayland-key-leak-guard","description":"Snipaste Esc or Enter leaks to focused window on KDE Wayland","keywords":"KDE Wayland Snipaste Esc/Enter leak to focused window: kwin mechanism, shipped focus-guard service, ruled-out fixes, silent repro rig, toggling","tokens":27,"bodyTokens":1748,"excerpt":"# Snipaste Wayland 按键泄漏守护进程\n\n适用：CachyOS / KDE Plasma Wayland，Snipaste 2.11.x（`/opt/snipaste`，主进程强制 `QT_QPA_PLATFORM=xcb`）。截图时 Esc/Enter/方向键同时进 Snipaste 选区**和**底下的原生 Wayland 窗口（Esc 关掉那个应用的对话框、Enter 触发其焦点按钮）。\n\n状态：已解决并上线（2026-10-04）。守护服务 `snipaste-focus-guard.service`。\n\n## 机制（KWin 6.7.5-1.1 / xorg-xwayland 24.1.13 / snipaste 2.11.3-2，源码级）\n\n`src/xwayland/xwayland.cpp` `XwaylandInputFilter::keyboardKey()`：\n- 默认 `XwaylandEavesdrops=AllKeysWithModifier`：带修饰键 **或** `isSpecialKey`（Qt "},{"name":"spectacle-patched-fork-ops","description":"spectacle-patched fork: patches, makepkg rebuild/install, KWin layer debug, multi-screen overlay/pin; not generic.","keywords":"Use for cindy's CamelliaV/spectacle-patched fork: editing patches, makepkg rebuild/install, KWin layer debugging, multi-screen capture-overlay or pin behavior.","tokens":35,"bodyTokens":2068,"excerpt":"# Spectacle patched fork (CamelliaV/spectacle-patched)\n\nRepo: `~/code/spectacle-learn`. Remote `origin` = https://github.com/CamelliaV/spectacle-patched.git.\nInstalled package name `spectacle-patched` (provides/conflicts `spectacle`).\n\n## What the package actually builds\n\n`makepkg` extracts the **upstream tarball** into `src/spectacle-$pkgver/` and applies the patches listed in\n`PKGBUILD` `source`/`prepare()`. So the source of truth for shipped code is the **patch files at re"},{"name":"spring-claims-offline-verify","description":"Use for Spring behavior claims, AOP/proxy/annotation, offline source citations; not Boot scaffolding.","keywords":"Verify/cite Spring framework behavior claims (AOP advice order, proxy semantics, annotation effects) offline using cindy's cached ~/.m2 jars and -sources.jar line numbers, without network or Boot project scaffolding","tokens":31,"bodyTokens":1375,"excerpt":"# 离线验证 Spring 行为断言（不联网、不建工程）\n\n场景：回答 Spring 面试题/八股时，需要把\"@Around 能覆盖 @After\"、\"@After 排在哪里\"、`@Repository` 转译、`@Controller` 路由 这类断言落到**可引用的源码行号**或**实机输出**上，而不是复述教程。\n\n## 1. 资产盘点（本机已具备，别联网下载）\n\n```bash\nls ~/.sdkman/candidates/java/            # 25-graal（current），另有 26-openjdk\nls ~/.m2/repository/org/springframework/ # 5.3.22 与 6.1.3 两套全家桶\n```\n\n6.1.3 关键包：`spring-core/beans/context/aop/expression/tx/web/webmvc`，附带 `*-sources.jar`（**引用行号的唯一依据**）。测试相关：`spring-test`、`org/aspectj/aspectjw"},{"name":"steam-nonsteam-shortcut-register","description":"Use when registering Windows exe as Steam non-Steam shortcut via VDF/Proton.","keywords":"Register a Windows exe as a Steam non-Steam shortcut on cindy's machine by editing VDFs directly (shortcuts.vdf binary format with DOUBLE \\x08 EOF terminator, CompatToolMapping, icon) with CachyOS Proton; verified via LoadShortcuts absence-of-failure","tokens":27,"bodyTokens":1364,"excerpt":"# Register Steam Non-Steam Shortcut (cindy's machine)\n\nUse when adding a Windows game/app exe as a Steam non-Steam shortcut by editing files directly. Steam MUST NOT be running (`pgrep -x steam` first; if running, stop it with `pkill -x steam` and wait).\n\n## Files (active user 1612690607, cameliavon)\n- `~/.steam/steam/userdata/1612690607/config/shortcuts.vdf` — binary; backup first (`cp shortcuts.vdf shortcuts.vdf.bak-YYYYMMDD-before-\u003cname>`)\n- `~/.local/share/Steam/config/co"},{"name":"tern-prefix-key-remap","description":"Changing tern.build prefix key, kitty send_text, TERN_HOME, or reverse-engineering tern Go binary.","keywords":"Use when changing tern.build TUI prefix key (hardcoded ctrl+b), kitty send_text mapping, TERN_HOME isolation, or reverse-engineering the tern Go binary","tokens":29,"bodyTokens":685,"excerpt":"# Tern TUI 前缀键改 Meta（Super/Win）：kitty 端映射方案\n\n## 背景结论（tern v0.7.7，闭源 Go 二进制）\n\ntern（tern.build，coding-agent 终端复用器）TUI 的前缀键 **Ctrl+B 是硬编码的**，不可通过任何配置修改：\n\n- 触发逻辑在 `tui.(*Model).key`（反汇编验证）：`cmp $0x62,%ebx`（'b'）+ `cmpq $0x4`（ctrl 修饰位）后置 prefix-mode 标志，全部是立即数。\n- `~/.tern/state/settings.json`（daemon 经 `settings.get` RPC 读取，strace 验证路径）里没有 prefix 相关键；试过 `prefix`、`keys.prefix`、`tui.prefix`、`ui.prefix` 等嵌套形式均无效。\n- `tern --help`、全部 `TERN_*` 环境变量、官网 tern.build/docs 与 changelog 均无此配置项。\n- "},{"name":"v2rayn-linux-tun-nopasswd-capability","description":"v2rayN Linux TUN prompts password; fix via setcap, not EnableTun GUI toggle","keywords":"Make v2rayN Linux TUN password-free (setcap + EnableTun=false): source-level mechanism, autostart chain, GUI-toggle trap, verification checklist","tokens":36,"bodyTokens":1548,"excerpt":"# v2rayN（Linux）TUN 免密码 + Custom 配置\n\n## 何时用\nCachyOS/KDE 上 v2rayN（/opt/v2rayn-bin）每次开 TUN 弹 sudo 密码；或切换 Custom 条目后\"能切换但没网\"。\n\n## 机理（三层独立，先懂再动手）\n```\n核心是否 sudo   ← TunModeItem.EnableTun（CoreConfigContextBuilder.cs:45 → IsTunEnabled → ShouldRunAsSudo = isTunLaunch && coreType∈{sing_box,mihomo,Xray} && nonWindows）\n有无 tun 入站   ← Custom 配置文件本身（GenerateClientCustomConfig 只有 File.Copy，不增删 inbounds）\nTUN 建立权限    ← 进程 CAP_NET_ADMIN（setcap 或 root）\n```\n`StatusBarViewModel` 构造函数每次启动执行 `if (En"},{"name":"v2rayng-xray-custom-hysteria2","description":"Author v2rayNG Xray JSON for hysteria2 or Reality server configs","keywords":"Author v2rayNG Custom (Xray) JSON for hysteria2/Reality: server-side hex pin, hysteriaSettings.auth, first-outbound default, Xray QUIC limitation, real-run verification","tokens":30,"bodyTokens":1432,"excerpt":"# 给 Android v2rayNG 写 Xray Custom 配置（hy2 + Reality）\n\n## 何时用\n把桌面 sing-box/Karing 的节点（camelia hy2 / Reality）搬成 v2rayNG 的完整自定义配置（含分流）。**前提：v2rayNG 是 Xray-core，无 sing-box**——`CustomFmt.parse()` 用 Xray 的 `V2rayConfig` 反序列化，喂 sing-box JSON 会静默得到空 outbound。要原生 sing-box JSON 用 SFA/husi。\n\n## 内核身份核验（别信 README，拆 APK）\n```bash\ncurl -fsSL -o /tmp/ng.apk \"\u003crelease>/v2rayNG_\u003cver>_arm64-v8a.apk\"\nunzip -q -o /tmp/ng.apk 'lib/arm64-v8a/libgojni.so' -d /tmp/ngx\nS=/tmp/ngx/lib/arm64-v8a/libgojni."},{"name":"vicinae-clipboard-anchor-no-recapture","description":"Use for Vicinae clipboard recapture, thumbnail-left preview, Wayland horizontal resize; not slide-left.","keywords":"Preserve Vicinae's user-corrected composite clipboard behavior and thumbnail-left floating preview: prevent history recapture and use Wayland horizontal resize rather than slide-left.","tokens":33,"bodyTokens":1105,"excerpt":"# Vicinae composite output and floating-preview anchoring\n\n## User contract\n\nIn `~/code/vicinae-learn`:\n- Multi-select produces **one composite clipboard item and one paste**, including mixed text/images. Reverse paste reverses composition order, not a sequence of separate paste events.\n- Generated multi-entry combinations are output only: neither copy nor paste should insert them into clipboard history again. Ordinary external copies must continue recording. Do not delete ex"},{"name":"vicinae-clipboard-monitor-wayland-death","description":"Vicinae stops all clipboard events after compositor restart/VT switch; not Spectacle onlyReplaceEmpty.","keywords":"Use when Vicinae stops recording ALL clipboard events (text and images) after compositor restart/VT switch; helper Wayland socket death diagnosis, kill-to-recover, disconnect-exit fix; not the Spectacle onlyReplaceEmpty marker (correct behavior).","tokens":33,"bodyTokens":693,"excerpt":"# Vicinae clipboard monitor death after Wayland compositor restart\n\n## Symptom\n\nVicinae records nothing new (text AND images) while `wl-paste` still shows the current selection and the KDE clipboard applet works. Often noticed as \"Spectacle screenshots not saved to Vicinae\". Trigger: kwin_wayland/compositor restart, VT switch, session resume.\n\n## Diagnosis\n\n1. `pgrep -af vicinae` — find `vicinae-data-control-server` PID.\n2. Count its sockets: `ls -l /proc/\u003cPID>/fd | grep -c s"},{"name":"wanxiang-rime-upgrade","description":"Upgrade 万象拼音 fcitx5-rime: backup, custom.yaml migration, staged validation; not generic Rime.","keywords":"Upgrade fcitx5-rime 万象拼音 on this machine: backup, release+gram download, custom.yaml migration, staged deploy validation — and never restart fcitx5/KWin on Plasma Wayland","tokens":34,"bodyTokens":1836,"excerpt":"# 万象拼音 (fcitx5-rime) 升级流程\n\n位置：`~/.local/share/fcitx5/rime/`（非 git 管理）。上游：github.com/amzxyz/rime-wanxiang（base 全拼变体）。语法模型独立发布在 **amzxyz/rime-wanxiang-data**（原 `RIME-LMDG`，API 重定向）的 `LTS` release；该 tag 会原地重传资源，按 `updated_at`/`digest` 判断新旧。\n\n## ⚠️ 铁律：不要以任何方式重启 fcitx5 / KWin\n\n本机 Plasma Wayland：KWin 启动时按 `kwinrc [Wayland] InputMethod=/usr/share/applications/fcitx5-wayland-launcher.desktop` 拉起 `fcitx5-wayland-launcher --reopen`，由它通过 D-Bus（`org.fcitx.Fcitx.Controller1` 的 `Open/Reope"},{"name":"waywallen-build-deploy-verify","description":"Building/deploying/verifying waywallen: sudo, cmake --install, WS random-port smoke, concurrent agents.","keywords":"Build/deploy/verify waywallen safely: root-owned build artifacts from sudo builds, install via cmake --install, WS smoke against random port, concurrent-agent hazards","tokens":35,"bodyTokens":632,"excerpt":"# Building & deploying waywallen on this machine\n\nComplements `waywallen-qt6112-ui-build` (Qt prefix setup — read it first for UI builds). This covers build-tree ownership, install, and end-to-end verification.\n\n## Root-owned build artifacts after sudo builds\n\nAny `sudo ninja`/`sudo cmake --build` writes object files as root. Later user builds then fail with:\n\n- clang: `unable to open output file '*.o': Operation not permitted`\n- cargo/mlua-sys: `lua-src ... PermissionDenied`"},{"name":"waywallen-mpris-pause-debug","description":"waywallen MPRIS wallpaper pause logging, fake players, timeout/debounce; not general MPRIS.","keywords":"Diagnose and fix waywallen's MPRIS-driven wallpaper pause: logging setup, fake players, known non-bugs, timeout/debounce design","tokens":33,"bodyTokens":690,"excerpt":"# waywallen MPRIS media-pause debugging\n\nDebug recipe for the \"listen to other media and pause\" (media_playing) feature in the waywallen fork.\n\n## Architecture\n\nTwo independent D-Bus watchers exist:\n- `src/media_monitor.rs` — feeds `router.update_media_playing(bool)` for the auto-replay `MediaPlaying` condition.\n- `src/mpris.rs` — forwards track metadata snapshots to renderers subscribed to `mpris` events. Irrelevant to pausing.\n\nChain: NameOwnerChanged/ListNames → per-player"},{"name":"waywallen-ui-deploy-verify","description":"Rebuild/install/restart/headless-verify waywallen UI/daemon; Qt 6.11.1 temp-prefix, silent-startup OpenUi; not unrelated deploys.","keywords":"Rebuild, install, restart, and headless-verify the waywallen UI/daemon on this machine, including the Qt 6.11.1 temp-prefix workaround and silent-startup OpenUi step","tokens":47,"bodyTokens":936,"excerpt":"# Waywallen UI build / deploy / verify loop\n\nLocal CachyOS checkout `~/code/waywallen`, installs to `/usr/local`, daemon runs as systemd user unit `app-org.waywallen.waywallen@autostart.service`.\n\n## Build\n\n```bash\nLD_LIBRARY_PATH=/tmp/qt6111/usr/lib ninja -C build/clang-release waywallen waywallen-ui waywallen-video-renderer\n```\n\n- While system Qt is 6.11.2 and only clang 22.x is available (clang 22 ICEs on Qt 6.11.2 headers in C++20 named-module TUs), the build dir must sta"},{"name":"xm3-hfp-autoswitch-default-source","description":"Use XM3 A2DP meetings, mSBC connect race, stuck HFP; not unrelated audio.","keywords":"Diagnose/fix WH-1000XM3 (or other BT headset) staying in A2DP during meetings, mSBC-on-connect race, and stuck-in-HFP wedge; includes applied CVSD pin + self-heal watcher on cindy","tokens":33,"bodyTokens":2332,"excerpt":"# XM3 / BT headset HFP autoswitch (cindy, CachyOS)\n\nVideo conference opens mic → no call-mode audio on WH-1000XM3. Usually **not** a broken autoswitch: the app never captured the BT loopback source, so WirePlumber never left A2DP.\n\n## Reverse case: \"上来 mSBC 而不是 LDAC\" (root-caused 2026-10-11, FIXED & VERIFIED 2026-10-12)\n\n**FIX APPLIED**: `~/.config/wireplumber/wireplumber.conf.d/52-xm3-hfp-cvsd.conf` pins `device.profile.priority.rules` for `bluez_card.38_18_4C_95_A4_8F` with"},{"name":"xm3-hfp-jamesdsp-sco-guard","description":"Use XM3 JamesDSP A2DP/default-sink gating; skip HFP/other/absent; flatpak doc-portal mount repair.","keywords":"WH-1000XM3 only device JamesDSP filters; guard gates DSP on XM3+A2DP+default sink, off for HFP/other/absent; flatpak doc-portal mount repair","tokens":44,"bodyTokens":1866,"excerpt":"# WH-1000XM3 + JamesDSP scoped DSP (cindy, CachyOS)\n\nJamesDSP (`me.timschneeberger.jdsp4linux`, Flatpak 2.7.0) must process **only** the WH-1000XM3 (`38:18:4C:95:A4:8F`). Two distinct failure classes live here; the same guard covers both.\n\n## Why the DSP must be killed, not just bypassed\n\n- **HFP/mSBC silence**: the DSP filter is 48 kHz stereo and zeros the 16 kHz SCO node (`bluez_output.38_18_4C_95_A4_8F.1`). `master_enable=false`, GraphicEQ off, and the `XM3-HFP-bypass` pre"},{"name":"youtube-search-yts","description":"YouTube CLI search videos/channels/playlists with sort/duration/date; not downloads/transcripts.","keywords":"Search YouTube videos/channels/playlists from CLI via yt-dlp search tab with native sort/duration/date filters (yts); not for downloads or transcripts","tokens":26,"bodyTokens":527,"excerpt":"# YouTube search: `yts`\n\nWeb search can't query YouTube. Use `yts` (`~/.local/bin/yts`, on PATH).\n\n```\nyts -n 20 \"query\"                     # default relevance, videos only\nyts -n 10 --sort date --period week \"linux kernel\"\nyts --sort views --duration long \"rustconf\"\nyts --type playlist \"kde plasma tutorial\"\nyts --type channel \"jon gjengset\"\nyts -n 30 --json \"topic\"              # JSONL: id,title,channel,duration,view_count,live_status,url\nyts --url \"...\"                    "},{"name":"zen-firefox-disable-http3-userjs","description":"Use for Zen/Firefox HTTP/3 QUIC user.js prefs, alt-svc; not general debugging.","keywords":"Zen/Firefox 永久禁用/恢复 HTTP/3(QUIC) 或任意 pref：user.js 配方、回退步骤、profile 布局、Karing fake-IP/明文 DNS 陷阱、alt-svc 判定 h3","tokens":32,"bodyTokens":1125,"excerpt":"# Disable HTTP/3 (or any pref) in Zen/Firefox\n\n## Pref name (HTTP/3)\n`network.http.http3.enable` — built-in default `true` since Firefox 88. Set `false` to disable QUIC.\nOld `network.http.http3.enabled` does NOT exist; do not write it.\nRelated toggles if ever needed: `network.http.http3.enable_0rtt`, `network.http.http3.enable_kyber`.\n\n## Durable method: user.js\nWrite `user_pref(\"\u003cname>\", \u003cvalue>);` into the profile's `user.js`. Re-applied on EVERY launch → survives `about:co"},{"name":"zen-nvidia-frame-drop-ablation","description":"Zen-only intermittent frame drops, KDE Wayland/NVIDIA; vblank holes, cadence, dmabuf/WebRender, Chrome/nvidia-powerd A/B.","keywords":"Use for Zen-only intermittent frame drops on KDE Wayland/NVIDIA: prove real vblank holes, separate 30fps cadence vs dmabuf/WebRender, Chrome A/B, nvidia-powerd A/B.","tokens":41,"bodyTokens":1584,"excerpt":"# Zen-only 掉帧：先证真实空洞，再分 dmabuf / 节拍 / 驱动\n\n适用：KDE Wayland + NVIDIA，Zen 间歇掉帧而 Chrome 正常；视频或 UI 都可能。Chrome 正常 = 系统/KWin 全局没坏，优先 Zen 的 WebRender/dmabuf 路径。\n\n## 0. 先钉环境与窗口\n\n```bash\npgrep -af '/opt/zen-browser-bin/zen-bin' | head\n# 活跃 profile：看哪个 profile 的 lock -> 127.0.1.1:+\u003cmainpid>\nls -l ~/.zen/*/lock\n```\n\n窗口→输出用一次性 KWin 脚本（`org.kde.kwin.Scripting`，小写 kwin；`/Scripting`）：`~/.local/share/kwin/scripts/\u003cname>/contents/code/main.js` 里 `print(\"MARKER \"+JSON.stringify(...))`，`loadScrip"},{"name":"zen-webdriver-pref-poisoning-sync-death","description":"Firefox/Zen sync dead, NS_ERROR_UNKNOWN_HOST dummy/fxa host, WebDriver prefs in real profile.","keywords":"Diagnose Firefox/Zen sync fully dead with NS_ERROR_UNKNOWN_HOST on a dummy/fxa host: WebDriver RecommendedPreferences left behind in a real profile, plus the cleanup procedure","tokens":34,"bodyTokens":1374,"excerpt":"# Firefox/Zen sync dead: WebDriver pref poisoning\n\n## Symptom signature\n\nSync is dead across **all** engines — desktop-to-desktop *and* desktop-to-Firefox-Android.\nThe UI shows the account signed in. `about:sync-log` (`\u003cprofile>/weave/logs/`) gains an\nerror file roughly every hour, all containing:\n\n```\nPOST https://{server}/dummy/fxa/oauth/token failed: NS_ERROR_UNKNOWN_HOST\nSync.SyncAuthManager ERROR  Non-authentication error in _fetchTokenForUser\nSync.Status  DEBUG  Status."}]</script>
<script>
(() => {
  const root = document.getElementById('managed-preview');
  const content = document.getElementById('omp-preview-content');
  const footer = document.getElementById('omp-preview-footer');
  const catalog = JSON.parse(document.getElementById('omp-preview-catalog').textContent);
  const byName = new Map(catalog.map(s => [s.name,s]));
  const defaults = {screen:'auto',query:'KWin',page:0,selected:null,read:false,mode:'lazy',pinned:['silent-testing-no-foreground-windows'],saved:false};
  let state = {...defaults};
  const escape = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function restore(value) {
    if (!value || typeof value !== 'object') return;
    if (['auto','search','settings','write'].includes(value.screen)) state.screen=value.screen;
    if (typeof value.query==='string') state.query=value.query.slice(0,150);
    if (['lazy','all'].includes(value.mode)) state.mode=value.mode;
    if (Array.isArray(value.pinned)) state.pinned=value.pinned.filter(n=>byName.has(n));
    if (byName.has(value.selected)) state.selected=value.selected;
    state.read=value.read===true;
  }
  restore(window.openai?.widgetState?.privateContent);
  function save() {
    const api=window.openai;
    if (api?.setWidgetState) api.setWidgetState({modelContent:{preview:'managed-skills',screen:state.screen,mode:state.mode,pinned:state.pinned,selected:state.selected},privateContent:state}).catch(()=>{});
  }
  function pinnedTokens() {return state.pinned.reduce((n,id)=>n+(byName.get(id)?.tokens??0),0);}
  function resultDescription(skill) {return skill.keywords || skill.description;}
  function detail(skill) {
    const pinned=state.pinned.includes(skill.name);
    return `<div class="detail"><div class="detail-heading"><div><div class="skill-name">${escape(skill.name)}</div><div class="muted small">正文约 ${skill.bodyTokens.toLocaleString()} tok · 原文节选</div></div><button type="button" class="cursor-interaction" data-pin="${escape(skill.name)}">${pinned?'取消下次常驻':'下次会话常驻'}</button></div><pre>${escape(skill.excerpt)}…</pre></div>`;
  }
  function autoScreen() {
    const ids=['kwin-pointer-warp-cross-screen','gtk3-wl-seat-v8-hires-scroll','omp-desktop-pet'];
    const items=ids.map(n=>byName.get(n)).filter(Boolean);
    const selected=items[0];
    content.innerHTML=`<div class="user"><span class="speaker">你</span>KWin 下想用快捷键把鼠标跳到另一块屏幕。</div>
      <p class="speech">先找一下已有的 KWin 操作经验。</p>
