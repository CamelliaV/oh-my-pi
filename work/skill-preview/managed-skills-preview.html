      <div class="tool"><div class="tool-title"><span class="check">✓</span><span class="tool-name">skill_search</span><span class="tag">拟新增</span><span class="muted">KWin pointer warp</span></div>
      <div class="small muted">检索本地技能，返回名称、description 和读取地址。</div>
      <div class="small muted">本地候选 · ${items.length} 条 · description 完整显示</div>
      ${items.map((s,i)=>`<div class="candidate ${i===0?'chosen':''}"><div>${i===0?'›':'·'} ${escape(s.name)}</div><div class="candidate-description">${escape(resultDescription(s))}</div><div class="candidate-description small path">skill://${escape(s.name)}</div></div>`).join('')}</div>
      ${state.read?`<div class="tool"><div class="tool-title"><span class="check">✓</span><span class="tool-name">read</span><span class="path">skill://${escape(selected.name)}</span></div><div class="small muted">已读取选中的正文 · 约 ${selected.bodyTokens.toLocaleString()} tok</div></div>${detail(selected)}<div class="entry">› 继续处理你的任务<span class="cursor"></span></div>`:`<div class="actions"><button type="button" class="primary cursor-interaction" data-action="next">下一步：读取选中的技能</button><button type="button" class="cursor-interaction" data-action="miss">查看未命中场景</button></div>`}`;
  }
  function matches() {
    const terms=state.query.toLowerCase().trim().split(/\s+/).filter(Boolean);
    return catalog.map(s=>({s,score:terms.reduce((n,t)=>n+(s.name.toLowerCase().includes(t)?5:0)+(s.description.toLowerCase().includes(t)?2:0)+(s.keywords.toLowerCase().includes(t)?1:0),0)})).filter(r=>terms.length===0||terms.every(t=>`${r.s.name} ${r.s.description} ${r.s.keywords}`.toLowerCase().includes(t))).sort((a,b)=>b.score-a.score||a.s.name.localeCompare(b.s.name)).map(r=>r.s);
  }
  function results() {
    const target=root.querySelector('#omp-search-results');
    const all=matches();
    const pages=Math.max(1,Math.ceil(all.length/5));state.page=Math.min(state.page,pages-1);
    const visible=all.slice(state.page*5,state.page*5+5);
    target.innerHTML=all.length?`<div class="small muted">${all.length} 条匹配 · description 完整显示</div><div class="list">${visible.map(s=>`<div class="skill-row"><div class="skill-main"><div class="skill-name">${state.pinned.includes(s.name)?'★ ':''}${escape(s.name)}</div><div class="skill-description">${escape(resultDescription(s))}</div><div class="skill-description path">skill://${escape(s.name)}</div></div><button type="button" class="cursor-interaction" data-read="${escape(s.name)}">读取</button></div>`).join('')}</div><div class="pages"><span class="small muted">${state.page+1} / ${pages}</span><div><button type="button" class="cursor-interaction" data-action="prev" ${state.page===0?'disabled':''}>上一页</button> <button type="button" class="cursor-interaction" data-action="more" ${state.page===pages-1?'disabled':''}>下一页</button></div></div>`:`<div class="empty"><div>没有匹配的本地技能</div><div class="small muted">可以换一个关键词，或浏览全部目录。</div><div class="actions"><button type="button" class="cursor-interaction" data-action="all">浏览全部 188 条</button></div></div>`;
    if(state.selected&&byName.has(state.selected)) target.insertAdjacentHTML('beforeend',`<div class="tool"><span class="check">✓</span> <span class="tool-name">read</span> <span class="path">skill://${escape(state.selected)}</span></div>${detail(byName.get(state.selected))}`);
  }
  function searchScreen() {
    content.innerHTML=`<h2 class="view-title">本地技能</h2><div class="view-subtitle">/skills local · 拟新增的本地搜索入口</div><label for="omp-local-query" class="small">名称或关键词</label><div class="search"><input id="omp-local-query" type="search" value="${escape(state.query)}" placeholder="例如 KWin、模型、kitty" autocomplete="off" spellcheck="false"></div><div id="omp-search-results" aria-live="polite"></div>`;
    results();
    root.querySelector('#omp-local-query').addEventListener('input',event=>{state.query=event.target.value;state.page=0;state.selected=null;results();save();});
  }
  function settingsScreen() {
    const pinned=state.pinned.map(n=>byName.get(n)).filter(Boolean);
    content.innerHTML=`<h2 class="view-title">技能目录</h2><div class="view-subtitle">/settings → Skills · 设置在下次新会话生效</div>
      <div class="setting"><div><div>目录模式</div><div class="small muted">固定技能常驻，其余按需检索</div></div><select aria-label="目录模式" id="omp-catalog-mode"><option value="lazy" ${state.mode==='lazy'?'selected':''}>按需发现</option><option value="all" ${state.mode==='all'?'selected':''}>全量目录</option></select></div>
      <div class="token-pair"><div><div class="small muted">当前全量目录 · 实测</div><div class="token-number">5,650 <span class="small">tok</span></div><div class="meter"><span style="width:100%"></span></div></div><div><div class="small muted">${state.mode==='lazy'?'拟议常驻预算 · 目标':'下次会话 · 全量'}</div><div class="token-number">${state.mode==='lazy'?'≤ 500':'5,650'} <span class="small">tok</span></div><div class="meter"><span style="width:${state.mode==='lazy'?'8.85':'100'}%"></span></div></div></div>
      <div class="rule"></div><div class="detail-heading"><span>固定常驻 <span class="muted small">${pinned.length} 条 · 摘要约 ${pinnedTokens()} tok</span></span><button type="button" class="cursor-interaction" data-action="pick">选择技能</button></div>
      ${pinned.length?pinned.map(s=>`<div class="skill-row"><div class="skill-main"><div class="skill-name">★ ${escape(s.name)}</div><div class="skill-description">${escape(s.description)}</div></div><button type="button" class="cursor-interaction" data-pin="${escape(s.name)}">取消常驻</button></div>`).join(''):'<div class="small muted" style="padding:12px 0">尚未固定技能。</div>'}
      <div class="actions"><button type="button" class="primary cursor-interaction" data-action="settings-save">保存设置</button></div>${state.saved?'<div class="notice" role="status">预览中已保存 · 下次新会话使用所选模式</div>':''}`;
    root.querySelector('#omp-catalog-mode').addEventListener('change',event=>{state.mode=event.target.value;state.saved=false;render();save();});
  }
  function writeScreen() {
    content.innerHTML=`<div class="user"><span class="speaker">你</span>把刚才的处理步骤记成一个技能，下次能找到。</div><div class="tool"><div class="tool-title"><span class="check">✓</span><span class="tool-name">manage_skill</span><span class="muted">create · example-workflow</span></div><div>已保存 managed skill。</div><div class="small muted">新会话可发现 · 当前会话不自动刷新目录</div></div><div class="rule"></div><div class="small muted">沿用当前已实现的写入行为</div><div class="entry">› <span class="cursor"></span></div>`;
  }
  function render() {
    root.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===state.screen)));
    footer.textContent=state.mode==='lazy'?'常驻目录 ≤ 500 tok · 设计目标':'全量目录约 5,650 tok';
    if(state.screen==='auto')autoScreen();else if(state.screen==='search')searchScreen();else if(state.screen==='settings')settingsScreen();else writeScreen();
  }
  root.addEventListener('click',event=>{
    const button=event.target.closest('button');if(!button||!root.contains(button)||button.disabled)return;
    if(button.dataset.screen){state.screen=button.dataset.screen;render();save();return;}
    if(button.dataset.read){state.selected=button.dataset.read;results();save();return;}
    if(button.dataset.pin){const n=button.dataset.pin;state.pinned=state.pinned.includes(n)?state.pinned.filter(v=>v!==n):[...state.pinned,n];state.saved=false;render();save();return;}
    switch(button.dataset.action){
      case 'next':state.read=true;break;
      case 'miss':state.screen='search';state.query='不存在的技能示例';state.page=0;state.selected=null;break;
      case 'all':state.query='';state.page=0;state.selected=null;break;
      case 'pick':state.screen='search';state.query='';state.page=0;state.selected=null;break;
      case 'prev':state.page=Math.max(0,state.page-1);break;
      case 'more':state.page++;break;
      case 'settings-save':state.saved=true;break;
      default:return;
    }
    render();save();
  });
  window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState?.privateContent;if(saved&&JSON.stringify(saved)!==JSON.stringify(state)){restore(saved);render();}});
  render();
})();
</script>
