<style>

<script type="application/json" id="omp-preview-catalog">[{"name":"aistudio2api-linux-login","description":"Linux AIStudio2API account import, 401 debug, Camoufox login; OAuth import is Windows-only","keywords":"Linux 上给 Mag1cFall/AIStudio2API 导入账户：Camoufox --login 差、Chrome OAuth 导入仅 Windows；用真实 Chrome 导出 Playwright storage-state；含 401 排查、第二账号 auth_index 补丁、Go WAA 后端、v0.2.16 升级与 Build 通道修复、开机自启与 ExecStartPost 探测","tokens":32,"bodyTokens":7153,"excerpt":"# AIStudio2API Linux 登录（绕开 Camoufox）\n\nLinux 上 `aistudio2api setup` / 管理页「浏览器登录」走隔离 Camoufox，体验差且容易失败。`chromeauth` 的 OAuth/DBSC 导入是 `//go:build windows`，Linux 直接报「Chrome OAuth 导入仅支持 Windows」。\n\n正确路径：从**已登录的真实 Chrome** 导出 Playwright storage-state，再 `setup --storage-state`。同一个 Chrome Profile 里的第二个 Google 账号还需要本仓库 `patches/` 里的 `auth_index` 补丁（见文末）。\n\n## 环境\n\n- 二进制：`/home/cindy/code/AIStudio2API/aistudio2api`（2026-10-27 起为本地构建 v0.2.16，`/api/status` 显示 `v0.2.16+dirty`）\n- 源码公开：`https:"},{"name":"android-proxy-client-core-identification","description":"Port sing-box configs to Android proxy clients, verify kernel from APK strings","keywords":"Selecting an Android proxy client or porting a sing-box config to it: verify kernel from APK strings, SFA/husi vs v2rayNG, mandatory trims, remote rule-sets, default_domain_resolver","tokens":24,"bodyTokens":1602,"excerpt":"# Android 代理客户端选型 + sing-box 配置移植\n\n## 何时用\n把桌面 sing-box/Karing 配置搬到 Android，或判断某客户端能否承载 hy2/QUIC/某协议。**永远不信任项目简介的内核说法，拆 APK 验证。**\n\n## 第一步：内核识别（决定性证据）\n```bash\ncurl -fsSL -o /tmp/app.apk \"\u003crelease apk url>\"; cd /tmp\nunzip -q -o app.apk 'lib/arm64-v8a/libgojni.so'\nS=lib/arm64-v8a/libgojni.so\nstrings -a $S | grep -c 'github.com/xtls/xray-core'    # >0 = Xray\nstrings -a $S | grep -c 'sagernet/sing-box'           # >0 = sing-box\nstrings -a $S | grep -oE 'sagernet/sing-box@v[0-9.]+[^"},{"name":"anthropic-relay-prompt-cache-debug","description":"Use for zero/low Anthropic prompt-cache hits on relay endpoints.","keywords":"Diagnose and fix zero/low Anthropic prompt-cache hit rates on relay endpoints","tokens":24,"bodyTokens":1838,"excerpt":"# Debugging Anthropic prompt-cache misses on relays\n\nUse when `cache_read_input_tokens` is 0 (or far below `cache_creation_input_tokens`) on an\n`anthropic-messages` provider pointed at a relay/gateway rather than `api.anthropic.com`.\n\n## 0. Know the #1 cause before you start\n\nClaude Code injects `x-anthropic-billing-header: cc_version=…; cc_entrypoint=…; cch=XXXXX;`\nas **`system[0]`**. In omp the `cch` was `xxHash64(whole request body)`, so it changed every\nturn. Anthropic's "},{"name":"arch-nix-usage-boundary","description":"Use when deciding Nix/Home Manager backup for Arch/CachyOS box or home config.","keywords":"Use when deciding whether Nix/Home Manager should back up an Arch/CachyOS box or its home config: system-layer coverage limits, per-project devshell niche, env-reproduction manifest, and the pacman-cache judgment flip.","tokens":28,"bodyTokens":1640,"excerpt":"# Arch/CachyOS 上用不用 Nix 管环境\n\n## 判定规则（先给结论，再给证据）\n\n**目标是「换机复现整机环境」→ Nix 0 分。** Arch 系统层的东西 Nix 在 Arch 上根本碰不到：\n\n- 包：pacman 多仓库（`cachyos-znver4` 系列 / `archlinuxcn` / 第三方自定义 repo，如 `denial`）+ AUR\n- 引导：limine / systemd-boot 及其 `/etc/default/*` 与内核 cmdline\n- 内核：`mkinitcpio.conf`、`modprobe.d`、`sysctl.d`、CPU 降压/调频 unit、NVIDIA RTD3\n- `/etc` 下非包拥有的文件、自定义 systemd unit、`/usr/local` 本地构建产物、`/opt` 非 pacman 安装树\n- NetworkManager 连接、ssh host key、sudoers、keyring\n\n**Nix 在 Arch 上真正值得用的只有两条：**\n\n1."},{"name":"bagu-md-add-interview-example","description":"八股N.md 红线条目/正文题 补面试口播实战算例；非此勿用","keywords":"为 八股N.md 红线条目/正文题补「面试口播实战算例」（黄金样本→逐项打分→版本迭代→病灶诊断 四步结构）时用","tokens":35,"bodyTokens":661,"excerpt":"# 给八股N.md补口播实战算例\n\n## 何时用\n用户在 `~/code/docs-working/interview/八股N.md` 要求「来个实际点的例子供面试讲解」或针对某条 `## 七` 红线加可背诵示例。收尾校验读 skill://bagu-md-review-audit §1 的机械校验脚本。\n\n## 步骤\n1. 定位：按用户引用的红线条目原文 `grep -n` 找到 `## 七` 条目与正文对应 `### N.` 题；读该题正文与框图，保证算例口径（指标定义、条数、离线集条数等既有数字）与正文自洽。\n2. 正文末尾（已有 bullet 之后、`---` 分隔之前）插 `#### 面试口播实战算例（被追问“举个实际例子”时直接背这一段）：`，固定四步：\n   - **Step 1 黄金样本表**：两列（字段|内容），四字段 `question`/`retrieved_contexts`/`response`/`ground_truth`；单元格禁含未转义 `|`。\n   - **Step 2 逐项打分表**：3 列（指标|打分过程|"},{"name":"bagu-md-review-audit","description":"Review/fix 八股N.md audits, ASCII alignment, cross-refs, 手撕题 Python complexity; not generic Markdown.","keywords":"Review/optimize/fix Chinese interview 八股N.md docs: structural+technical audit, ASCII box alignment repair, cross-reference validation; 手撕题必须 Python 最优复杂度最简写法","tokens":34,"bodyTokens":3033,"excerpt":"# 八股文档审校（八股N.md）\n\n## 何时用\n用户要求 review / 优化 / 修复 `~/code/docs-working/interview/八股*.md`（大模型/Java/K8s 等面试八股系列），要求「风格保持不变 + 细致讲解与面试速答 + 修复错误」。\n\n## 0. 先摸清风格基线\n- 读同目录 2~3 个兄弟文档（`八股18.md`/`八股22.md`/`八股24.md`）的标题骨架：\n  `grep -n '^##[^#]' 八股NN.md` —— 对比确认 `目录速览`、`## 一、…` 到 `## N、…`、H2 前的 `---` 分隔、每题 `#### 一/二/三` 三段式。\n- 不要引入新风格；只补全缺失的兄弟文档里已有的元素。\n- 编号可以不连续、不算错：有的文档从 Q2/Q14 起编且无「一、」节（八股10/11 实测），只要目录速览与正文自洽、且其他文档有 `八股NN.md:QN` 外部引用，就不要重编号。\n\n## 1. 机械校验（一次性脚本，只读）\n```python\nimport re, unicod"},{"name":"bagu-md-rewrite-clarity-clipboard","description":"八股N.md 让我更好理解：改写，不改文件，wl-copy；总纲→源码路径→为什么→记忆锚点","keywords":"八股N.md 贴文改写「让我更好理解」时用：不改文件，wl-copy 交付；总纲→源码路径主线→为什么→记忆锚点","tokens":44,"bodyTokens":513,"excerpt":"# 八股段落改写（易懂优先，剪贴板交付）\n\n触发：Cindy 贴出八股N.md 某段（通常在 ~/code/docs-working/interview/），说「重写一段让我更好理解」或类似。\n\n## 交付方式（重要）\n- **不要改源文件**。她明确说过：「你不需要写回去，直接输出到终端与剪贴板即可 wl-copy」。\n- 流程：`write` 临时 md → `bash`: `cat /tmp/x.md | wl-copy && wl-paste | wc -c && rm /tmp/x.md`（回读字节数验证剪贴板成功）。\n- 完整改写文本同时贴在聊天回复里（外层用 `~~~~markdown` 围栏包裹，避免内层 ``` 代码块破坏嵌套）。\n\n## 改写结构（验证有效的模式）\n1. **一句话总纲**：粗体，一句话给出心智模型（如「能 CAS 就不加锁，要加锁只锁一个桶」）。\n2. **找主线替代并列清单**：若原文是 N 个并列机制，按真实源码路径/时间线串成叙事（例：CHM put() = 一个自旋循环 + 四个分支，每个分支对应一个"},{"name":"bili-collection-reading-articles","description":"B站合集逐集生成阅读版文章时用；单视频非合集不用。","keywords":"把 B 站合集逐集生成阅读版学习文章：ugc_season 清单、分段上传但单次 Gemini 3.8-flash 看完整视频、产出到 docs-working/前缀/作者/合集","tokens":26,"bodyTokens":1453,"excerpt":"# B站合集 → 阅读版学习文章\n\n把一个合集（`type=season`）的每一集用 Gemini 3.8-flash **视频理解**写成阅读版 Markdown，不是字幕转录。\n\n## 何时用\n\n用户给 `https://space.bilibili.com/\u003cmid>/lists/\u003cid>?type=season`（或只给一个属于合集的 BV），要求逐集阅读版文章，落到 `/home/cindy/code/docs-working/\u003c前缀>/\u003c作者>/\u003c合集短名>/`（前缀如 `interview`）。\n\n## 合集清单\n\n不要用 `medialist type=5`（那是视频列表 series）。合集走任意一集的 view：\n\n```\nGET https://api.bilibili.com/x/web-interface/view?bvid=\u003c任一BV>\n→ data.owner.name                        → 作者层\n→ data.ugc_season.title / id             → 合"},{"name":"bili-video-to-gemini-url","description":"Use Bilibili BV/collection episode for Gemini complete-video public HTTPS; not per-segment merge.","keywords":"Download Bilibili videos (single BV or one collection episode) and have Gemini 3.8-flash understand the COMPLETE video via public HTTPS URLs (multi-part file_data in one call; never per-segment text merge); output follows prefix/author/collection/NN-title.md","tokens":30,"bodyTokens":1261,"excerpt":"# B站视频 → Gemini 3.8-flash 视频理解（公网直链，一次看完整视频）\n\n已端到端验证。用户要求质量优先：**必须 gemini-3.8-flash 视频理解**，禁止 Whisper / 字幕 / 2.5-flash 文本改写替代。\n\n## 管线\n\n1. **下载**：`yt-dlp` 格式回退链（部分视频无 av01）：\n   `worstvideo[height\u003c=480][vcodec*=av01]+worstaudio` → `worstvideo[height\u003c=480]+worstaudio` → `worstvideo[height\u003c=720]+worstaudio` → `worstvideo+worstaudio`\n2. **转码**：`ffmpeg -c:v libx264 -crf 38 -vf scale=256:-2 -c:a aac -b:a 32k`\n3. **上传公网**：`POST https://revue.de5.net/upload` → `https://revue.de5.net/f"},{"name":"bilibili-api-fav-toview-search","description":"需读取B站收藏夹/稍后再看/搜索，纯HTTP API，二维码登录","keywords":"通过纯 HTTP API 读取 B站收藏夹/稍后再看/搜索，含二维码登录的 Referer 与重定向陷阱","tokens":33,"bodyTokens":1464,"excerpt":"# 纯 HTTP 读取 B站收藏夹 / 稍后再看 / 搜索\n\n免浏览器模拟，直接调官方 Web API。登录态一次扫码获得，约 6 个月有效。\n\n## 何时用\n\n想读自己的收藏夹、稍后再看、搜索视频，且不想开浏览器 / Selenium 时。\n\n## 登录链路（三步，坑全在这）\n\n### 1. 生成二维码并轮询\n\n- `GET https://passport.bilibili.com/x/passport-login/web/qrcode/generate` → 拿 `qrcode_key` 和二维码 URL\n- `GET https://passport.bilibili.com/x/passport-login/web/qrcode/poll?qrcode_key=\u003ckey>` 轮询\n- **关键**：真实扫码状态在 `data.code`，不在外层 `code`：\n\n| data.code | 含义 |\n|---|---|\n| 86101 | 未扫码 |\n| 86090 | 已扫码，待 APP 确认 |\n| 86038 | 二维码过期 |"},{"name":"bilibili-collection-series-api","description":"读取B站合集/视频列表全部视频；单个视频勿用：space lists、ugc_season、medialist type=5","keywords":"读取 B站合集(ugc_season)与视频列表(series)全部视频：space lists URL、view.ugc_season、medialist type=5","tokens":38,"bodyTokens":1107,"excerpt":"# B站合集 / 视频列表：纯 HTTP 读全部视频\n\n空间页两种「列表」URL 形态相同、接口不同：\n\n- 合集（season）：`https://space.bilibili.com/{mid}/lists/{id}?type=season`\n- 视频列表（series）：`https://space.bilibili.com/{mid}/lists/{id}?type=series`\n\n`bili.py season` 用 medialist `type=5` 读的是 **series**，不是 ugc_season。\n\n## 列出某 UP 的合集/列表\n\n`GET api.bilibili.com/x/polymer/web-space/seasons_series_list?mid={mid}&page_num=1&page_size=10`\n\n- `data.items_lists.seasons_list[]`：合集。`meta.season_id` 即 URL 里的 `{id}`（例：8313288）\n- `data.items_"},{"name":"bilibili-overseas-access","description":"Use for overseas VPS Bilibili 412 WAF; fetch/download via wbi/view, player/playurl.","keywords":"Fetch/download Bilibili videos from an overseas VPS by bypassing the 412 WAF via wbi/view + player/playurl paths","tokens":31,"bodyTokens":765,"excerpt":"# Bilibili from an overseas VPS\n\nUse when a service on an overseas VPS (camelia/oracle) must fetch or download\nBilibili videos and the plain `www.bilibili.com` / `api.bilibili.com` paths\nreturn `412 Precondition Failed` (openresty WAF on non-CN IPs).\n\n## What is and isn't blocked\n\n- BLOCKED from overseas IPs: `www.bilibili.com/video/...` with a browser UA,\n  `api.bilibili.com/x/web-interface/view`, `/x/web-interface/playurl`.\n- NOT blocked: two API paths + the CDN itself.\n\n##"},{"name":"browser-engine-platform-attribution","description":"Chromium vs Gecko single-platform lag/reversal on Android/Linux/Windows; not general browser ranking","keywords":"解释 Chromium/Brave 与 Gecko/Firefox/Zen 在 Android/Linux/Windows 上体感反转或单平台卡顿时用；按平台关键路径×引擎适配债定位，不泛泛谈浏览器优劣","tokens":26,"bodyTokens":1238,"excerpt":"# 浏览器跨平台体感归因\n\n## 何时用\n用户问\"为什么 X 浏览器在 A 平台好、B 平台差\"，或单平台浏览器卡顿/耗电/掉帧需要归因时。Brave≈Chromium(只多 adblock)，所以问题实为 Chromium vs Gecko。\n\n## 步骤\n\n### 1. 先定该平台的\"体感关键路径\"\n不同平台瓶颈完全不同，先锁定再谈引擎：\n\n| 平台 | 关键路径 |\n|---|---|\n| Android | AMS/LMK 进程存活、SurfaceControl 上屏、MediaCodec overlay、ADPF 调度提示、触摸滚动延迟 |\n| Linux Wayland | ozone/wayland 后端、分数缩放、explicit sync、VA-API+dmabuf、fontconfig、libinput 滚动 |\n| Windows | DComp/DXGI overlay、DirectWrite/ClearType gamma、Media Foundation、per-monitor DPI |\n\n### 2. 查引擎在该路"},{"name":"browser-layout-geometry-ab","description":"off-center in one browser: measure viewport rects via CDP+Marionette headlessly","keywords":"Use when a page looks off-center/misaligned in one browser (Zen/Firefox vs Chrome): measure identical-CSS-viewport rects headlessly via CDP + Marionette before blaming the engine.","tokens":27,"bodyTokens":991,"excerpt":"# Diagnose \"not centered / not aligned\" with rect measurements, not speculation\n\n## Order of operations\n1. Fetch page HTML + CSS bundles (`/_next/static/chunks/*.css`), grep the class names from the DOM for `grid-column`, `max-width`, `justify-self`, and extract the `@media` context of each rule (walk braces backwards from the match). Breakpoint values are in CSS px of the *web content area*.\n2. Measure the SAME page in both engines at the SAME `innerWidth` (scrollbar differe"},{"name":"browser-video-stutter-network-vs-client","description":"Intermittent video stutter/frame drops: network/CDN vs decode vs Karing TUN/NVIDIA Wayland cadence","keywords":"定位浏览器视频「间歇性卡顿/跳帧」是网络/CDN、解码，还是呈现节拍（Karing TUN + NVIDIA Wayland）：MPRIS 定位在播视频、playurl→ffprobe 验源码流时基、drm_vblank 翻页时基探针、pref 实名核查、保留硬解的 A/B 阶梯","tokens":35,"bodyTokens":4797,"excerpt":"# 浏览器视频间歇性卡顿：网络 vs 客户端 vs 呈现节拍\n\n适用：Zen/Firefox（本机配 Karing TUN，NVIDIA Wayland 双屏）播放视频出现「间歇性卡顿 / 像跳帧」，要在改动任何配置前先定性归属。\n\n## 0. 先取环境（不要相信历史笔记里的端口，端口会变）\n\n```bash\npgrep -a zen-bin; pgrep -a -f karingService   # 从命令行读 --service-http-port\npython3 -c \"import json;s=json.load(open('/home/cindy/.local/share/com.nebula.karing/service.json'));print(s['control_port'],s['secret'])\"\n```\n\nKaring 的 Clash API 在 `service.json` 的 `control_port`（**不是** cmdline 的 `--service-http-port`；后者对本机 HTTP 返回 "},{"name":"camelia-cf-youxuan","description":"Use when Cloudflare VLESS-WS 优选, v2rayN rules, Karing Host, or wsip breaks","keywords":"camelia Cloudflare VLESS-WS 优选全链路：服务器架构（Origin Rule 8443/SaaS fallback）、校园 DNS 投毒与 wsip 钉解析、v2rayN DB 规则（snowflake IndexId/RequestHost/DNSItem hosts）、Karing 丢 Host→本地转发器、优选 IP 扫描法（SO_MARK+WS 101+CF-RAY）","tokens":35,"bodyTokens":1972,"excerpt":"# camelia Cloudflare 优选（VLESS-WS 优选入口）\n\n用于 cindy 在 camelia 上加/修 CF 优选链路，或其 Karing/v2rayN 节点 403、优选域名解析成垃圾。**不是 Zero Trust/cloudflared**（2026-09 已弃路径）。\n\n## 架构（2026-09-29/30 建成，勿重建）\n```\n客户端（Address=优选 IP 或 wsip 优选域名）\n  --TCP 443, SNI/Host=ws.camelliav.de5.net--> CF 边缘（按 SNI 认站点，不看 IP）\n  --Origin Rule→8443--> camelia Caddy（终结 TLS，LE 证书）\n  --> 172.19.0.1:2080 vless-ws-in（path /cdn，early-data 头 Sec-WebSocket-Protocol）\n```\n- Zone `camelliav.de5.net` = ea4f6246727db53afa0bdcd64dc7e4"},{"name":"camelia-cpu-qwen-tts-llamacpp","description":"Use for Qwen3-TTS llama.cpp CPU ARM Oracle A1 RAM limits; not GPU.","keywords":"在 camelia (Oracle A1 ARM 4 OCPU / 24 GiB, 无 GPU) 上用 llama.cpp 部署 Qwen3-TTS CPU 推理服务：编译、serve 模式改造、内存约束、已知坑","tokens":34,"bodyTokens":1700,"excerpt":"# camelia CPU TTS (Qwen3-TTS) 部署与踩坑\n\n## 背景\ncamelia = Oracle A1 ARM, **4 OCPU Neoverse-N1, 24 GiB**（2026-09-29 OCI metadata 实测；旧笔记 2 核 / 12G 已过期）, 无 GPU. 目标: 纯 CPU 跑 Qwen3-TTS-12Hz-1.7B, 异步合成. keepmem 已 inactive+disabled, 不要再为腾内存去停它.\n\n## 唯一可行路线: llama.cpp GGUF\n- 编译: `git clone llama.cpp; cmake -B build -DGGML_NATIVE=ON; cmake --build build -j4 --target llama-tts`（旧笔记 `-j2` / 约 9 分钟是 2 核时期的；现在 4 OCPU）\n- 模型: `ggml-org/Qwen3-TTS-12Hz-1.7B-Base-GGUF` (Q4_K_M 1.04G + mmproj Q8 0.45"},{"name":"camelia-hy2-client-ab","description":"Use laptop camelia Hy2/Reality, Karing :3066, live aggressive hy2-in; not Karing JSON.","keywords":"A/B cindy 的 camelia Hy2 vs Reality from the laptop without trusting Karing :3066; live aggressive is server hy2-in, not Karing JSON; 1.2.25 core is sing-box 1.13 and drops bbr_profile; 1.2.26.2904 is 1.14.1 but pacman -U clears setuid","tokens":35,"bodyTokens":3966,"excerpt":"# camelia Hy2 client A/B (laptop)\n\nUse when cindy asks to try client `bbr_profile`, compare Hy2 UDP vs Reality TCP, or asks if Cloudflare TCP/named-tunnel would be **faster or lower-latency** than current Hy2.\n\n## What is already done (do not re-tune)\n\nVPS `camelia` (Phoenix `161.153.82.173`, `ssh oracle`):\n\n- Hy2 inbound: `ignore_client_bandwidth: true`, `bbr_profile: aggressive` (sing-box 1.14). No Brutal. This inbound is the aggressive that actually applied. 2026-09-21 thr"},{"name":"camelia-imgbed-tailscale","description":"Use Tailscale-only :7658 camelia ImgBed, local-disk R2, 72h TTL, CameliaImgBot; not revue.de5.net.","keywords":"Operate cindy's camelia Docker ImgBed (Tailscale-only :7658, local-disk R2, 72h TTL, CameliaImgBot); not the revue.de5.net Pages instance","tokens":44,"bodyTokens":1159,"excerpt":"# camelia ImgBed (Docker, Tailscale only)\n\nUse when starting, fixing, or probing the **VPS** ImgBed on camelia. The Cloudflare Pages copy on `revue.de5.net` is a different instance — see `cloudflare-imgbed-revue-ops`.\n\n## Layout\n\n- Compose: `/home/ubuntu/imgbed/docker-compose.yml`\n- Data: `/home/ubuntu/imgbed/data/` (`database.sqlite`, `r2/`, `tg-cache/`)\n- Overlay: `/home/ubuntu/imgbed/overlay/file-path.js` bind-mounted onto `/app/functions/file/[[path]].js` (GET-side Telegr"},{"name":"camelia-ssh-via-chuncheon","description":"Direct Phoenix :22 drops: ssh camelia-cc via Karing :3066 Hy2; not NLB/7898.","keywords":"SSH to camelia when direct Phoenix :22 drops: use ssh camelia-cc through Karing :3066 Hy2; NLB has no SSH; 7898 private-IP bypass is a false win","tokens":38,"bodyTokens":848,"excerpt":"# SSH to camelia via Chuncheon Hy2\n\nUse when direct `ssh oracle` (`161.153.82.173:22`) times out or handshakes in 1–3 s, or when checking the Chuncheon path. Do not open a new OCI instance. Do not SSH to the NLB IP.\n\n## What exists\n\n- NLB `168.107.41.73` is Karing tag `camelia-hy2-春川`: UDP/443 Hy2 only, same password as camelia Hy2, SNI `www.nvidia.com`, `insecure`. Port 22 on the NLB is closed. TCP/443 to the NLB IP hairpins campus→Chuncheon→Phoenix; that RTT is not the entr"},{"name":"camelia-tts-dub","description":"camelia TTS 配音、Hermes text_to_speech 后台合成时用；其他勿用","keywords":"camelia TTS 配音：hermes text_to_speech 全链路后台化（秒回+后台合成+任务 log），已验证打通","tokens":32,"bodyTokens":1583,"excerpt":"# camelia TTS 配音合成\n\n## 何时用\nhermes 需要把文本合成配音（博客朗读、视频配音、长文本转语音）时。\n\n## 服务现状\n- camelia (Oracle A1 ARM64, `ssh oracle`) 上 `camelia-tts.service` 常驻，端口 `127.0.0.1:7788`\n- `POST /v1/tts {\"text\",\"lang\":\"zh\"}` → audio/wav；`GET /health` 探活\n- 后端 llama.cpp Qwen3-TTS-12Hz-1.7B GGUF Q4 + flow matching，克隆 A子 音色（参考音频 `~/tts-model/speaker_ref_24k.wav`，必须 24kHz）\n- **RTF 约 7×**：生成时间是音频的 7 倍。2.5 分钟音频 ≈ 20 分钟计算\n- 生成期 RSS 恒定 8.3GB；网关超时 3600s → 单段 ≤260 字\n\n## hermes 接入（后台模式，已验证打通 2026-09-19）\n\n**已实测**"},{"name":"ccta4d-progress-ppt-report","description":"CCTA4D/vox2organ 组会进展 PPT：需 codex 会话+reports/ 主线、lab-4090 逐帧网格渲染图","keywords":"为 CCTA4D/vox2organ 课题做组会进展 PPT：从 codex 会话+reports/ 提取主线、从 lab-4090 拉逐帧网格渲染汇报图","tokens":51,"bodyTokens":1638,"excerpt":"# CCTA4D 组会汇报 PPT 生成流程\n\n用于把 vox2organ / CCTA4D（4D 心脏网格重建，lab-4090 实验）的阶段性进展整理成组会 PPT，并导出逐帧 Mesh 可视化。非此课题勿用。\n\n## 0. 工作目录约定\n\n一次汇报一个目录：`outputs/ccta4d_\u003cYYYYMMDD>-ppt/`，内含\n- `build_ppt.py`、`make_figs*.py`（图表→成品全脚本化，数字只来自 JSON/CSV）\n- `figures/`、渲染出的 `.pptx` + 同名 `.pdf`、拉回的原始 `summary.json / subjects.json / frames.csv`\n所有数字必须能从这些文件逐项复核；不要手打数字进 deck。\n\n## 1. 素材来源（先挖会话，再核仓库）\n\n- codex 会话 JSONL：`~/.codex/sessions/YYYY/MM/DD/rollout-*-\u003csession_id>.jsonl`；记录类型 `response_item` 且 `payload.r"},{"name":"ccta4d-single-factor-longrun","description":"CCTA4D long-training lab-4090: same-fold static warm-start, immutable snapshots, tmux, checkpoint verification.","keywords":"Use when launching isolated CCTA4D long-training experiments on lab-4090 with same-fold static warm-start, immutable snapshots, tmux and real checkpoint verification.","tokens":36,"bodyTokens":822,"excerpt":"# CCTA4D isolated single-factor long training\n\nUse for `/home/cindy/code/vox2organ` experiments on `lab-4090`.\n\n## Existing implementation\n\n- Remote project: `/media/D/wl/ccta4d-research`.\n- Interpreter: `/home/wang_liang/.conda/envs/vox2organ/bin/python`.\n- CLI: `ccta4d/__main__.py`; training: `ccta4d/long_training.py`.\n- `run_long.py` starts static and joint independently from original pretrained weights. It does not initialize joint from its concurrently trained static bra"},{"name":"cindy-local-disk-cleanup","description":"Use for local btrfs 98% cleanup, -xdev subvolume traps; not remote servers.","keywords":"Cindy 本机磁盘空间清理 recipe:98% btrfs 紧急清理、已验证安全执行清单、-xdev 子卷陷阱;非远程服务器运维。","tokens":31,"bodyTokens":936,"excerpt":"# 本机磁盘清理 recipe(CachyOS btrfs)\n\n触发:「本地空间清理」/ 空间不够 / df 快满。\n\n## 机器事实\n- `/` = btrfs `/dev/nvme1n1p3` 1.6T,single data;`/home`、`/srv`、`/root`、`/var/cache`、`/var/log` 都是同一 btrfs 子卷,df 显示同一设备。\n- btrfs >95% 时会 ENOSPC 卡死操作,属紧急,先清缓存挡住。\n- `/run/media/cindy/Windows-SSD` 941G 有余量,可作大数据集搬迁目标。\n- 不动:`~/.omp/sessions`(会话历史)、`~/temp`(GYZ 4D 心脏数据)、`.wine`、音乐/图片本体。\n\n## 诊断流程\n1. `df -h` + `sudo -n btrfs filesystem usage /`(看 Data Used 与 Free,比 df 准)。\n2. `du -h -d1 /home/cindy | sort -h` 耗时 ~3min"},{"name":"claude-relay-shape-vs-capacity","description":"Claude relay failures: replay real traffic; distinguish request shape vs upstream capacity","keywords":"Decide whether Claude relay failure is request shape or upstream capacity by replaying real traffic","tokens":27,"bodyTokens":995,"excerpt":"# Relay failure triage: request shape or upstream capacity?\n\nUse when a Claude-compatible relay (anyrouter, sub2api, new-api, one-api…) rejects your\nclient but the user says \"it works in Claude Code\". Both claims are usually true and\nsampled at different times. Do not argue; measure.\n\n## 1. Capture the reference client's real wire traffic\n\nReal CC is the ground truth for \"a shape this relay accepts\".\n\n**The gotcha that wastes an hour**: `ANTHROPIC_BASE_URL` as an ambient env "},{"name":"cloudflare-imgbed-revue-ops","description":"Use when updating revue.de5.net CloudFlare-ImgBed CamelliaV CF Pages, test uploads, Telegram limits.","keywords":"Update cindy's revue.de5.net CloudFlare-ImgBed (CamelliaV fork → CF Pages) and test uploads without guessing build output or Telegram size limits","tokens":36,"bodyTokens":870,"excerpt":"# revue.de5.net CloudFlare-ImgBed\n\nUse when updating or probing cindy's **Pages** ImgHub: project `cloudflare-imgbed`, domain `revue.de5.net`, GitHub `CamelliaV/CloudFlare-ImgBed` (upstream `MarSeventh/CloudFlare-ImgBed`).\n\nThe Docker copy on camelia (`http://100.114.186.0:7658`) is a **different** instance. Large Telegram files go there — see `camelia-imgbed-tailscale`.\n\n## Update\n\nFork has no unique commits. Sync:\n\n```bash\ngh repo sync CamelliaV/CloudFlare-ImgBed --source M"},{"name":"codex-mcp-notion-oauth-invalid-target","description":"Use when fixing codex mcp login notion invalid_target 400 from duplicate resource.","keywords":"codex mcp login notion 因重复 resource 参数报 invalid_target 400 时的手动修复流程","tokens":29,"bodyTokens":530,"excerpt":"# codex mcp login notion — invalid_target 修复\n\n## 症状\n`codex mcp login notion` 打开的授权页报 **invalid target**，随后 5 分钟超时 exit 1。\n\n## 根因\ncodex 0.163.0/0.164.0 从 `https://mcp.notion.com/.well-known/oauth-protected-resource` 读取 `protected_resources`（Notion 返回两个：`https://mcp.notion.com` 与 `https://mcp.notion.com/mcp`），全部拼进 authorize URL 形成重复 `resource=` 参数。Notion OAuth 服务端严格校验：\n\n```\nHTTP 400 {\"error\":\"invalid_target\",\"error_description\":\"Only one resource parameter is supported.\"}\n```\n\n"},{"name":"dkms-orphan-version-build-failure","description":"DKMS Bad return status: distinguish orphan registration from in-use kernel version","keywords":"DKMS 模块在某内核上报 Bad return status 时：区分孤儿注册与实际在用版本，验证已装 .ko，定位内核 API 变更","tokens":25,"bodyTokens":696,"excerpt":"# DKMS 单版本编译失败分诊（孤儿注册 vs 实际在用版本）\n\n## 症状\n内核更新 hook 里某模块一个版本报 `Error! Bad return status for module build` + `exited 10`，但同包另一版本正常 installed。不要立即修编译错误——先确认失败的版本是否根本没人用。\n\n## 分诊步骤\n1. `dkms status` — 列出各版本 × 各内核的 built/installed 状态。失败版本若在所有内核上都只是 `built` 从未 `installed`，是强孤儿信号。\n2. `pacman -Qo /usr/src/\u003cname>-\u003cver>` — **无包拥有** = 孤儿源码树（老 AUR 包降级/换包时 dkms 注册残留）。\n3. `grep -n '\u003cname>' /var/log/pacman.log | grep -E 'installed|upgraded|removed'` — 还原版本历史，确认现役包是哪个版本、何时装的。\n4. 验证实际在用版本（关键证据链）"},{"name":"docker-net-karing-tun-bypass","description":"Use when Docker DNS/outbound dead with Karing TUN active; not other issues.","keywords":"Fix docker containers losing network when Karing TUN is active (DNS dead, outbound blackholed)","tokens":28,"bodyTokens":776,"excerpt":"# Docker container networking dead under Karing TUN (this machine)\n\n## Symptom\n\nWith Karing TUN up (tun2, 10.20.0.0/30), ALL docker container networking dies: DNS to any resolver times out, TCP to public IPs times out; host networking is fine. Also breaks `docker compose` builds (apk/npm/go mod fetch fail at DNS).\n\n## Root cause (verified with tcpdump on any, 2026-09-11)\n\nKaring policy routing hijacks container traffic. Reply path proven: gateway's ICMP/TCP replies arrive wla"},{"name":"docker-verify-db-behavior-claims","description":"本机无本地服务有镜像，需 Docker 验证 MySQL/Redis 行为断言；否则勿用","keywords":"本机用 Docker 实机验证 MySQL/Redis 等中间件行为断言（本机无本地服务但有镜像），含多会话并发验证的连接陷阱","tokens":39,"bodyTokens":1123,"excerpt":"# 本机用 Docker 实机验证数据库/中间件行为\n\n面经八股整理时，凡是要写\"Kafka 为什么快\"\"MVCC 怎么挡幻读\"\"Redis slot 怎么迁\"这类**机制性断言**，先跑一遍再写。实测数据比\"据说\"值钱，而且能直接推翻网传错误说法。\n\n## 环境事实（本机 2026-09 验证）\n- **无** `mysql` / `redis-server` / `redis-cli` 二进制；**有**镜像 `mysql:8.0`（8.0.45）、`redis:6.0-alpine`（6.0.20）。\n- `docker run -d --name pgtest-mysql -e MYSQL_ROOT_PASSWORD=root -p 13306:3306 mysql:8.0`\n  —— `mysqladmin ping` 会过早返回\"就绪\"，要用 `mysql -e \"select 1\"` 才算真 ready。\n- Python **无 pip、无系统 site-packages 写权限**。用 `uv run --with pymysq"},{"name":"docx-form-fill-preserve-layout","description":"Fill .docx forms via OOXML preserving layout; not Markdown writing","keywords":"填写 .doc/.docx 表单/考核表并把内容压进既有版式（东大中期考核表、开题报告类）：原件复制、OOXML 直改、分页与页满校验；不是普通 Markdown 写作","tokens":24,"bodyTokens":1703,"excerpt":"# 目标\n\n在**不改动原件版式**（表格框线、行高、字体、页码页脚、分页）的前提下，往既有 .doc/.docx 表里填长文本，并保证每节仍落在原来那一页。适用于东大中期考核表、开题报告、各类研究所/院系表。\n\n关键判断：这不是“用 pandoc 转 markdown 再写回”，也不是 python-docx 重建文档。用 **lxml 直接改 `word/document.xml`**，其余 part 原样抄回。\n\n## 0. 先问清原件\n\n- 用户说“这是原件，复制之后完善”时，**只复制那份 bak/原件**；同目录里已有的 `cur.doc`/`cur.docx` 通常是更早草稿，只能当内容参考，不要在其上继续改（版式可能已漂）。\n- `.doc` 先转一份 docx 用来读：`soffice --headless --convert-to docx bak.doc --outdir .`。**保留原始 .doc 不动**，交付时再导回 doc。\n- 抽出纯文本看结构：`x.replace('\u003c/w:p>','\\n').replace("},{"name":"dsh-linux-desktop-install","description":"dsh desktop app install or headless verify on Linux","keywords":"Install/headless-verify the DeepSeek Harness (dsh) Electron desktop app on Linux, where upstream ships no Desktop target","tokens":20,"bodyTokens":1716,"excerpt":"# dsh Desktop on Linux (no official target)\n\nUse when asked to install dsh's **app/desktop** on this Linux box, or when asked why mac/win look different. `dsh` = DeepSeek Harness (`deepseek-ai/deepseek-harness`); the CLI here is pacman `deepseek-harness-bin` → `/usr/bin/dsh`, `DSH_HOME=~/.dsh`.\n\n## Facts to state before acting\n\n- Upstream publishes **no Linux Desktop**: `apps/desktop/scripts/desktop-build-paths.mjs` `SUPPORTED_TARGETS = new Set(['mac-arm64','mac-x64','win-x64"},{"name":"dsh-router-model-gate-check","description":"Use when checking if dsh router activates for a model id.","keywords":"Check whether dsh router extension actually activates for a given model id","tokens":22,"bodyTokens":1493,"excerpt":"# dsh router model-gate check (no LLM quota)\n\nUse when asked \"does the DeepSeek omp plugin (dsh) hit model X?\" — e.g. after a new SKU appears (`deepseek-v4.1-flash`).\n\n## Gate semantics (as of 2026-09-11, v4.1 folded in)\n\n`~/.omp/agent/extensions/router-deepseek-dsh-spec.ts`:\n\n```ts\nconst V41_ID_RE = /^deepseek-v4\\.1-/;\nfunction currentModelId(ctx) {\n  return currentModel(ctx)?.id.toLowerCase().split(\"/\").at(-1)?.replace(V41_ID_RE, \"deepseek-v4-\");\n}\nisProModel   = id.startsW"},{"name":"dualboot-bluetooth-key-sync","description":"Dual-boot Bluetooth re-pair loop: sync BlueZ key into offline Windows SYSTEM hive.","keywords":"Sync BlueZ link key into offline Windows SYSTEM hive to fix dual-boot Bluetooth re-pair loop","tokens":28,"bodyTokens":895,"excerpt":"# Sync BT link key: Linux BlueZ → Windows hive (offline)\n\n## When\nDual-boot machine, one Bluetooth adapter (same BD_ADDR both OSes). Paired/re-paired on Linux; Windows now fails to reconnect WH-1000XM3-style devices. Earbud stores only one key per adapter address, so Windows registry must be updated to Linux's key. Windows→Linux direction is dead after Linux re-pair (earbud already overwritten).\n\n## Read source key (Linux)\n```\nsudo cat /var/lib/bluetooth/\u003cadapter>/\u003cdevice>/in"},{"name":"electron-app-cdp-dap-debug","description":"Electron debug: choose CLI/CDP/DAP for launch, isolation, screenshot, breakpoints.","keywords":"Electron 调试选路与操作：agent-browser CLI vs omp browser(CDP) vs 主进程 DAP；启动/隔离/截图/断点/坑","tokens":28,"bodyTokens":2343,"excerpt":"# Electron 调试：先选路，再动手\n\n适用：rosereader（~/code/rosereader）及任何 Electron 应用。核心事实：渲染进程 = Chromium，走 CDP；主进程 = Node，走 inspector/DAP。三个工具是同一批协议的三种包装，不是三套能力。\n\n## 10 秒决策\n\n| 需求 | 选 | 原因 |\n|---|---|---|\n| 主进程断点/单步/看模块作用域变量 | **DAP**（`xd://debug` + js-debug） | 只有 inspector 能进 main.js 模块作用域 |\n| 断言、循环、结构化返回值、网络拦截、多 tab/iframe、console 收集 | **omp browser** | `tab.evaluate` 返回真实对象；有 requests/route/HAR/frames |\n| 点两下看画面、探索式 UI、shell 里连续敲命令、batch | **agent-browser CLI** | 常驻 daemon + 每行一条短命令，`sn"},{"name":"fetch-adapter-vs-generic-vs-tavily-benchmark","description":"Benchmark fetch adapter vs Tavily/Jina: noise, duplication, fact coverage","keywords":"Benchmark omp fetch content paths (site adapter vs native render vs Tavily/Jina extract) on real URLs; measure size, duplication, noise, fact coverage","tokens":32,"bodyTokens":1115,"excerpt":"# Benchmark fetch content paths (adapter / generic / Tavily)\n\nUse when asked \"what does the fetch adapter actually buy us\", comparing reader backends,\nor judging whether a remote extractor (Tavily, Jina, Firecrawl) earns a slot in the chain.\n\n## Arms (mirror the product exactly)\n\n1. **adapter** — loop `specialHandlers` from `packages/coding-agent/src/web/scrapers/index.ts`\n   (75 handlers, tried first in `renderUrl` step 1 of `tools/fetch.ts`). Call\n   `handler(url, 30)`; fir"},{"name":"find-retrieval-benchmark-run","description":"Benchmark omp find vs agent grep on jegrep gold labels","keywords":"Benchmark omp find vs agent grep on jegrep gold labels; isolated homes, offline-rescoreable results","tokens":21,"bodyTokens":1405,"excerpt":"# find vs grep 检索质量实测\n\n上游 omp **没有** find 的 benchmark。金标注在 jegrep 仓库。\n\n## 资料位置\n\n- 归档结果：`~/code/find-bench`（11MB，`python3 scripts/report.py` 离线重算全部表格）\n- 金标注：jegrep `benches/{postgres,cpython,linux,kubernetes}/`，每套 10 例，commit 在 `tag.json`\n- omp 侧只有单测 `packages/coding-agent/test/tools/jfind.test.ts`，无质量基准\n\n## 步骤\n\n### 1. 取目标仓库（浅拉固定 commit）\n\n```bash\nmkdir -p /tmp/bench/pg && cd /tmp/bench/pg && git init -q\ngit remote add origin https://github.com/postgres/postgres.git\ngit fetch -"},{"name":"flutter-desktop-smooth-wheel-scroll","description":"Flutter desktop mouse-wheel smooth scrolling or glide freezes; not touch/trackpad.","keywords":"Implement Firefox/Zen-style smooth mouse-wheel scrolling in Flutter desktop and fix glide freezes","tokens":25,"bodyTokens":975,"excerpt":"# Flutter Desktop Smooth Wheel Scrolling (Firefox/Zen MSD port)\n\nWhen a Flutter desktop app's masonry/list scroll feels stuttery with a mouse wheel, or a scroll glide freezes mid-motion, apply this recipe (proven in ~/code/camelia/viewer, M1-M2).\n\n## 1. Wheel model: port the target platform's physics, don't invent\n\n- Firefox default wheel = bezier 50–200 ms (general.smoothScroll.mouseWheel.durationMin/MaxMS), duration scales with recent event cadence.\n- **Zen browser = MSD sp"},{"name":"flutter-rust-bridge-integrate-existing","description":"flutter_rust_bridge v2 existing Flutter + pre-existing Rust crate; cargokit, cdylib, StreamSink.","keywords":"Use when wiring or repairing flutter_rust_bridge v2 into an existing Flutter project with a pre-existing Rust crate; covers integrate side effects, cargokit lib naming, cdylib, StreamSink imports.","tokens":34,"bodyTokens":817,"excerpt":"# Skill: flutter-rust-bridge integrate into existing Flutter project\n\nWhen wiring `flutter_rust_bridge` (frb) v2.13+ into an EXISTING Flutter project that already has a Rust lib crate (e.g. `rust/` with its own name like `viewer_engine`), and for any future re-run of `integrate`.\n\n## Procedure\n\n1. **Deps first**: rust crate gets `flutter_rust_bridge = \"=\u003ccodegen-version>\"` + `anyhow`; Flutter gets `flutter_rust_bridge` (same version), `freezed_annotation` (regular dep) + `fre"},{"name":"gpu-tflops-comparison","description":"NVIDIA GPU precision comparison; FP16/BF16 tensor core unlock feasibility","keywords":"Comparing NVIDIA GPUs by precision, or judging whether the Geforce FP16/BF16+FP32-accum tensor nerf can be unlocked on a given card (RTX 20/30/40/50, laptop SKUs) and measuring the real ratio","tokens":23,"bodyTokens":2687,"excerpt":"# GPU 算力对比与 GeForce 张量 nerf 判定\n\n两类问题共用同一套「拿一手数据 + 实测比值」的方法：①两张卡按精度比算力；②某张卡是否吃到 GeForce 的 FP16/BF16+FP32 累加半速限制、能不能解锁、实际被砍几倍。\n\n## 1. 权威数据源（按优先级）\n\n1. **NVIDIA 架构白皮书 PDF**（每代 GeForce 架构文档附录里就有逐 SKU 全精度表，格式与实测口径最一致）：\n   - Blackwell GeForce: `https://images.nvidia.com/aem-dam/Solutions/geforce/blackwell/nvidia-rtx-blackwell-gpu-architecture.pdf`（附录只有 5090/5080/5070Ti/5070，**不含 5060**）\n   - Ampere GA102: `https://www.nvidia.com/content/PDF/nvidia-ampere-ga-102-gpu-architecture-whit"},{"name":"gtk3-wl-seat-v8-hires-scroll","description":"Karing KDE 滚轮整格跳，需 GTK3 wl_seat v5 hi-res 补丁时","keywords":"Karing/Flutter 在 KDE 下滚轮整格跳：GTK3 只绑 wl_seat v5，KWin 把 hi-res 折回整格；私有补丁 libgdk 只给 Karing，含 PATH 劫持 + 版本戳自愈 + pacman hook；备份文件严禁放 autostart 目录","tokens":37,"bodyTokens":2271,"excerpt":"# GTK3 hi-res wheel patch (Karing / Flutter on KWin)\n\nCindy 机器上有一份**本地私有、只给 Karing 用**的 `libgdk-3.so.0`。忘了这篇会导致：gtk3 升级后滚轮回退成\"整格跳\"，或私有库与系统 ABI 漂移让 Karing 崩溃。\n\n## 症状 vs 根因\n\n症状：`smooth-scroll-linux` 已输出细分 hi-res 流（每格 ~117 个事件），但 Karing（Flutter + GTK3）每格只走一次 ~80px 大跳，首帧延迟 100ms+，总位移少 ~20%。tick 怎么调都没用；kitty 等非 GTK 应用正常。\n\n1. GTK3 绑 seat 时钉死版本 5（`gdk/wayland/gdkdisplay-wayland.c`）：`display_wayland->seat_version = MIN (version, 5);` → `wl_pointer` ≤ v5。\n2. `axis_value120` 是 `wl_poin"},{"name":"h3-altsvc-site-survey","description":"Use for batch HTTP/3 alt-svc checks; bypass TUN fake-IP, UDP443 --http3 downgrade.","keywords":"批量判断网站是否支持 HTTP/3：读末跳 alt-svc 头，绕开本机 TUN fake-IP 与 UDP443 封导致 --http3 静默降级","tokens":34,"bodyTokens":909,"excerpt":"# HTTP/3 site survey via `alt-svc`\n\nUse to answer \"does site X use HTTP/3 / QUIC\" or to survey a host list. Do NOT use to measure real h3 throughput or to debug a broken h3 server (that needs an egress with UDP/443 open).\n\n## Why not `curl --http3`\nOn this machine `curl --http3` always falls back to HTTP/2 **silently** (`%{http_version}` = 2, no error), because:\n- Karing TUN fake-IP resolves hosts into `198.20.0.0/24` (QUIC handshake to a fake IP fails);\n- campus network drop"},{"name":"hanasato-viewer-frb-devloop","description":"hanasato Flutter+Rust viewer 改引擎 API 提交前验证或查已知坑时用","keywords":"hanasato Flutter+Rust viewer 改引擎 API / 提交前的固定验证流程与已知坑","tokens":36,"bodyTokens":558,"excerpt":"# hanasato viewer — frb/dev loop\n\n项目：~/code/camelia/viewer（Flutter + Rust 引擎重写 hanasato）。改引擎 API 后的固定流程：\n\n## Rust 侧改动（rust/src/api/engine.rs 或引擎模块）\n1. 写实现 + 单测；`cargo test --manifest-path rust/Cargo.toml`\n2. `cargo clippy --all-targets` — 已知噪音：`#[frb(sync)]` 在 Rust 1.92 触发 `unexpected_cfgs: frb_expand`，上游宏问题，唯一警告可忽略\n3. 需要暴露给 Dart 的函数：pub、参数/返回走 DTO 或基本类型；**高频小函数（比较器等）必须 `#[frb(sync)]`**（async 版每次 FFI 往返，52k 排序 ≈ 80 万次调用不可接受）\n4. `flutter_rust_bridge_codegen generate`（配置在 flutt"},{"name":"hermes-agent-source-navigation","description":"Use for Hermes Agent product/behavior questions; not general coding.","keywords":"Locate and read Hermes Agent subsystems (~/code/hermes-agent, VPS camelia) to answer product/behavior questions","tokens":20,"bodyTokens":830,"excerpt":"## Hermes Agent source navigation\n\nRepo: `~/code/hermes-agent` (NousResearch/hermes-agent, Python, MIT). Live install + runtime state on ssh host `camelia` under `~/.hermes`. ~1.87M non-test Python lines plus TS in `ui-tui/ web/ apps/desktop/`.\n\nRefresh the read-only mirror:\n\n```bash\nrsync -az --exclude=.git --exclude=node_modules --exclude=venv --exclude=__pycache__ \\\n  --exclude='*.egg-info' --exclude=assets --exclude=evals \\\n  camelia:.hermes/hermes-agent/ ~/code/hermes-ag"},{"name":"hermes-cron-monitor-recipe","description":"For Hermes Agent change-monitoring cron on camelia: monitor-url/script hash suppression, continuity, telegram.","keywords":"Set up Hermes Agent change-monitoring cron jobs on camelia (monitor-url/monitor-script hash suppression + continuity + telegram delivery)","tokens":30,"bodyTokens":635,"excerpt":"# Hermes cron monitor-mode recipe (camelia)\n\nRun on camelia: `export PATH=\"$HOME/.local/bin:$PATH\"` first (PATH hook is in ~/.zshrc, not loaded over non-interactive SSH).\n\n## Monitor mode = cheap always-on watcher\n\n```bash\nhermes cron create \\\n  --name \u003cjob> \\\n  --monitor-url \"https://example.com\" \\      # OR --monitor-script ~/.hermes/scripts/x.sh\n  --continuity \\                             # inject previous output for dedupe/continuation\n  --deliver telegram \\             "},{"name":"hermes-custom-provider-vision-model","description":"Hermes custom provider, default model swap, or supports_vision image input","keywords":"camelia 上给 Hermes Agent 加自定义 provider / 换默认模型 / 让某模型能读图(supports_vision、reasoning_effort 400 陷阱、Cloudflare 1010 UA 阻断、hermes chat -q --image 验收)","tokens":24,"bodyTokens":2621,"excerpt":"# Hermes Agent:自定义 provider + 视觉模型接入(camelia)\n\n用于「把某个网关/模型接进 hermes」「让 hermes 能读图」「换 hermes 默认模型」。源码导航看 `skill://hermes-agent-source-navigation`,本 skill 只讲配置面与验收。运行态一律 `ssh -o BatchMode=yes camelia-cc`(走 Karing;每条命令带重试循环)。\n\n**PATH 坑**:非交互 ssh 里 `hermes` 不在 PATH,必须 `export PATH=\"$HOME/.hermes/hermes-agent/venv/bin:$HOME/.local/bin:$PATH\"`(或写全 `~/.local/bin/hermes`)。\n\n## 配置面(~/.hermes/config.yaml,gateway 启动时读取 → 改完必须 restart)\n\n命名自定义 provider(`providers.\u003cname>`,由 `hermes_cli/con"},{"name":"innodb-lock-concurrency-experiment","description":"Use for dual-session InnoDB lock, MVCC, gap-lock experiments; not for production fixes.","keywords":"用双会话实机验证 InnoDB 锁/MVCC/间隙锁行为时的可复用脚本骨架与踩坑清单（本机已装环境）","tokens":30,"bodyTokens":1797,"excerpt":"# 双会话实机验证 InnoDB 锁 / MVCC / 间隙锁\n\n## 0. 起环境\n\n```bash\ndocker rm -f pgtest-mysql >/dev/null 2>&1\ndocker run -d --name pgtest-mysql -e MYSQL_ROOT_PASSWORD=root -p 13306:3306 mysql:8.0\nfor i in $(seq 1 40); do docker exec pgtest-mysql mysqladmin ping -uroot -proot --silent >/dev/null 2>&1 && break; sleep 3; done\ndocker rm -f pgtest-mysql   # 收尾必删\n```\n\n**本机环境事实**：\n- 无 `mysql` / `redis` 二进制，也无 `mysqld` 服务 → **一律走 Docker**。本地有镜像 `mysql:8.0`（8.0.45）与 `redis:6.0-alpine`。\n- **没有 `pip`，且"},{"name":"intel-im-email-bot","description":"Use Free Cloud intel.im email bot register/subscribe/buy via Gmail relay; domain split/already-registered.","keywords":"Drive Free Cloud / intel.im email bot (register, subscribe, buy plan) via Gmail relay; domain split and already-registered path.","tokens":30,"bodyTokens":847,"excerpt":"# Free Cloud / intel.im 邮件机器人\n\n用邮件主题驱动，不是网页表单。Gmail 走 omp browser relay（`app.relay: true`），不要克隆 Chrome profile。\n\n## 收件人\n\n| 地址 | 用途 |\n|---|---|\n| `admin@mail.3218431.xyz` | 主通道：注册、买套餐、订阅、列套餐、查账户 |\n| `admin@mail.intel.im` | 同上，备用、限速（约每天 100 封） |\n| `admin@smtp.intel.im` | **只**查官网。验证码信也会从这里发出，**不要回这封信做注册** |\n\n## 注册（新邮箱）\n\n1. 空邮件，主题 `获取验证码`，发给主通道。\n2. 验证码邮件标题像「Free Cloud邮箱验证码」，发件人常是 `admin@smtp.intel.im`。码约 30 分钟有效。\n3. **新开一封**给 `admin@mail.3218431.xyz`（主题可仍是 `获取验证码` 或改 `注册账号`），正文首"},{"name":"interview-diaonan-qa-authoring","description":"Only for 刁难/压力面 interview repo QA; normal QA goes elsewhere","keywords":"为 interview 仓库面试手册项目（NFTurbo/DI Agent/RAG）补刁难/压力面 QA 文档时用；非刁难 QA 勿用","tokens":26,"bodyTokens":535,"excerpt":"## 触发\n用户要求为某个面试项目（NFTurbo、DI Agent、工程 RAG）做\"刁难QA\"\"压力面\"\"tricky Q&A\"。\n\n## 步骤\n1. **先读口径源**：`/home/cindy/code/docs-working/interview/面试阐述-深挖-QA-实习与双项目.md` 对应项目章节（NFTurbo=第二部分 283-552 行），所有技术结论、状态机命名、防线划分必须与其一致，不得冲突。\n2. **五类分桶**（标杆：NFTurbo-刁难QA.md）：真实性质疑（开源撞车/无真实流量/QPS 数字）→ 选型逼问（为什么不用更简单方案）→ 极端场景（组件宕机/并发竞争/乱序窗口）→ 规模化推演（10 倍流量/分库分表/积压）→ 代码级细节验证（默认参数、配置项、数据结构选择）。\n3. **每题答法**：结论先行一句话 + 机制/数字展开，口语化可背；统一框架=**承认窗口存在 → 指出兜住它的那层机制 → 残余风险交对账/补偿压驻留时间**；硬撑\"不可能出问题\"是最差答法。大题末尾用 `> 一句话总结：` 收。\n4."},{"name":"java-context-propagation-verify","description":"Verify Java cross-thread context propagation claims (ThreadLocal/InheritableThreadLocal/TTL/ScopedValue) with demos before docs/八股.","keywords":"Empirically verify Java cross-thread context propagation claims (ThreadLocal / InheritableThreadLocal / TTL / ScopedValue) with runnable demos before writing them into docs or answering 八股/interview questions","tokens":38,"bodyTokens":1121,"excerpt":"# Java 跨线程上下文透传：实测验证配方\n\n用途：写八股/面经文档或回答面试题时，把「ThreadLocal 不能跨线程 / InheritableThreadLocal 在线程池失效 / TTL 的 CRR / ScopedValue 能不能替代」这类断言用**可运行代码 + 原样输出**坐实，而不是复述博客说法。\n\n## 环境\n\n- JDK：`java -version`（本机 JDK 26；无 `src.zip`，源码要联网取）\n- TTL 依赖已在本地 Maven 仓：`~/.m2/repository/com/alibaba/transmittable-thread-local/2.14.4/`（含 `-sources.jar`，可直接解压读实现）。缺失时 `curl https://repo1.maven.org/maven2/com/alibaba/transmittable-thread-local/\u003cver>/transmittable-thread-local-\u003cver>.jar`\n- 工作目录建议 `/tmp/ctxde"},{"name":"jio-google-ai-pro-eligibility-check","description":"Use for Jio AI Pro eligibility; loadCodeAssist probing is dead since 2026-06","keywords":"Check whether a Google account can use Jio-provisioned Google AI Pro or whether Pro works in Antigravity; includes the 2026-06 consumer-OAuth shutdown that killed loadCodeAssist tier probing.","tokens":32,"bodyTokens":898,"excerpt":"# Check Jio Google AI Pro / Antigravity Eligibility\n\nUse when asked whether a Google account can use Jio-provisioned Google AI Pro (\"jio 号\"), or whether its Pro entitlement works in Antigravity/Gemini CLI.\n\n## Key fact: API probing is dead (since 2026-06-18)\nGoogle shut down consumer-tier (individual / AI Pro / Ultra) Gemini CLI OAuth. `POST https://cloudcode-pa.googleapis.com/v1internal:loadCodeAssist` returns the **same shape for every consumer account regardless of Pro sta"},{"name":"karing-atrust-tun-route-coexistence","description":"Karing TUN steals aTrust routes after route_exclude_address splits table2022; isolated netns coexistence.","keywords":"Diagnose Linux Karing TUN stealing aTrust/other-VPN routes after route_exclude_address splits table2022; verify no-restart scoped coexistence fixes in an isolated network namespace.","tokens":37,"bodyTokens":989,"excerpt":"# Karing 与其他 VPN 的 Linux 策略路由冲突\n\n适用于：另一 VPN（如 aTrust）在线，关 Karing TUN 就恢复，但用户要求 TUN 持续开启。\n\n## 只读定位\n\n1. `ssh -G HOST` 得到实际 IP/端口；别把 SSH alias 当 DNS 名。避免读取私钥，连接探测应 `ClearAllForwardings=yes`、BatchMode、ConnectTimeout，并用远端无副作用命令。\n2. `ip -br addr`、`ip rule`、`ip route show table 2022`、`ip route get IP`，对比 main 表中目的地址的最长前缀。Karing 常为 tun0=10.20.0.1/30、table2022；aTrust 常为 utun7，但必须现场核实。\n3. 只输出 Karing 配置的相关字段，避免泄露节点密码、订阅URL、控制API secret：用户 `karing_setting.json` 的 tun、生成 `service_core.jso"},{"name":"karing-bin-arch-upgrade","description":"Upgrade hand-built karing-bin on CachyOS: setuid, deb→pkg, safe restart","keywords":"Upgrade cindy's hand-built karing-bin on CachyOS: 6755 setuid service, deb→pkg build, safe restart order, verification checklist","tokens":30,"bodyTokens":1713,"excerpt":"# karing-bin 升级（Arch/CachyOS，手工 makepkg）\n\n## 何时用\n把 cindy 机器的 karing-bin 升到上游新 pre-release / stable。\n\n## 事实基线\n- 包是手工构建（`pacman -Qi karing-bin` → `Installed From: 无`），配置在 `~/.local/share/com.nebula.karing/`，二进制 `/usr/bin/karing` → `/opt/karing/karing`。\n- **setuid 是硬约束**：`/opt/karing/karingService` 必须 `6755 root:root`（`-rwsr-sr-x`）。上游 deb 只给 0755，漏掉它 = GUI 活着但核心不启动、3057/3066/7898 不监听、无 tun0。\n- 构建配方存 `~/dotfiles/scripts/karing-build/PKGBUILD`（改 pkgver + sha256sums 即可复用）。\n\n## 步骤\n1"},{"name":"karing-config-linux-to-windows-sync","description":"Sync Karing config Linux to Windows","keywords":"把 cindy 双系统 Linux 端 Karing 配置同步到 Windows 分区（文件级、按 remark 并集、跳过 DPAPI/核心态文件、备份与回滚）","tokens":18,"bodyTokens":995,"excerpt":"# Karing 配置 Linux→Windows 同步（本机双系统）\n\n目标：不同 GUI 导出，直接把 Linux Karing 的分流规则/订阅/设置落到 Windows 端 Karing 数据目录。用户要求「不阅读配置」时：只比对键集合与条目数，**绝不打印配置值**（节点凭据、订阅 URL）。\n\n## 1. 定位两侧目录\n```bash\nls -d ~/.local/share/*aring* ~/.config/*aring*          # Linux: ~/.local/share/com.nebula.karing\nfindmnt -rno TARGET,SOURCE,FSTYPE,OPTIONS | grep -i ntfs  # /run/media/cindy/Windows-SSD ntfs3 rw,uid=0,gid=0\nls /run/media/cindy/Windows-SSD/Users/\u003cuser>/AppData/Roaming/karing  # 内含嵌套 karing/ 子目录\n```\nWindo"},{"name":"karing-diversion-attribution","description":"Use when Karing diversion rule/outbound for domain/app on this machine is unclear.","keywords":"Attribute which Karing diversion rule/outbound a domain or app actually hits on this machine","tokens":25,"bodyTokens":1114,"excerpt":"# Karing 分流归因：某域名/应用到底走直连还是代理\n\n适用于本机（~/.local/share/com.nebula.karing，TUN=gvisor，fake-ip 池 198.20.0.0/24）。回答「小红书/任意服务为什么断联、是不是走了代理」类问题。\n\n## 关键事实（2026-09 实测）\n\n- 配置源：`karing_routing_group.json`（自定义分流组定义）→ 生成 `service_core.json`（sing-box 配置，`karing_setting.json` 有 tun/dns 全局设置）。`route.rules` 是终判顺序，`route.final` 是当前代理节点出站。\n- **陷阱**：DNS 规则链末尾是无条件 `query_type A/AAAA → dns_fakeip_out` 兜底。凡是不匹配任何直连 DNS 规则（geosite:cn 等）也不匹配显式 fake-ip 组的域名，**照样拿到 fake-ip（198.20.x.x）**，连接时按域名匹配 route.ru"},{"name":"karing-per-domain-dns","description":"Use when: Karing/sing-box per-domain DNS; campus DNS; docker 172.19 route conflict.","keywords":"Karing/sing-box 按域名指定上游 DNS、规则自动补回、校园 DNS 与 docker 172.19 路由冲突","tokens":31,"bodyTokens":1426,"excerpt":"## 适用\n\n让 Karing（sing-box 1.12 结构：`dns.servers[].tag` + `dns.rules[].server`）对**指定域名**走**指定上游 DNS**，并让规则在 Karing GUI 重新生成配置后自动补回。\n\n## 配置事实（本机）\n\n- 生成物 `~/.local/share/com.nebula.karing/service_core.json`：`dns.servers` 是 `{tag,type,server,server_port,...}` 数组；`dns.rules` 里每条规则**自带** `rewrite_ttl`（直连 43200 / fake-ip 1）、`disable_cache`、`client_subnet` → 单域名可独立设 TTL，无需动全局 `karing_setting.json → dns.ttl`。\n- 顺序：`dns.rules` 从上到下第一条命中即生效，末尾是 catch-all `\"name\": \"dns_fakeip_out[dns]\"`（`q"},{"name":"karing-route-change-without-gui","description":"Use when Karing routing-rule change without GUI, domain_regex, A/B per-inbound ports.","keywords":"Apply/verify a Karing routing-rule change (custom group, esp. domain_regex) without the GUI, then A/B verify via Karing's per-inbound ports.","tokens":30,"bodyTokens":1710,"excerpt":"适用于本机 Linux Karing（TUN=gvisor，fake-ip 池 198.20.0.0/24）。用于「给某域名/域名族加直连或代理规则」并当场验证。\n\n## 文件与端口（现场核实，勿写死）\n\n- 源真值：`~/.local/share/com.nebula.karing/karing_routing_group.json` — 自定义分流组；组内字段即 sing-box 匹配器：`domain` / `domain_suffix` / `domain_keyword` / `domain_regex` / `ip_cidr` / `process_name*` / `rule_set`(远程 source JSON) / `rule_set_build_in`。\n- 生成物：`service_core.json` — sing-box 配置。`route.rules` 终判顺序，`route.final` 兜底出站；`dns.rules` 与之成对（自定义组会同时生成 `dns_direct_out[\u003c组名>][dns]` / `d"},{"name":"karing-to-v2rayn-custom-migration","description":"Use when converting Karing service_core.json to v2rayN Custom profile.","keywords":"Migrate Karing service_core.json to upstream sing-box as a v2rayN Custom profile: batch-DNS collapse, download_detour, guiNDB dual-table registration + Xvfb silent GUI verify, EnableTun/sudo trap, netns sinkhole parity proof","tokens":28,"bodyTokens":2138,"excerpt":"# Karing → v2rayN Custom 全量迁移（上游 sing-box）\n\n## 何时用\n把 Karing（sing-box 分叉）的 `~/.local/share/com.nebula.karing/service_core.json` 全量迁移成上游 sing-box 配置、注册为 v2rayN（/opt/v2rayn-bin）的 Custom 条目。要求**行为等价**，不是\"能启动\"。自定义分流组源真值在 `karing_routing_group.json`。\n\n## 铁律\n**`sing-box check` 通过 ≠ 能跑。** check 不校验 .srs 内容与 remote rule-set；batch DNS 塌缩的循环依赖、`detour`/`download_detour` 差异只在 `run` 期爆。必须 `sudo sing-box run` ≥10s 看 FATAL。\n\n## 转换\n转换器（已固化，复用勿重写）：`~/code/general-action/karing-migration/conve"},{"name":"karing-tun-dns-ttl-disconnect-fix","description":"CN apps disconnect Karing TUN: per-suffix DoT, not global TTL rewrite","keywords":"Fix CN app disconnects under Karing TUN by neutralizing global TTL rewrite with per-suffix DoT routes","tokens":33,"bodyTokens":2189,"excerpt":"## 症状与根因\n\n「某 CN 应用在 Karing TUN 下特别容易断联，但关掉 TUN 就好」——先别怀疑分流规则。\n\n根因模式（本机实测）：Karing 的 `rewrite_ttl`（`karing_setting.json` → `dns.ttl`，默认 **43200=12h**）会把它劫持代答的**所有** DNS 应答 TTL 改写成 12 小时；而小红书系域名上游真实 TTL 只有 **5~600 秒**，其边缘/CDN 节点按分钟级摘挂。TUN 开着时本机拿着已下线的 IP 不放最长 12h → 图片/视频/API 连到死节点 → 用户感知「网络断联」，时好时坏；TUN 关时 5~60s 自动翻篇。\n\n**实测结论：小红书流量没有走代理**，全 `direct_out`。所以\"命中代理规则\"是假线索，别顺着它查。\n\n## 用户约束（重要）\n\ncindy 拒绝改 Karing 的 `dns.ttl`：它是**全局旋钮**，改它会动所有域名的缓存。可行方案必须**按域名作用域**、零全局副作用。同理别建议\"Karing 加直连规"},{"name":"karing-upgrade-preserve-hires-scroll","description":"karing-bin upgrade/reinstall: preserve GTK3 hi-res scrolling; PATH hijack, inode/binding; not fresh installs.","keywords":"karing-bin 升级/重装后如何保住 Karing 的 GTK3 hi-res 平滑滚动：包会重写桌面项与自启动项；备份文件放 autostart 目录会被 systemd 当自启动执行（已知回归），靠 PATH 劫持 + inode/绑定校验确认","tokens":37,"bodyTokens":1578,"excerpt":"# Karing 升级后保住 hi-res 平滑滚动\n\n配套 skill：`gtk3-wl-seat-v8-hires-scroll`（补丁本体、rebuild、pacman hook 在那篇）。本篇只管**升级 Karing 本身**（AUR `karing-bin`、本地 PKGBUILD、`pacman -S` 重装）会发生什么、怎么验证、怎么救。\n\n## 升级会动什么\n\n| 升级动作 | 影响 | 是否需要人工介入 |\n|---|---|---|\n| 替换 `/opt/karing/karing`、`/usr/bin/karing` | wrapper 仍 `exec /usr/bin/karing`，自动跟随新版本 | 否 |\n| 覆盖 `/usr/share/applications/karing.desktop`（包内 `Exec=karing %U`） | 系统中该项本来就被 `~/.local/share/applications/` 的同名项覆盖 | 否 |\n| **Karing 自己重写** `~/.local/share/"},{"name":"karing-zen-ech-http3-sni-miss","description":"Zen/Firefox proxying Karing direct site Chrome reaches; not when Chrome also fails.","keywords":"Diagnose Zen/Firefox still hitting the proxy (old IP, empty TUN host) for a Karing direct site that Chrome already reaches","tokens":32,"bodyTokens":876,"excerpt":"# Zen/Firefox 直连站点仍被拦：ECH + HTTP/3 藏 SNI\n\n适用于：Karing TUN 已给某站配直连（`domain` / `domain_keyword`），Chrome 正常，Zen 仍显示旧出口 IP /「访问已被拦截」，TUN 连接列表找不到该域名。\n\n不要先改分流组、不要加 CF anycast CIDR、不要动全局 `dns.ttl`。\n\n## 根因（本机 2026-09-19 对 hybgzs.com 实测）\n\nKaring 域名规则靠 sniff SNI / host。Zen（Firefox）默认 ECH + HTTP/3：\n\n- HTTPS RR 带 `alpn=h3` 和 ECH（真实 TTL ≈ 300s；Karing `rewrite_ttl=43200` 只放大缓存，不是主因）\n- QUIC UDP/443 进 TUN 后 **host 为空**、`destinationIP` 可能也空\n- 域名规则匹配失败 → `route.final`（当前代理节点）\n- CF 看到美国出口 IP → 4"},{"name":"karousel-window-rules-kwinrc","description":"Edit kwinrc windowRules/tiledDesktops/tiledOutput, reload KWin, diagnose Meta+Space no-op","keywords":"karousel fork live ops: kwinrc Script-karousel windowRules/tiledDesktops/tiledOutput editing with KConfig escaping, in-session reload, KWin window-state probing, Meta+Space no-op diagnosis","tokens":36,"bodyTokens":1571,"excerpt":"Live config for karousel lives in `~/.config/kwinrc` group `[Script-karousel]`; it overrides `defaultWindowRules` in `src/lib/config/definition.ts`.\n\n## Read / write the value\nKConfig stores values on ONE line, newline as `\\n`, backslash as `\\\\`. Raw multi-line text (hand edit, heredoc, python `re.sub` replacement — the replacement string eats `\\n`/`\\\\`) reads back as just its first line, so `JSON.parse` throws and karousel loses every rule (full-screen-geometry apps then flo"},{"name":"kde-kwin-scripting-move-window","description":"KDE Wayland KWin moving window secondary screen; frameGeometry clamp pitfalls","keywords":"KDE Wayland KWin scripting 移窗口到副屏；frameGeometry clamp 坑","tokens":26,"bodyTokens":817,"excerpt":"# KWin 6.x Wayland — 把窗口移到副屏（不抢主屏焦点）\n\n需求：KDE Plasma Wayland（kwin_wayland 6.x）上把某个窗口移到指定输出（如笔记本屏 eDP-1），不干扰主屏活动、不动其他窗口。\n\n## 可用机制：KWin scripting DBus\n\n```bash\n# 1. 写脚本（唯一文件名，journal 去重会吃相同内容的重复输出）\ncat > /tmp/move-$RANDOM.js \u003c\u003c'EOF'\nfor (const win of workspace.windowList()) {\n  if (String(win.resourceClass) === \"\u003capp-class>\") {\n    let target = null;\n    for (const s of workspace.screens) { if (s.name === \"eDP-1\") target = s; }\n    if (target) {\n      workspace.sendClientToScree"},{"name":"kitty-custom-kitten-install-verify","description":"Install, repair, or verify custom kitty .py kittens","keywords":"Install or repair a custom kitty .py kitten on cindy's machine (kitty 0.49.2, Python 3.14): kitten-action wiring, stdin/result contract, no_ui in-process pattern, persisting runtime state to kitty.conf, and hidden-instance verification","tokens":21,"bodyTokens":2347,"excerpt":"# Install/repair a custom kitty kitten (kitty 0.49.2, Python 3.14)\n\nProven 2026-09-13 installing Mobinshahidi/kitty-search (needed 3 upstream fixes); 2026-10-26 opacity-toggle no_ui kitten; 2026-10-27 persisting opacity-step kitten.\n\n## Wiring rules (check FIRST — most repos get this wrong)\n- Use the **`kitten` mapping action**: `map ctrl+shift+f kitten \u003cname>.py` (resolves against config dir, absolute path also OK). Only this path pipes stdin and calls `handle_result` (boss "},{"name":"kitty-session-snapshot-restore","description":"Use kitty save_as_session to reopen tabs after restart; listen_on required, -d ignored.","keywords":"Make kitty reopen last tabs like a browser: save_as_session action + PATH wrapper; kitty 0.49 traps (listen_on required, startup_session ignores -d)","tokens":27,"bodyTokens":1142,"excerpt":"# kitty 会话快照 / 浏览器式恢复（kitty 0.49.2, cindy）\n\n实现：`~/.config/kitty/kitty-saver.sh`（每实例快照循环）+ `~/.local/bin/kitty`（裸启动恢复）\n+ `shell/zsh` 里拉起 + kitty.conf 的 `listen_on` / `allow_remote_control socket-only`。\n\n## 原语（0.49 已没有 `kitten save_session`）\n- 保存是 **action**：`kitten @ --to \u003csock> action save_as_session --save-only \u003cpath>`（`@ac('session')`，RC 可调用；`--save-only` 避免它再开编辑器）。约 30 ms/次。\n- 恢复：`kitty --session \u003cfile>`（或 kitty.conf `startup_session`）。文件是纯文本：`new_tab/布局/enabled_layouts/se"},{"name":"kitty-silent-headless-testing","description":"Use for silent kitty tests: hidden text/cwd/env, Xvfb pixels, wrapper checks.","keywords":"Run kitty tests silently on cindy's machine (no popups, no focus steal): hidden-instance for text/cwd/env, isolated Xvfb for pixels, shell-wrapper/launcher verification without real launches","tokens":28,"bodyTokens":2447,"excerpt":"# Silent kitty testing (no focus steal, no popups)\n\nTest TUI programs / terminal emulation / kitty graphics / kitty config\nWITHOUT popping windows on the user's live KDE Wayland session (cindy, kitty\n0.49.2 as of 2026-10; facts first verified 2026-09-05 on 0.48.2 Xvfb/hidden\ninstances — re-verify tier assumptions if kitty major-bumps again).\n\n## Tier choice\n1. **Text-level (stream→screen-buffer semantics)** — `--start-as=hidden` kitty on\n   the REAL display: zero windows ever"},{"name":"kitty-tabbar-styling-verify","description":"Use: kitty tab bar dark-theme override, OMP spinner, progress_bar edge-bar, A/B testing.","keywords":"Style/debug kitty (0.49 on this machine, facts from 0.48) tab bar: dark-theme.auto.conf override trap, animated OMP title spinner (pie-ring frames), progress_bar edge-bar trap, A/B instance testing","tokens":32,"bodyTokens":1440,"excerpt":"## ⚠️ 陷阱一：dark-theme.auto.conf 覆盖一切（2026-08-25 实锤）\n- 配置目录存在 `dark-theme.auto.conf`（或 light 版）时，kitty 每次启动和每次重载（watcher 热重载、ctrl+shift+f5）都把它的颜色叠在 kitty.conf 之上。系统深色模式 → dark 版生效。\n- 症状：改 kitty.conf 颜色\"完全没效果\"；重载/新窗口全部无效；但无头 parse 显示值正确。\n- 正确修法：直接改主题文件里的颜色段（保留 16 色板等其余内容）。**把颜色行删空会让 kitty 主题重置成全默认**（连 powerline/tab 模板都丢，实测）。\n- cindy 最终态（2026-08-26）：dark-theme.auto.conf Tab 段 = active_fg `#a78bfa` / **active_bg `#251b30`（暗紫底，紫字才看得清；`#7e70e6` 亮紫底配紫字对比度不行，用户明确否决）** / inactive_fg `#"},{"name":"knowledge-lake-ops","description":"B站UP/合集同步、旧稿导入、领取任务、文稿版本/状态查询时用。","keywords":"~/code/knowledge-lake 原始知识湖：同步B站UP/合集、导入旧稿、领取任务、文稿版本与状态查询","tokens":31,"bodyTokens":2345,"excerpt":"# knowledge-lake 运维\n\n项目 `~/code/knowledge-lake`：原始知识湖（视频 → 文稿原料）。SQLite 是索引，`data/` 下 Markdown 是真产物（带 front matter），删库可由 `import-docs` + `sync` 重建。\n\n## 命令\n\n```bash\ncd ~/code/knowledge-lake\npython -m lake.cli up add \u003cmid|空间URL> --prefix interview [--prio N] [--name X]\npython -m lake.cli up list [--enabled|--json]                   # 名单 + videos/draft/pending\npython -m lake.cli up set \u003cmid> [--prefix P] [--prio N] [--disable|--enable]\npython -m lake.cli up rm \u003cmid>             "},{"name":"kwin-global-shortcuts-dead-repair","description":"KWin6 global shortcuts dead, typing normal, config intact: setShortcutKeys(SetPresent); not blockGlobalShortcuts(false).","keywords":"KDE KWin 6 全局快捷键全部失灵（按 Meta+D 等无反应、打字正常）但配置/注册完好时，用 setShortcutKeys(SetPresent) 重注册修复；blockGlobalShortcuts(false) 无效","tokens":37,"bodyTokens":1325,"excerpt":"# KWin 全局快捷键整体失灵 → 用 SetPresent 重注册修复\n\n症状（2026-11-01 实测）：`Meta+D`、`Meta+Shift+Down`、脚本注册的 `Meta+Alt+O` 全部无反应；\n但打字正常、`kglobalshortcutsrc` 完好、`Component.allShortcutInfos()` 能列出动作、\n`invokeShortcut` 能触发动作（桌面照样切）。`dbus-monitor` 抓 `org.kde.kglobalaccel.Component`\n的 `globalShortcutPressed` 一条都没有。\n\n## 判定顺序（先数据后按键）\n\n1. 配置层：`kreadconfig6 --file kglobalshortcutsrc --group kwin --key \"Switch to Next Desktop\"`\n2. 注册层：`gdbus call --session --dest org.kde.kglobalaccel --object-path /kglobal"},{"name":"kwin-pin-window-above-fullscreen","description":"KWin 6 multiple windows above focused fullscreen; use constrain, not plain keepAbove.","keywords":"KWin 6 脚本：任意多个窗口压过「获得焦点的全屏窗口」保持置顶（keepAbove 不够，用 workspace.constrain；按输出静态约束，避免多屏焦点切换失效；D-Bus 只能靠 Scripting.start 触发执行）","tokens":28,"bodyTokens":3572,"excerpt":"# KWin 6：窗口压过全屏保持置顶（快捷键切换，可多窗口）\n\n需求：快捷键把当前窗口钉在最上层，即使有全屏窗口（视频/游戏）**并且它拿着焦点**也压不下去；\n可以同时钉多个窗口，多显示器下焦点切到另一块屏也不能失效。\n\n## 为什么 keepAbove 不够\n\n`Window::belongsToLayer()`（kwin 6.8 `src/window.cpp:536`）：`isActiveFullScreen()` →\n`ActiveLayer`(=5)，而 `keepAbove` → `AboveLayer`(=3)。层号越大越上：\nDesktop 0, Below 1, Normal 2, Above 3, Notification 4, Active 5, Popup 6,\nCriticalNotification 7, OSD 8, Overlay 9。\n`isActiveFullScreen()` = 全屏 且 (自己是活动窗口 || 活动窗口不在本输出 || 是本应用主窗口)。\n所以全屏窗口一旦拿焦点就压住 keepAbov"},{"name":"kwin-pointer-warp-cross-screen","description":"KWin 6 pointer warp across screens; per-screen focus; DBus shortcut rebind.","keywords":"KWin 6 键盘把指针跳到另一块屏幕：fake_input 绝对 warp、每屏独立桌面的焦点过滤、快捷键 DBus 改绑、持久化核查","tokens":28,"bodyTokens":3537,"excerpt":"# KWin 6 Wayland — 键盘跨屏指针 warp\n\n需求：不用鼠标，按键把指针跳到另一块屏幕（并让焦点跟过去）。2026-11 在 Plasma/KWin 6.8.2、双屏 HDMI-A-1(0,0 2048x1152 @1.25) + eDP-1(2048,0 1707x1067 @1.5)、**每屏独立虚拟桌面**上落地并验证。\n\n## 结论：唯一可行的绝对定位是 org_kde_kwin_fake_input\n\n| 路径 | 结果 |\n|---|---|\n| KWin 脚本 `workspace.moveCursor` | **6.8 已无此 API**（`undefined`）。脚本只能读 `workspace.cursorPos` |\n| ydotool `mousemove -a` | **不可用**：ydotoold 设备 `EV=7`（SYN/KEY/REL），无 `EV_ABS`，绝对事件被丢 |\n| `wp_pointer_warp_v1` | 要求目标 surface 已有 pointer focus + ent"},{"name":"lab-4090-gyz-4d-data-location","description":"Use for locating GYZ 4D cardiac data on lab-4090, not others.","keywords":"Locate GYZ/4D cardiac data on lab-4090 and distinguish it from other patients' 4D datasets","tokens":32,"bodyTokens":472,"excerpt":"# Lab 4090 data lookup\n\n## Host\n`ssh lab-4090` → Jinxianghe-4090, user wang_liang, HostName 10.201.247.20 port 4090, key ~/.ssh/cinderella/id_rsa.\nRemoteForward 1080 always warns \"remote port forwarding failed for listen port 1080\" — harmless, ignore.\n\n## Layout\n- System disk: /home (44 user dirs, no GYZ user; `ygy`/`ygymaster1` exist but hold LLM stuff only)\n- Data disks: /media/{D,E,F,G,H}, each 3.7–15T, 90–100% full\n- WL's MMWHS2025 tree: /media/D/wl/MMWHS2025 (GYZ 4DCCTA "},{"name":"linux-swap-thrash-render-jank","description":"Desktop/browser jank, zram swap thrash, DRM page-flip gaps: check memory pressure first.","keywords":"Linux 桌面/浏览器偶发卡顿（双屏、网页+视频都偶发）先查内存压力与 zram 换页；含 drm 翻页「密集流空洞」度量、逐线程缺页对齐、per-app 定向保护（MemoryLow vs 全局 swappiness）、以及泄漏 vs 工作集的 cgroup 曲线判别","tokens":32,"bodyTokens":3808,"excerpt":"# 桌面/浏览器「偶发卡顿」先查内存压力，再谈显卡\n\n适用：Linux（尤其 zram 交换 + 大内存浏览器）出现「网页和视频都偶发顿一下、多屏都有、某个浏览器特别惨」。先用 3 条命令把内存压力定性，再决定要不要往 GPU/合成器方向查。\n\n## 0. 不要先信「渲染问题」\n\n「两个屏幕都有 + 网页也偶发 + 某个浏览器正常」不一定指向合成器/驱动：合成器级掉帧对**所有**客户端同样成立。差异通常来自**谁的内存多**——内存压力下谁被换出/换入最狠，谁的渲染线程就先停。\n\n## 1. 谁占了 zram（一条命令定性）\n\n```bash\npython3 - \u003c\u003c'EOF'\nimport glob,re,collections\ngrp=lambda c:('ZEN' if re.match(r'zen-bin|Isolated Web Co|WebExtensions|Web Content',c) else 'CHROME' if 'chrome' in c.lower() else 'OTHER')\ns=collections.Coun"},{"name":"linux-usbc-dp-altmode-failure-diagnosis","description":"USB-C→DP no video Linux; Billboard, typec/DRM sysfs, VDO; not just monitor settings.","keywords":"Diagnose a USB-C → DP adapter/dock giving no video on Linux: USB Billboard descriptor forensics, typec/DRM sysfs evidence, VDO decoding, cable-stability and OS-vs-hardware split","tokens":40,"bodyTokens":1367,"excerpt":"# USB-C → DP adapter with no video on Linux\n\n## Trigger\nPlugging a USB-C→DP adapter/cable/dock into a USB-C port produces nothing: no DRM connector change, external monitor stays dark, but USB data may work fine.\n\n## Key insight\nIf a peripheral supports an alt mode and negotiation **fails**, the peripheral re-enumerates as a **USB Billboard device** (interface class `0x11`) and reports the failure itself in its BOS descriptor. That descriptor is ground truth from the device —"},{"name":"local-2api-relays-ops","description":"Use for cindy's local 2api relays: workbuddy2api :7863, buddy-proxy :32126, qoder2api-hub :8790.","keywords":"Operate cindy's three local 2api relays (workbuddy2api :7863, buddy-proxy :32126, qoder2api-hub :8790)","tokens":47,"bodyTokens":8393,"excerpt":"# 本机三个 2api relay 的运维要点\n\n## workbuddy2api(国内版 CodeBuddy → OpenAI)\n\n- 仓库 `~/code/workbuddy2api`(fork of Sliverkiss,Go),Docker 部署,`docker compose up -d`\n- 端点 `http://localhost:7863`,管理密匙在 `config.json` 的 `api_key`\n- 容器内 uid=10001,**挂载的 `data/`(state.json)和 `auths/`(凭证)两个目录都必须 chown 10001:10001**。2026-10-24 事故:只 chown 过 data/、auths/ 仍是 cindy:1000 → 每晚 22:00 keepalive 刷新 token 后写 `auths/workbuddy-*.json.tmp` 一律 permission denied,凭证自 9-10 后从未持久化,容器每次重启都回滚到旧 token\n- 429 软冷却 60s 自动恢"},{"name":"managed-skills-usage-audit","description":"Measure per-skill usage, cluster duplicates, prune or merge managed-skills directory","keywords":"Audit or prune ~/.omp/agent/managed-skills: measure real per-skill usage from the full sessions corpus (skill:// reads + managed-skills/ path hits), bucket by age vs mtime, detect same-day and cross-day near-duplicate clusters, merge into latest keeper, backup before delete","tokens":26,"bodyTokens":938,"excerpt":"# managed-skills 库审计与修剪\n\n## 何时用\n用户要 review ~/.omp/agent/managed-skills 里哪些 skill 可删/可合并，或库膨胀（>200）需要修剪。库全是 managed skill；**绝不碰** ~/.omp/agent/skills 用户自建技能。\n\n## 使用率测量（真实使用 ≠ 名字出现在 skill 列表）\n扫 `~/.omp/agent/sessions/**/*.jsonl`（全 corpus，别抽样）两种引用形态：\n- `skill://\u003cname>` 读取\n- `managed-skills/\u003cname>` 路径访问（read/write 都算）\n\n每 skill 统计：总命中数、distinct 会话日期数、最后使用日。与目录 mtime（=创建日）对照分桶：\n- **never-referenced**：0 命中\n- **creation-day-only**：只在创建当天被用过\n- **reused**：创建日之后还有命中（真活）\n\n排除干扰：名字出现在系统提示 "},{"name":"mcp-stdio-manual-probe","description":"Probe stdio MCP tools manually via uvx JSON-RPC, not when harness-mounted.","keywords":"Drive a stdio MCP server (e.g. disabled grok-search) manually via uvx + JSON-RPC to probe tools without mounting it in a harness","tokens":28,"bodyTokens":566,"excerpt":"## When\n\nNeed to test/call tools of a stdio MCP server that is disabled, unmounted, or you want to probe outside the harness (e.g. grok-search CamelliaV/GrokSearch fork). Proven pattern; avoid the two reader traps.\n\n## Recipe (Python, one script)\n\n1. **Env**: read API keys from omp's store — `sqlite3 ~/.omp/agent/agent.db \"SELECT data FROM auth_credentials WHERE provider=...\"` → JSON `{\"key\":...}`. Merge provider-required vars into `os.environ` copy (GrokSearch: `TAVILY_API_K"},{"name":"miaoko-media-unlock-test","description":"Use for MiaoKo/FQ.LA unlock PNGs; reproduce via Karing, Telegram, SSH camelia.","keywords":"Interpret MiaoKo/FQ.LA streaming-unlock PNGs and reproduce locally via Karing mixed, Telegram bot, or SSH onto camelia","tokens":31,"bodyTokens":2063,"excerpt":"# 喵速流媒体表：解读与本机/节点复测\n\n适用于 cindy 问「这种解锁色块图怎么测的 / 我怎么自己测 / 节点能 SSH 你帮我跑」：MiaoKo 自定义测试 PNG（水印常为 FQ.LA Test Center），以及本机走当前 Karing 节点、或 SSH 到自己的出口机复测。\n\n## 那张图是什么\n\n- 前端 **MiaoKo**（主端约 4.3.x）+ 后端 **miaospeed**（图脚注常见 5.0.0-beta9）。\n- 测点在脚注（例：华北-陕西联通 1Gbps）。延迟是「测点→节点」，不是家里。\n- 灰格 `N/A` = 节点没拨起来，脚本没跑。IPv6-only 在 IPv4 测点上整行灰。\n- 绿「解锁」/红「失败」是 JS 探针（goja `fetch`），**不是**登录、播片、买会员。绿 ≠ 能 4K、≠ 帐号不被风控。\n- 图里 Hy2/VLESS 机场节点 **SSH 不上去**。cindy 能登的代理出口机是 **camelia**（Phoenix Oracle `161.153.82.173`，`ss"},{"name":"newapi-gateway-key-and-omp-provider","description":"New API 网关取/建 key、配 omp models.yml provider 时用；否则勿用","keywords":"从 New API 网关站点(happycoding.xyz、abrdns、elysiver.h-e.top 等)取/新建 API key 并配置 omp models.yml provider;含「分组门控 id」(fingerprint≈kNN 自动打野组)与双协议面选择","tokens":32,"bodyTokens":4075,"excerpt":"# New API 网关取 key + 配 omp provider\n\n适用:用户给一个 New API 风格站点(`meta-title: New API`,响应头有 `X-New-Api-Version`)的 URL(常常是 `/profile`),要求「配一下 omp」。\n\n不要用浏览器自动化;登录态藏在 httpOnly cookie 里,纯 HTTP 更快。\n\n## 0. 用户直接给了 baseUrl + key(无站点后台)\n\n跳过 §1–§4,直接 §5 写 provider,然后做 §6 探测。若用户只给 IP(如 `https://43.142.91.110/v1`):\n- 先 `curl -s -o /dev/null -w \"%{http_code} %{remote_ip}\\n\" https://\u003cIP>/` 确认可达;\n- 证书可能是 **IP SAN**(`openssl s_client -connect \u003cIP>:443 -servername \u003cIP>`),若 SAN 含该 IP 则 TLS 校验通过,**不需要"},{"name":"notion-append-section-anchored","description":"Append section to published CamelliaV Notion blog post; not rewrite/new page.","keywords":"Append a new section to an already-published Notion blog post (CamelliaV の BLOG) without rewriting the page","tokens":27,"bodyTokens":1092,"excerpt":"# Append a section to an existing Notion blog post\n\nFor adding a new section to an **already-published** post in cindy's blog DB. Do not use `replace_content` — the page has images, cover, and sibling sections you must not touch.\n\n## 1. Locate the page\n\n```json\n{\"data\": {\"mode\": \"sql\",\n          \"data_source_urls\": [\"collection://c5df5738-c131-495d-aae8-e9f71831058e\"],\n          \"query\": \"SELECT url, title, summary, status FROM \\\"collection://c5df5738-c131-495d-aae8-e9f718310"},{"name":"notion-blog-publish-via-mcp","description":"Chinese tech post to Cindy's Notion blog via MCP; not other blogs.","keywords":"Publish or update a Chinese technical blog post to Cindy's Notion blog (CamelliaV の BLOG) via Notion MCP; AI-written posts must carry [临时AI稿] title prefix and a model-name callout (base id only, e.g. glm-5.3)","tokens":26,"bodyTokens":1484,"excerpt":"# Publishing to Cindy's Notion Blog (CamelliaV の BLOG)\n\nScope: Cindy's personal technical blog database on Notion (`CamelliaV の BLOG`).\n\n## 1. Gateway Activation\n\nNotion MCP is loaded lazily in omp:\n1. Write `{}` to `xd://mcp__notion_gateway` to connect and mount devices:\n   - `mcp__notion_get_tool_access`\n   - `mcp__notion_query_data_sources`\n   - `mcp__notion_fetch`\n   - `mcp__notion_create_pages`\n   - `mcp__notion_update_page`\n2. Check tool access: call `xd://mcp__notion_g"},{"name":"notionnext-fork-upstream-merge","description":"NotionNext upstream merge CamelliaV fork: conflicts, yarn/node, endspace build checks","keywords":"合并 notionnext-org/NotionNext upstream 到 CamelliaV fork（endspace 主题）：冲突面、解冲突原则、本机 yarn/node 坑、构建与锁定文章验证清单。","tokens":31,"bodyTokens":1247,"excerpt":"# 合并上游 NotionNext 到 CamelliaV fork\n\n仓库 `~/code/NotionNext`：fork 只维护 `endspace` 主题，`upstream` 指向 `notionnext-org/NotionNext`。目标是把上游 release 合进 `main` 且保留 fork 主题定制。\n\n## 1. 侦察（先别动工作区）\n\n```bash\ngit fetch --all --prune\ngit merge-base HEAD upstream/main\ngit log --oneline $(git merge-base HEAD upstream/main)..upstream/main | cat   # 上游新增\ngit log --oneline upstream/main..HEAD | cat                                  # fork 独有\ncomm -12 \u003c(git diff --name-only \u003cbase>..HEAD | sort) \u003c(git "},{"name":"notionnext-fork-upstream-merge-assessment","description":"Assess upstream-to-fork merge: diff scope, trial merge, conflicts, incompatibilities","keywords":"Assess whether/when upstream notionnext-org/NotionNext is worth merging into the endspace-based CamelliaV fork: diff scope, trial merge, conflict hotspots, incompatible changes","tokens":30,"bodyTokens":1129,"excerpt":"# NotionNext fork upstream assessment\n\nUse for: \"上游有值得更新的内容吗\" / \"要不要同步上游\" / preparing a fork merge in `~/code/NotionNext`.\n\n## 1. Establish the fork delta (never assume)\n\n```bash\ngit fetch --all --prune\ngit merge-base HEAD upstream/main\ngit rev-list --count $(git merge-base HEAD upstream/main)..upstream/main\ngit log --oneline $(git merge-base HEAD upstream/main)..upstream/main | cat\ngit log --oneline -1 upstream/main     # latest tag context\ngit describe --tags upstream/main\n"},{"name":"nowcoder-favorites-collect","description":"nowcoder 收藏 interview bodies via Chrome omp relay; don't hijack visible tab","keywords":"Drive user's real Chrome via omp browser relay to enumerate nowcoder 收藏 and extract interview-post bodies without hijacking the visible tab","tokens":24,"bodyTokens":952,"excerpt":"# 牛客收藏采集（本机 cindy 环境）\n\n## 登录态\n- omp browser relay 直接接管用户真实 Chrome（无需调试端口，Chrome 无需特殊启动）：`browser.open({name, app:{relay:true, target:\"nowcoder.com\"}})`。\n- relay down/Chrome 未开时才考虑精简 profile 复制 + headless；能接受用户配合时直接让用户开 Chrome 最省事。\n- 用户牛客 uid = 916128305（昵称 Cayena）；扫码登录用微信。\n\n## 不干扰用户\n- 永远不要对可见 tab goto 导航。先 `page = await browser.newPage()` 在 relay 连接里开新 tab，再 `browser.open({app:{relay:true, target:\"nowcoder.com\"}})` 接管它。\n\n## 为什么绝不复制 Chrome profile（实证过的死路）\n\nChrome 136+ 禁止对默认 `~"},{"name":"nowcoder-interview-to-bagu-doc","description":"牛客面经链接整理追加八股N.md时用；否则不用","keywords":"把牛客面经链接整理成 八股N.md 追加文档的完整流程（relay 抓取核对、查重交叉引用、实习总结挂钩、Docker 实机验证、mermaid/TOC 自检）","tokens":27,"bodyTokens":1082,"excerpt":"# 把牛客面经整理成 八股N.md\n\n## 目标\n在 `~/code/docs-working/interview/` 追加 `八股N.md`（N = 现有最大编号 + 1），回答面经题目，挂实习总结，上下文要实机验证过。\n\n## 1. 摸清现状（决定\"新写\"还是\"交叉引用\"）\n```bash\nls 八股*.md                    # 现有最大编号\ngrep -E '^#+ .*(关键词)' .      # 哪些题已覆盖\n```\n已覆盖的题**不要换皮重写**，在文档里显式指向：`详细展开见 面试八股问答.md Q7/Q9`、`见 八股4.md Q10/Q13`。\n\n## 2. 抓原帖核对（omp browser relay，不劫持用户可见标签）\n```js\nconst r = await browser.open({name:\"nc\", app:{relay:true}});\nconst txt = await r.run(async({browser})=>{\n  const p = await browser.newP"},{"name":"nvidia-linux-vram-overflow-freeze","description":"Linux NVIDIA VRAM freeze; NVRM hClient; safe CUDA probe; managed memory oversubscription.","keywords":"Linux NVIDIA 显存打满导致整机假死的排查：journal NVRM hClient 归因、安全 CUDA 探针（勿真打满）、managed memory 超订阅验证与加固","tokens":33,"bodyTokens":916,"excerpt":"# NVIDIA Linux VRAM 溢出「卡死」排查\n\n## 适用\nLinux NVIDIA 桌面在显存打满时整机假死/卡死（而非程序报 OOM 退出）。核心事实：Linux 驱动对 `cudaMalloc`/Vulkan/OpenGL 的普通显存分配**没有 WDDM 式 sysmem 回退**——内存条再空也不借。唯一 opt-in 回退是 Unified Memory（`cudaMallocManaged`，HMM 全功能机器上可超订阅换页）。卡死机理：VRAM 耗尽后 RM/GSP 连内部 ctx buffer / channel 都分不出来，kwin_wayland/Xwayland/plasmashell 阻塞在 nvidia ioctl → 全桌面假死，Xid=0、无重启。\n\n## 排查步骤\n1. **journal 风暴定位**：\n   - `journalctl -k --since today | grep NVRM`\n   - 时间直方图找爆发点：`journalctl -k -o short-precise --sin"},{"name":"nvidia-vaapi-firefox-sandbox-init-fail","description":"Firefox/Zen NVDEC loss, nvidia-vaapi sandbox self-detection, env relaunch, decode-path evidence without GUI.","keywords":"Fix Firefox/Zen NVDEC silent loss to nvidia-vaapi-driver sandbox self-detection; env relaunch patterns; decode-path evidence without GUI","tokens":39,"bodyTokens":922,"excerpt":"# nvidia-vaapi-driver + Firefox/Zen：沙箱探测导致硬解静默失效\n\n适用于：Arch/CachyOS + NVIDIA + Wayland，Firefox/Zen 用 `LIBVA_DRIVER_NAME=nvidia` 时怀疑「硬解没生效」，或 agent 重启浏览器后硬解丢失。\n\n## 症状与快速判据\n\n- stderr/journal：`libva error: /usr/lib/dri/nvidia_drv_video.so init failed`，nvidia-vaapi-driver 详细日志里是 `init ERROR: Potential Firefox sandbox detected, failing to init!`。\n- RDD 进程 fd 只有 `/dev/dri/renderD128`、**无 `/dev/nvidia-uvm`**；`nvidia-smi --query-compute-apps` 里没有 zen 进程；GPU `utilization.decoder` 0%。\n-"},{"name":"obsidian-shared-vault-config","description":"Use when Cindy Obsidian vault: fuse-overlayfs over .obsidian, not Override config folder","keywords":"Cindy Obsidian shared vault config: fuse-overlayfs over .obsidian, not Override config folder.","tokens":30,"bodyTokens":610,"excerpt":"# Shared Obsidian config\n\nObsidian 1.13.7 has no cross-vault config path. Settings → Files and Links → Override config folder only accepts a dot-prefixed folder **name inside the vault**. It is stored in Electron `localStorage` as `\u003cappId>-config`. The desktop FS adapter follows symlinks, but a bare symlink shares `workspace.json` too, so open windows overwrite each other.\n\n## Layout\n\n- Shared lower dir: `~/.config/obsidian-vault` (appearance, community plugins, themes, core "},{"name":"oci-region-reality-latency-probe","description":"Use for OCI region latency with Karing TUN; not generic ping.","keywords":"Measure local→Oracle (OCI) region latency for picking a Reality/A1 region when Karing TUN is running; skip for generic ping tests","tokens":27,"bodyTokens":1423,"excerpt":"# Probing OCI region latency for Reality/A1 placement (local box with Karing TUN)\n\nUse when cindy asks \"which OCI region should I open next / how's latency to region X\" from the laptop (cn1-g6). Karing TUN is up.\n\n## TUN trap (the main pitfall)\n\n- Karing catches ALL unmarked traffic into `tun0` (table 2022). Any naive ping/curl/tcp connect to an OCI IP **goes through the proxy** — it measures \"local→proxy\" (~25ms flat), not \"local→region\". Verified: unmarked TCP to `ap-seoul-"},{"name":"omp-anthropic-relay-model-add","description":"Add grok/other models to existing Anthropic-wire relay in omp models.yml","keywords":"Add grok (or other) models to an existing Anthropic-wire relay provider in omp models.yml, with wire probes, cache-dialect compat, and live verification.","tokens":27,"bodyTokens":1094,"excerpt":"# Add a grok model on an Anthropic-wire relay in omp (models.yml)\n\nUse when the user asks to add/configure a model (e.g. grok-4.6/4.7) on a relay that serves Anthropic `/v1/messages`, especially ones already present in `~/.omp/agent/models.yml` (ely, run, wong, afsmc, zzzcoding…).\n\n## Steps\n\n1. **Read current state**: `~/.omp/agent/models.yml` providers section. Check whether the relay already has an anthropic-messages provider (baseUrl without `/v1`, `api: anthropic-messages"},{"name":"omp-api-key-pool-live-verify","description":"Live-verify omp api-key pool rotation via mock relay; skip unit tests.","keywords":"Live-verify omp api-key pool rotation (apiKeys/login keys) against the real binary with a mock relay: always-429 bad key, append-only request log, hub-hosted server, 60s default-backoff window","tokens":26,"bodyTokens":1106,"excerpt":"# Live-verify omp credential-pool rotation (apiKeys / login keys) with the real binary\n\nUse when touching anything on the key-selection path (`packages/ai/src/auth-storage.ts`\npool selection, `markUsageLimitReached`/`rotateSessionCredential`, models.yml\n`apiKeys` pools) and you need wire-level proof — which bearer actually left the\nprocess, and whether blocks persist across processes.\n\n## Mock relay rules (two non-obvious traps)\n\nServe OpenAI-compat SSE from a small `bun` scr"},{"name":"omp-bash-tool-shell-rc-loading","description":"Use when OMP bash tool aliases/functions missing; login-shell snapshot cache.","keywords":"让 omp 的 bash 工具 shell 真正加载别名/函数（登录 shell + 快照缓存陷阱）","tokens":25,"bodyTokens":571,"excerpt":"# 让 omp 的 bash 工具 shell 加载你的 shell 定制\n\n## 陷阱\n\nomp 执行 bash 命令的方式和你的终端**不一样**：\n\n- omp 用 `bash -lc`（**登录 shell**）生成一次 shell 快照，缓存到\n  `/tmp/omp-shell-snapshots-1000/snapshot-bash-\u003cuuid>.sh`\n- 之后每条 bash 工具调用都在该快照里 replay（快照含 `shopt -s expand_aliases`、\n  `declare -f` 抓到的函数、PATH 等）\n- 登录 shell 只读 `/etc/profile`、`/etc/profile.d/*`、`~/.profile`，\n  **不读 `~/.bashrc`**\n\n所以改 `~/.bashrc` 里的别名/函数对工具 shell 无效；而且快照是会话级缓存的，\n旧快照不重建就一直用老环境。\n\n## 正确做法\n\n1. 把定义放到 `~/.profile`（或 `/etc/profile`），不要只放 `"},{"name":"omp-browser-relay-chrome-update","description":"For OMP Browser Relay extension updates; stale worker, /json/version, relay breakage.","keywords":"Update the OMP Browser Relay Chrome extension on cindy's box: disk install vs stale in-memory worker, /json/version check, and traps that break the live relay","tokens":28,"bodyTokens":948,"excerpt":"# 把 omp browser relay 插件更新进 Chrome（本机 cindy）\n\n## 事实\n- Chrome 以 unpacked 方式注册的唯一副本：`~/.omp/browser-relay/extension`，扩展 id `keionmnedaknhdcigefjjdoapejklddf`（`~/.config/google-chrome/Default/Preferences` 里 path 就是它）。Brave/Edge/Chromium 都没装。\n- `omp browser-relay install` 只写磁盘文件（background.js + manifest `version_name=\u003comp 版本>`），**不会**让正在运行的 Chrome 重新读代码。\n- Chrome 会继续跑它启动时载入的 service worker：改文件、重启 Chrome 都不足以换代码（见 `packages/browser-relay/README.md`）。只有 18.14.x 起的“自更新”路径能换：新版扩展在 he"},{"name":"omp-built-binary-scratch-home-verify","description":"Verify omp fork with built binary, isolated scratch home, not live ~/.omp","keywords":"Verify omp fork features via real binary against isolated scratch home without touching live ~/.omp","tokens":27,"bodyTokens":1400,"excerpt":"Prove a fork feature works in the *shipped artifact* (compiled `omp-trial`) against *real data*, on a scratch copy of the live agent home. Build the binary first via `skill://omp-trial-binary-worktree`; this skill covers the run/verify half.\n\nWhy a scratch home: the feature usually needs real history (thousands of sessions, multi-GB dbs) but must not mutate `~/.omp/agent/agent.db`, and must not run under cindy's live config while she is working. Copy, seed, isolate.\n\n## Scrat"},{"name":"omp-builtin-provider-config","description":"For built-in provider apiKey modelOverrides discovery live probes thinking metadata ClinePass quirks","keywords":"Configure an omp built-in catalog provider (apiKey + modelOverrides + discovery) and verify with live probes, including restoring thinking metadata, ClinePass gateway/product-header quirks, and scratch-home wire-capture cache traps","tokens":26,"bodyTokens":2033,"excerpt":"# Configure an omp built-in catalog provider (official OpenAI-compat API)\n\nUse when adding an official API (e.g. NVIDIA NIM, Groq, xAI, Moonshot native, Novita) for which omp already ships a catalog provider — NOT for new-api/one-api relays (see omp-newapi-gateway-setup).\n\n## 1. Check for a built-in provider first\n\n- `grep \"id: \\\"\u003cname>\\\"\" packages/catalog/src/provider-models/descriptors.ts` → CATALOG_PROVIDERS table (defaultModel, envVars, `createModelManagerOptions` factory"},{"name":"omp-camelia-arm64-replica","description":"Use when replicating x64 omp fork to camelia aarch64; not generic arm64.","keywords":"Replicate cindy's local x64 omp fork environment onto the Oracle aarch64 box camelia: cross-compile the arm64 binary, transfer config/sessions/memory, wire loopback relays, verify live","tokens":31,"bodyTokens":3509,"excerpt":"# 在 camelia (aarch64) 复刻本地 omp 环境\n\n本地 omp 是 `~/code/oh-my-pi` fork（基线上游 tag + 30 个 patch；fork 仓库**没有** GitHub release，也没有 arm64 预编译产物）。本流程把整个 agent home 复刻到 Oracle camelia。先读 `skill://oracle-camelia-proxy-ops` 拿 SSH/隧道/VPN 常识。\n\n## 事实基线（2026-09-29 实测，覆盖 2026-09-17）\n\n- camelia: Ubuntu 24.04.4 LTS, aarch64, **4 OCPU / 24 GiB**（`VM.Standard.A1.Flex`；旧笔记里的 2 vCPU
